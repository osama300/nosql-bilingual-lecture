imensional data for analysis.", "slide": 27, "hot": false}, {"id": "p2-065", "lecture": "p2", "topic_en": "Visual analysis, BI, OLTP/OLAP and RTAP", "topic_ar": "التحليل المرئي وذكاء الأعمال وOLTP/OLAP وRTAP", "type": "mcq", "q_en": "In a Real-Time Analytics Platform (RTAP), applying analytic techniques to ____ transforms data into business insights and actionable information.", "q_ar": "في منصة التحليلات في الوقت الحقيقي (RTAP)، تطبيق تقنيات التحليل على ____ يحوّل البيانات إلى رؤى أعمال ومعلومات قابلة للتنفيذ.", "answer": 3, "options": [{"en": "Data stored in a data warehouse only", "ar": "البيانات المخزنة في مستودع البيانات فقط"}, {"en": "Batch data processed overnight", "ar": "بيانات دفعية (batch) تُعالَج ليلاً"}, {"en": "Historical data of the past only", "ar": "البيانات التاريخية للماضي فقط"}, {"en": "Data in motion", "ar": "البيانات المتحركة (Data in motion)"}], "why_ar": "RTAP يحلل data in motion عبر streaming computing من مصادر متعددة بسرعات وأحجام غير مسبوقة.", "why_en": "RTAP applies analytics to data in motion using streaming computing.", "slide": 29, "hot": false}, {"id": "p2-066", "lecture": "p2", "topic_en": "Quantitative & qualitative analysis", "topic_ar": "التحليل الكمي والنوعي", "type": "mcq", "q_en": "Various analytics techniques involved in big data are quantitative analysis, qualitative analysis, and ____ analysis.", "q_ar": "تقنيات التحليل في البيانات الضخمة هي: التحليل الكمي والتحليل النوعي والتحليل ____.", "options": [{"en": "Statistical", "ar": "الإحصائي (Statistical)"}, {"en": "Descriptive", "ar": "الوصفي (Descriptive)"}, {"en": "Predictive", "ar": "التنبؤي (Predictive)"}, {"en": "Prescriptive", "ar": "التوجيهي (Prescriptive)"}], "answer": 0, "why_ar": "الإجابة Statistical؛ الشريحة 15: Quantitative, Qualitative, Statistical.", "why_en": "Statistical — slide 15 lists quantitative, qualitative and statistical analysis.", "slide": 15, "hot": false, "explain_ar": "لا تخلط: تقنيات التحليل (techniques) = Quantitative و Qualitative و Statistical. أما أنواع التحليلات (types of analytics) فهي Descriptive و Diagnostic و Predictive و Prescriptive."}, {"id": "p2-067", "lecture": "p2", "topic_en": "Quantitative & qualitative analysis", "topic_ar": "التحليل الكمي والنوعي", "type": "tf", "q_en": "A deductive analysis is performed by using the research questions to group the data under study and then look for similarities or differences in them.", "q_ar": "يتم التحليل الاستنتاجي (Deductive) باستخدام أسئلة البحث لتجميع البيانات ثم البحث عن أوجه التشابه أو الاختلاف بينها.", "answer": true, "why_ar": "صح؛ هذا تعريف Deductive. أما Inductive فيستخدم الإطار الناشئ (emergent framework) ثم يبحث عن العلاقات.", "why_en": "True — deductive uses the research questions; inductive uses the emergent framework.", "slide": 16, "hot": false, "explain_ar": "Deductive = يبدأ من أسئلة البحث ← يبحث عن تشابه/اختلاف. Inductive = يبدأ من إطار يظهر من البحث (emergent framework) ← يبحث عن العلاقات."}, {"id": "p2-068", "lecture": "p2", "topic_en": "Quantitative & qualitative analysis", "topic_ar": "التحليل الكمي والنوعي", "type": "mcq", "q_en": "Which type of qualitative analysis is used in analyzing data such as written text or a naturally occurring conversation?", "q_ar": "أي نوع من التحليل النوعي يُستخدم لتحليل بيانات مثل النص المكتوب أو المحادثة الطبيعية؟", "options": [{"en": "Content analysis", "ar": "تحليل المحتوى"}, {"en": "Narrative analysis", "ar": "التحليل السردي"}, {"en": "Discourse analysis", "ar": "تحليل الخطاب (Discourse)"}, {"en": "Framework analysis", "ar": "تحليل الإطار"}], "answer": 2, "why_ar": "الإجابة Discourse analysis.", "why_en": "Discourse analysis — written text or naturally occurring conversation.", "slide": 17, "hot": false, "explain_ar": "Content = تصنيف وجدولة وتلخيص. Narrative = تفريغ بيانات الملاحظة أو المقابلات. Discourse = نص مكتوب أو محادثة طبيعية. Framework = تحديد الإطار الأولي من المشكلة. Grounded theory = يبدأ من حالة واحدة ويعمم نظرية."}, {"id": "p2-069", "lecture": "p2", "topic_en": "Quantitative & qualitative analysis", "topic_ar": "التحليل الكمي والنوعي", "type": "tf", "q_en": "Narrative analysis is used in identifying the initial framework, which is developed from the problem in hand.", "q_ar": "يُستخدم التحليل السردي (Narrative analysis) لتحديد الإطار الأولي الذي يُطوَّر من المشكلة المطروحة.", "answer": false, "why_ar": "خطأ؛ هذا تعريف Framework analysis. أما Narrative فلتفريغ بيانات الملاحظة أو المقابلات.", "why_en": "False — that is framework analysis; narrative analysis transcribes observation/interview data.", "slide": 17, "hot": false, "correct_en": "Framework analysis is used in identifying the initial framework, which is developed from the problem in hand."}, {"id": "p2-070", "lecture": "p2", "topic_en": "Semantic analysis", "topic_ar": "التحليل الدلالي", "type": "tf", "q_en": "In text analytics, the search item (a word, a phrase, or a topic) is generally called a key term.", "q_ar": "في تحليل النصوص، يُسمى عنصر البحث (كلمة أو عبارة أو موضوع) عادةً المصطلح المفتاحي (key term).", "answer": true, "why_ar": "صح؛ الشريحة 24 (Searching and retrieval).", "why_en": "True — slide 24.", "slide": 24, "hot": false}, {"id": "p2-071", "lecture": "p2", "topic_en": "Hadoop ecosystem tools", "topic_ar": "أدوات منظومة Hadoop", "type": "tf", "q_en": "The Hive tool interacts with the Hadoop framework by sending queries through an interface such as ODBC or JDBC.", "q_ar": "تتفاعل أداة Hive مع إطار Hadoop بإرسال الاستعلامات عبر واجهة مثل ODBC أو JDBC.", "answer": true, "why_ar": "صح؛ الشريحة 7.", "why_en": "True — slide 7.", "slide": 7, "hot": false}, {"id": "p2-072", "lecture": "p2", "topic_en": "Hadoop ecosystem tools", "topic_ar": "أدوات منظومة Hadoop", "type": "tf", "q_en": "Mahout can import data into HBase and Hive.", "q_ar": "تستطيع Mahout استيراد البيانات إلى HBase و Hive.", "answer": false, "why_ar": "خطأ؛ هذه SQOOP. أما Mahout فهي خوارزميات تعلم آلة (clustering, classification, recommendation).", "why_en": "False — that is SQOOP; Mahout is a machine-learning library.", "slide": 6, "hot": false, "correct_en": "SQOOP can also import data into HBase and Hive."}, {"id": "p2-073", "lecture": "p2", "topic_en": "Semantic analysis", "topic_ar": "التحليل الدلالي", "type": "tf", "q_en": "Natural Language Generation (NLG) is the NLP stage that divides the whole input text into paragraphs, sentences, and words.", "q_ar": "توليد اللغة الطبيعية (NLG) هو مرحلة NLP التي تقسم النص المُدخل إلى فقرات وجمل وكلمات.", "answer": false, "why_ar": "خطأ؛ تقسيم النص إلى فقرات وجمل وكلمات هو Lexical analysis. و NLG مكوّن من مكوّني NLP (مع NLU) وليس مرحلة.", "why_en": "False — that is lexical analysis; NLG is a component of NLP, not a stage.", "slide": 22, "hot": false, "correct_en": "Lexical analysis involves dividing the whole input text data into paragraphs, sentences, and words.", "explain_ar": "NLP له مكوّنان: NLU و NLG. وله أربع مراحل: Lexical (التقسيم)، Syntactic (القواعد والترتيب)، Semantic (المعنى)، Pragmatic (قصد المتكلم)."}, {"id": "p2-074", "lecture": "p2", "topic_en": "Visual analysis, BI, OLAP & RTAP", "topic_ar": "التحليل المرئي و BI و OLAP و RTAP", "type": "tf", "q_en": "In the big data analytics architecture, fraud detection and risk management are examples of enhanced applications.", "q_ar": "في معمارية تحليل البيانات الضخمة، يُعد كشف الاحتيال (fraud detection) وإدارة المخاطر (risk management) أمثلة على التطبيقات المحسّنة (enhanced applications).", "answer": true, "why_ar": "صح؛ في مخطط الشريحة 30: Enhanced Applications = Customer experience, New Business Model, Financial Performance, Fraud detection, Risk Management.", "why_en": "True — listed under Enhanced Applications on slide 30.", "slide": 30, "hot": false}, {"id": "vz-001", "lecture": "vis", "topic_en": "Definition and importance", "topic_ar": "التعريف والأهمية", "type": "tf", "q_en": "Big Data Visualization is the use of charts, maps, graphs, dashboards, and interactive visual interfaces to represent large and complex datasets so that humans can identify patterns, trends, relationships, and anomalies.", "q_ar": "تصوير البيانات الضخمة (Big Data Visualization) هو استخدام المخططات والخرائط والرسوم البيانية ولوحات المعلومات (dashboards) والواجهات المرئية التفاعلية لتمثيل مجموعات بيانات كبيرة ومعقدة حتى يتمكن البشر من اكتشاف الأنماط والاتجاهات والعلاقات والحالات الشاذة (anomalies).", "answer": true, "why_ar": "صح؛ هذا هو تعريف Big Data Visualization كما ورد حرفياً في السلايد.", "why_en": "True — this is the slide definition word for word.", "slide": 2, "hot": false}, {"id": "vz-002", "lecture": "vis", "topic_en": "Definition and importance", "topic_ar": "التعريف والأهمية", "type": "tf", "q_en": "The goal of Big Data Visualization is to make data look attractive.", "q_ar": "الهدف من تصوير البيانات الضخمة (Big Data Visualization) هو جعل البيانات تبدو جذابة.", "answer": false, "correct_en": "The goal is not to make data look attractive; it is to make important information visible and analyzable.", "why_ar": "خطأ؛ الهدف ليس جعل البيانات جذابة، بل جعل المعلومات المهمة مرئية وقابلة للتحليل (visible and analyzable).", "why_en": "False — the goal is to make important information visible and analyzable, not to make data look attractive.", "explain_ar": "هذه جملة فخ مشهورة: السلايد يقول صراحة \"The goal is NOT to make data look attractive\". تذكّر الكلمتين: visible و analyzable. أي عبارة تقول إن الهدف هو الشكل الجميل أو الجاذبية فهي خطأ.", "slide": 3, "hot": false}, {"id": "vz-003", "lecture": "vis", "topic_en": "Definition and importance", "topic_ar": "التعريف والأهمية", "type": "tf", "q_en": "Big Data Visualization transforms millions of records into information that machines can understand quickly.", "q_ar": "تصوير البيانات الضخمة يحوّل ملايين السجلات إلى معلومات تستطيع الآلات (machines) فهمها بسرعة.", "answer": false, "correct_en": "Transforms millions of records into information that humans can understand quickly.", "why_ar": "خطأ؛ التصوير يحوّل السجلات إلى معلومات يفهمها البشر (humans) بسرعة، وليس الآلات.", "why_en": "False — it is information that humans, not machines, can understand quickly.", "slide": 3, "hot": false}, {"id": "vz-004", "lecture": "vis", "topic_en": "Definition and importance", "topic_ar": "التعريف والأهمية", "type": "mcq", "q_en": "Which of the following is NOT a reason why Big Data Visualization is important?", "q_ar": "أيٌّ مما يلي ليس من أسباب أهمية تصوير البيانات الضخمة (Big Data Visualization)؟", "answer": 3, "options": [{"en": "Helps discover trends, patterns, correlations, clusters, and outliers", "ar": "يساعد على اكتشاف الاتجاهات والأنماط والارتباطات والتجمعات (clusters) والقيم المتطرفة (outliers)"}, {"en": "Supports comparison across categories, locations, and time periods", "ar": "يدعم المقارنة بين الفئات والمواقع والفترات الزمنية"}, {"en": "Improves communication between data analysts, managers, researchers, and decision makers", "ar": "يحسّن التواصل بين محللي البيانات والمديرين والباحثين وصنّاع القرار"}, {"en": "Makes data look attractive, which is its main goal", "ar": "يجعل البيانات تبدو جذابة، وهذا هو هدفه الرئيسي"}], "why_ar": "الخيار الأخير خطأ؛ السلايد يقول إن الهدف ليس جعل البيانات جذابة بل جعل المعلومات المهمة مرئية وقابلة للتحليل. باقي الخيارات من نقاط الأهمية.", "why_en": "Making data attractive is explicitly NOT the goal; the other three are listed reasons.", "explain_ar": "نقاط الأهمية الخمس في السلايد: (1) تحويل ملايين السجلات لمعلومات يفهمها البشر بسرعة، (2) اكتشاف trends/patterns/correlations/clusters/outliers، (3) المقارنة عبر categories/locations/time periods، (4) القرار المبني على البيانات (data-driven) بدل الافتراضات، (5) تحسين التواصل بين المحللين والمديرين والباحثين وصنّاع القرار.", "slide": 3, "hot": false}, {"id": "vz-005", "lecture": "vis", "topic_en": "Definition and importance", "topic_ar": "التعريف والأهمية", "type": "mcq", "q_en": "Big Data Visualization enables ____ decision making instead of relying only on assumptions.", "q_ar": "تصوير البيانات الضخمة يمكّن من اتخاذ قرارات ____ بدلاً من الاعتماد فقط على الافتراضات (assumptions).", "answer": 0, "options": [{"en": "data-driven", "ar": "مبنية على البيانات (data-driven)"}, {"en": "assumption-based", "ar": "مبنية على الافتراضات (assumption-based)"}, {"en": "random", "ar": "عشوائية (random)"}, {"en": "manual", "ar": "يدوية (manual)"}], "why_ar": "الجواب data-driven؛ السلايد: Enables data-driven decision making instead of relying only on assumptions.", "why_en": "The slide says it enables data-driven decision making instead of relying only on assumptions.", "slide": 3, "hot": false}, {"id": "vz-006", "lecture": "vis", "topic_en": "Visualization techniques", "topic_ar": "تقنيات التصوير", "type": "tf", "q_en": "Hierarchical visualization techniques such as Treemap and Sunburst are used to show hierarchical relationships.", "q_ar": "تقنيات التصوير الهرمية (Hierarchical) مثل Treemap و Sunburst تُستخدم لإظهار العلاقات الهرمية.", "answer": true, "why_ar": "صح؛ Hierarchical: Treemap / Sunburst ← Hierarchical relationships.", "why_en": "True — Treemap/Sunburst are the hierarchical technique for hierarchical relationships.", "slide": 4, "hot": false}, {"id": "vz-007", "lecture": "vis", "topic_en": "Visualization techniques", "topic_ar": "تقنيات التصوير", "type": "tf", "q_en": "Network visualization uses a Node–Link Graph to show changes over time.", "q_ar": "تصوير الشبكات (Network) يستخدم رسم العقد والروابط (Node–Link Graph) لإظهار التغيرات عبر الزمن.", "answer": false, "correct_en": "Network: Node–Link Graph → Relationships and connections. (Temporal: Time Series → Changes over time.)", "why_ar": "خطأ؛ Node–Link Graph يُظهر العلاقات والروابط (relationships and connections). أما التغيرات عبر الزمن فهي لتقنية Temporal باستخدام Time Series.", "why_en": "False — Node–Link Graphs show relationships and connections; changes over time is Temporal (Time Series).", "explain_ar": "ربط سريع: Network = شبكة = عقد وخطوط بينها ← علاقات وروابط. Temporal من كلمة tempo/time ← Time Series ← تغيرات عبر الزمن. لا تخلط بينهما.", "slide": 4, "hot": false}, {"id": "vz-008", "lecture": "vis", "topic_en": "Visualization techniques", "topic_ar": "تقنيات التصوير", "type": "tf", "q_en": "Interactive visualization uses filters and drill-down for exploring data at different levels.", "q_ar": "التصوير التفاعلي (Interactive) يستخدم المرشحات (filters) والتعمق (drill-down) لاستكشاف البيانات على مستويات مختلفة.", "answer": true, "why_ar": "صح؛ Interactive: Filters / Drill-down ← Exploring data at different levels.", "why_en": "True — filters/drill-down let users explore data at different levels.", "slide": 4, "hot": false}, {"id": "vz-009", "lecture": "vis", "topic_en": "Visualization techniques", "topic_ar": "تقنيات التصوير", "type": "mcq", "q_en": "A company wants to show its sales on maps and heat maps for location-based analysis. Which technique is this?", "q_ar": "شركة تريد عرض مبيعاتها على خرائط وخرائط حرارية (heat maps) لتحليل مبني على الموقع. ما هذه التقنية؟", "answer": 1, "options": [{"en": "Temporal", "ar": "زمنية (Temporal)"}, {"en": "Geospatial", "ar": "جغرافية مكانية (Geospatial)"}, {"en": "Hierarchical", "ar": "هرمية (Hierarchical)"}, {"en": "Network", "ar": "شبكية (Network)"}], "why_ar": "الجواب Geospatial؛ Maps / Heat Maps ← Location-based analysis.", "why_en": "Geospatial uses maps/heat maps for location-based analysis.", "slide": 4, "hot": false}, {"id": "vz-010", "lecture": "vis", "topic_en": "Visualization techniques", "topic_ar": "تقنيات التصوير", "type": "mcq", "q_en": "Charts such as Bar, Line, Area, and Scatter are mainly used for:", "q_ar": "المخططات (Charts) مثل Bar و Line و Area و Scatter تُستخدم أساساً لـ:", "answer": 2, "options": [{"en": "Hierarchical relationships", "ar": "العلاقات الهرمية (Hierarchical relationships)"}, {"en": "Location-based analysis", "ar": "التحليل المبني على الموقع (Location-based analysis)"}, {"en": "Comparison and trends", "ar": "المقارنة والاتجاهات (Comparison and trends)"}, {"en": "Relationships and connections", "ar": "العلاقات والروابط (Relationships and connections)"}], "why_ar": "الجواب Comparison and trends؛ باقي الخيارات تخص Hierarchical و Geospatial و Network.", "why_en": "Charts (bar/line/area/scatter) are for comparison and trends.", "explain_ar": "احفظ الجدول كأزواج: Charts ← Comparison and trends، Geospatial ← Location، Hierarchical ← Hierarchical relationships، Network ← Relationships and connections، Temporal ← Changes over time، Interactive ← Different levels. الأستاذة تأخذ المشتتات من نفس الجدول.", "slide": 4, "hot": false}, {"id": "vz-011", "lecture": "vis", "topic_en": "Visualization techniques", "topic_ar": "تقنيات التصوير", "type": "mcq", "q_en": "Which visualization technique uses Time Series to show changes over time?", "q_ar": "أي تقنية تصوير تستخدم السلاسل الزمنية (Time Series) لإظهار التغيرات عبر الزمن؟", "answer": 3, "options": [{"en": "Network", "ar": "شبكية (Network)"}, {"en": "Geospatial", "ar": "جغرافية مكانية (Geospatial)"}, {"en": "Hierarchical", "ar": "هرمية (Hierarchical)"}, {"en": "Temporal", "ar": "زمنية (Temporal)"}], "why_ar": "الجواب Temporal؛ Time Series ← Changes over time.", "why_en": "Temporal visualization uses Time Series to show changes over time.", "slide": 4, "hot": false}, {"id": "vz-012", "lecture": "vis", "topic_en": "Visualization tools", "topic_ar": "أدوات التصوير", "type": "tf", "q_en": "Python uses Matplotlib, Plotly, and Bokeh for analysis and visualization.", "q_ar": "تستخدم Python مكتبات Matplotlib و Plotly و Bokeh للتحليل والتصوير.", "answer": true, "why_ar": "صح؛ السلايد: Python: Matplotlib, Plotly, and Bokeh for analysis and visualization.", "why_en": "True — the slide lists Matplotlib, Plotly, and Bokeh under Python.", "slide": 5, "hot": false}, {"id": "vz-013", "lecture": "vis", "topic_en": "Visualization tools", "topic_ar": "أدوات التصوير", "type": "tf", "q_en": "Apache Superset is used for monitoring metrics, time-series data, and operational systems.", "q_ar": "تُستخدم Apache Superset لمراقبة المقاييس (monitoring metrics) وبيانات السلاسل الزمنية والأنظمة التشغيلية.", "answer": false, "correct_en": "Grafana: monitoring metrics, time-series data, and operational systems. Apache Superset: open-source platform for data exploration and dashboards.", "why_ar": "خطأ؛ هذا وصف Grafana. أما Apache Superset فهي منصة مفتوحة المصدر (open-source) لاستكشاف البيانات ولوحات المعلومات.", "why_en": "False — that describes Grafana; Superset is an open-source platform for data exploration and dashboards.", "explain_ar": "ميّز بينهما: Grafana = مراقبة (monitoring) + time-series + operational systems، تخيّل شاشة مراقبة سيرفرات. Superset = open-source + data exploration + dashboards.", "slide": 5, "hot": false}, {"id": "vz-014", "lecture": "vis", "topic_en": "Visualization tools", "topic_ar": "أدوات التصوير", "type": "mcq", "q_en": "____ is used for custom web-based visualizations using JavaScript.", "q_ar": "____ تُستخدم لإنشاء تصويرات مخصصة على الويب باستخدام JavaScript.", "answer": 0, "options": [{"en": "D3.js", "ar": "D3.js"}, {"en": "Grafana", "ar": "Grafana"}, {"en": "Microsoft Power BI", "ar": "Microsoft Power BI"}, {"en": "Tableau", "ar": "Tableau"}], "why_ar": "الجواب D3.js؛ السلايد: Custom web-based visualizations using JavaScript.", "why_en": "D3.js builds custom web-based visualizations using JavaScript.", "explain_ar": "اللاحقة .js تعني JavaScript، فهذا يسهل التذكر: D3.js ← تصويرات ويب مخصصة بلغة JavaScript.", "slide": 5, "hot": false}, {"id": "vz-015", "lecture": "vis", "topic_en": "Visualization tools", "topic_ar": "أدوات التصوير", "type": "mcq", "q_en": "Which tool is used for business reports, dashboards, and connections to multiple data sources?", "q_ar": "أي أداة تُستخدم للتقارير التجارية (business reports) ولوحات المعلومات والاتصال بمصادر بيانات متعددة؟", "answer": 1, "options": [{"en": "Apache Superset", "ar": "Apache Superset"}, {"en": "Microsoft Power BI", "ar": "Microsoft Power BI"}, {"en": "D3.js", "ar": "D3.js"}, {"en": "Grafana", "ar": "Grafana"}], "why_ar": "الجواب Microsoft Power BI؛ السلايد: Business reports, dashboards, and connections to multiple data sources.", : true, "why_ar": "صح؛ هذا تعريف Worksheet كما في السلايد.", "why_en": "True — this is the slide definition of a Worksheet.", "slide": 6, "hot": false}, {"id": "vz-019", "lecture": "vis", "topic_en": "Tableau", "topic_ar": "Tableau", "type": "mcq", "q_en": "Tableau is a visual analytics platform that connects to many data sources and helps users explore data, create interactive charts, and build dashboards with ____ for common analytical tasks.", "q_ar": "Tableau منصة تحليلات مرئية تتصل بمصادر بيانات كثيرة وتساعد المستخدمين على استكشاف البيانات وإنشاء مخططات تفاعلية وبناء لوحات معلومات بـ ____ للمهام التحليلية الشائعة.", "answer": 0, "options": [{"en": "little or no programming", "ar": "قليل من البرمجة أو بدونها (little or no programming)"}, {"en": "advanced JavaScript programming", "ar": "برمجة JavaScript متقدمة"}, {"en": "a single data source only", "ar": "مصدر بيانات واحد فقط"}, {"en": "Matplotlib, Plotly, and Bokeh", "ar": "Matplotlib و Plotly و Bokeh"}], "why_ar": "الجواب little or no programming؛ هذا جزء من تعريف Tableau في السلايد.", "why_en": "The definition says Tableau works with little or no programming for common analytical tasks.", "slide": 6, "hot": false}, {"id": "vz-020", "lecture": "vis", "topic_en": "Tableau", "topic_ar": "Tableau", "type": "mcq", "q_en": "Which of the following correctly matches a Tableau term to its meaning?", "q_ar": "أيٌّ مما يلي يربط مصطلح Tableau بمعناه بشكل صحيح؟", "answer": 1, "options": [{"en": "Story — a single working area used to create one or more visualizations", "ar": "القصة (Story) — مساحة عمل واحدة تُستخدم لإنشاء تصوير واحد أو أكثر"}, {"en": "Dashboard — a collection of multiple views arranged together in one interactive screen", "ar": "لوحة المعلومات (Dashboard) — مجموعة من عدة عروض (views) مرتبة معاً في شاشة تفاعلية واحدة"}, {"en": "Worksheet — a sequence of views or dashboards used to communicate an analytical narrative", "ar": "ورقة العمل (Worksheet) — تسلسل من العروض أو لوحات المعلومات لإيصال سرد تحليلي"}, {"e const LECTURES = [
  {key:"intro",   ar:"مقدمة البيانات الضخمة", en:"Intro"},
  {key:"storage", ar:"Big Data Storage", en:"Storage"},
  {key:"nosql",   ar:"NoSQL", en:"NoSQL"},
  {key:"mongo",   ar:"MongoDB + HBase", en:"MongoDB"},
  {key:"p1",      ar:"Processing 1", en:"Processing 1"},
  {key:"p2",      ar:"Processing 2", en:"Processing 2"},
  {key:"vis",     ar:"Visualization", en:"Visualization"}
].filter(l => BANK.some(q => q.lecture === l.key));
const EXAM_COUNT = 4, EXAM_SIZE = 40;

/* ---------- storage (best effort) ---------- */
const STORE_KEY = "bigdata-final-bank-v1";
function load(){ try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch(e){ return {}; } }
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch(e){} }
const S = Object.assign({mode:"bank", lecture: LECTURES[0]?.key, ans:{}, wrong:{}, exams:{}, exam:0, order:{}}, load());

/* ---------- helpers ---------- */
const byId = Object.fromEntries(BANK.map(q => [q.id, q]));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// render `code` spans written with backticks
const fmt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffled(arr, seed){ const r = rng(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const isRight = (q, a) => q.type === "tf" ? a === q.answer : a === q.answer;

/* ---------- mock exams: disjoint slices per lecture, sized by lecture weight ---------- */
const EXAMS = (() => {
  const total = BANK.length, exams = Array.from({length: EXAM_COUNT}, () => []);
  const quotas = LECTURES.map(l => ({l, n: BANK.filter(q => q.lecture === l.key).length}));
  let alloc = quotas.map(x => ({...x, k: Math.max(1, Math.floor(EXAM_SIZE * x.n / total))}));
  let sum = alloc.reduce((s, x) => s + x.k, 0);
  const byRemainder = alloc.slice().sort((a, b) => (EXAM_SIZE * b.n / total % 1) - (EXAM_SIZE * a.n / total % 1));
  for (let i = 0; sum < EXAM_SIZE; i = (i + 1) % byRemainder.length){ byRemainder[i].k++; sum++; }
  alloc.forEach((x, li) => {
    const pool = shuffled(BANK.filter(q => q.lecture === x.l.key), 1000 + li);
    for (let e = 0; e < EXAM_COUNT; e++){
      for (let i = 0; i < x.k; i++){ const q = pool[(e * x.k + i) % pool.length]; if (q) exams[e].push(q.id); }
    }
  });
  return exams.map((ids, e) => shuffled(ids, 77 + e));
})();

/* ---------- state accessors ---------- */
function record(q, a, ctx){
  const ok = isRight(q, a);
  S.ans[q.id] = {a, ok};
  if (!ok) S.wrong[q.id] = {streak: 0};
  else if (S.wrong[q.id]) {
    if (ctx === "wrong") { S.wrong[q.id].streak = (S.wrong[q.id].streak || 0) + 1; if (S.wrong[q.id].streak >= 2) delete S.wrong[q.id]; }
  }
  save();
}

/* ---------- rendering ---------- */
const main = document.getElementById("main");
const SESSION = {}; // answers given on the "wrong" page during this visit
let visibleLimit = 60;

function stats(){
  const done = Object.keys(S.ans).length, ok = Object.values(S.ans).filter(x => x.ok).length;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><b>${BANK.length}</b><span>سؤال</span></div>
    <div class="stat"><b>${done}</b><span>حللت</span></div>
    <div class="stat"><b>${done ? Math.round(ok * 100 / done) : 0}%</b><span>دقتك</span></div>
    <div class="stat"><b>${Object.keys(S.wrong).length}</b><span>أخطاء معلقة</span></div>`;
}

function chips(){
  const el = document.getElementById("chips");
  if (S.mode === "exam"){
    el.innerHTML = EXAMS.map((ids, i) => {
      const r = S.exams[i]; const lab = r?.submitted ? ` · ${r.score}/${ids.length}` : "";
      return `<button class="chip" data-exam="${i}" aria-pressed="${S.exam === i}">نموذج ${i + 1}<span class="n">${ids.length}${lab}</span></button>`;
    }).join("");
  } else if (S.mode === "wrong") {
    el.innerHTML = "";
  } else {
    el.innerHTML = LECTURES.map(l => {
      const qs = BANK.filter(q => q.lecture === l.key), done = qs.filter(q => S.ans[q.id]).length;
      return `<button class="chip" data-lec="${l.key}" aria-pressed="${S.lecture === l.key}">${esc(l.ar)}<span class="n">${qs.length}</span><span class="pg" aria-hidden="true"><i style="width:${Math.round(done * 100 / qs.length)}%"></i></span></button>`;
    }).join("");
  }
  document.getElementById("filters").hidden = S.mode === "exam";
  document.querySelectorAll(".mode").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === S.mode));
}

function currentList(){
  if (S.mode === "exam") return EXAMS[S.exam].map(id => byId[id]);
  let list = S.mode === "wrong" ? BANK.filter(q => S.wrong[q.id] || SESSION[q.id] !== undefined) : BANK.filter(q => q.lecture === S.lecture);
  const t = document.getElementById("f-type").value, st = document.getElementById("f-state").value, hot = document.getElementById("f-hot").checked;
  if (t !== "all") list = list.filter(q => q.type === t);
  if (hot) list = list.filter(q => q.hot);
  if (st === "new") list = list.filter(q => !S.ans[q.id]);
  if (st === "bad") list = list.filter(q => S.ans[q.id] && !S.ans[q.id].ok);
  const seed = S.order[S.mode === "wrong" ? "wrong" : S.lecture];
  return seed ? shuffled(list, seed) : list;
}

function optionHTML(q, i, label, en, ar, state){
  return `<button class="opt ${state}" data-q="${q.id}" data-a="${i}" ${state && state !== "pick" ? "disabled" : ""}>
    <span class="k">${label}</span><span class="t"><span class="en">${fmt(en)}</span>${ar && ar !== en ? `<span class="ar">${fmt(ar)}</span>` : ""}</span></button>`;
}

function card(q, n, ctx){
  const examRec = ctx === "exam" ? (S.exams[S.exam] || {}) : null;
  const chosen = ctx === "exam" ? examRec.picks?.[q.id] : ctx === "wrong" ? SESSION[q.id] : S.ans[q.id]?.a;
  const reveal = ctx === "exam" ? !!examRec.submitted : chosen !== undefined;
  const lec = LECTURES.find(l => l.key === q.lecture);
  const vals = q.type === "tf" ? [true, false] : [0, 1, 2, 3];
  const opts = q.type === "tf"
    ? [["صح", "True", ""], ["خطأ", "False", ""]]
    : q.options.map((o, i) => ["ABCD"[i], o.en, o.ar]);
  const optsHTML = opts.map(([k, en, ar], i) => {
    const v = vals[i]; let st = "";
    if (reveal) { if (v === q.answer) st = "right"; else if (v === chosen) st = "wrong"; else st = "done"; }
    else if (v === chosen) st = "pick";
    const label = q.type === "tf" ? "" : k;
    const text = q.type === "tf" ? `${k} · ${en}` : en;
    return optionHTML(q, String(v), label, text, ar, st === "done" ? "x" : st);
  }).join("");
  let ansHTML = "";
  if (reveal){
    const ok = chosen !== undefined && isRight(q, chosen);
    const cls = chosen === undefined ? "neutral" : ok ? "ok" : "no";
    const verdict = chosen === undefined ? "لم تُجب" : ok ? "إجابة صحيحة ✓" : "إجابة خاطئة ✗";
    const right = q.type === "tf" ? (q.answer ? "صح (True)" : "خطأ (False)") : `${"ABCD"[q.answer]}) ${q.options[q.answer].en}`;
    ansHTML = `<div class="ans ${cls}">
      <div><span class="verdict">${verdict}</span> — الإجابة: <b dir="auto">${fmt(right)}</b></div>
      <div>${fmt(q.why_ar)}</div>
      <div class="why-en">${fmt(q.why_en)}</div>
      ${q.type === "tf" && !q.answer && q.correct_en ? `<div class="correct">${fmt(q.correct_en)}</div>` : ""}
      <div class="actions">${q.explain_ar ? `<button class="explain-btn" data-explain="${q.id}" aria-expanded="false">توضيح</button>` : ""}${ctx === "wrong" && S.wrong[q.id] ? `<button class="ghost" data-retry="${q.id}">أعد المحاولة (${S.wrong[q.id].streak || 0}/2)</button>` : ""}${ctx === "wrong" && !S.wrong[q.id] ? `<span style="color:var(--good);font-weight:600">ثبتت ✓ وخرجت من الأخطاء</span>` : ""}</div>
      ${q.explain_ar ? `<div class="explain" id="ex-${q.id}" hidden>${fmt(q.explain_ar)}</div>` : ""}
    </div>`;
  }
  const state = reveal && chosen !== undefined ? (isRight(q, chosen) ? "ok" : "no") : "";
  const slide = Array.isArray(q.slide) ? q.slide.join("، ") : q.slide;
  return `<article class="q ${state}" id="card-${q.id}">
    <div class="meta"><span class="num">${n}</span>
      <span class="tag ${q.type === "tf" ? "t-tf" : ""}">${q.type === "tf" ? "صح / خطأ" : "اختيار"}</span>
      ${q.hot ? `<span class="tag hot">🔥 من النصفي</span>` : ""}
      <span>${esc(ctx !== "bank" ? lec?.ar + " · " : "")}${esc(q.topic_ar)}</span>
      ${slide ? `<span>شريحة ${slide}</span>` : ""}</div>
    <div class="q-en" lang="en">${fmt(q.q_en)}</div>
    <div class="q-ar">${fmt(q.q_ar)}</div>
    <div class="opts ${q.type === "tf" ? "tf" : ""}">${optsHTML}</div>
    ${ansHTML}
  </article>`;
}

function render(){
  stats(); chips();
  const list = currentList();
  let head = "";
  if (S.mode === "bank"){
    const l = LECTURES.find(x => x.key === S.lecture);
    head = `<div class="intro"><b>${esc(l.ar)}</b> — اختر إجابتك فتظهر الإجابة الصحيحة وسببها بالعربي والإنجليزي. زر <b>توضيح</b> يظهر في الأسئلة اللي تحتاج شرح أعمق. الأسئلة المعلّمة 🔥 فكرتها جاءت في نماذج النصفي.</div>`;
  } else if (S.mode === "wrong"){
    head = `<div class="intro"><b>أخطائي</b> — كل سؤال أخطأت فيه يبقى هنا إلى أن تجيبه صح <b>مرتين متتاليتين</b> من هذه الصفحة.</div>`;
  } else {
    const r = S.exams[S.exam] || {}, picks = r.picks || {}, answered = Object.keys(picks).length;
    head = r.submitted
      ? `<div class="exam-bar"><div><span class="score">${r.score} / ${list.length}</span> <span>(${Math.round(r.score * 100 / list.length)}%)</span><div style="font-size:.85rem;color:var(--muted)">الأخطاء أضيفت لصفحة «أخطائي».</div></div><button class="ghost" id="exam-retry">إعادة النموذج</button></div>`
      : `<div class="exam-bar"><div><b>نموذج ${S.exam + 1}</b> — ${list.length} سؤال موزعة على المحاضرات بنسبة حجمها. الإجابات تظهر بعد التسليم.<div style="font-size:.85rem;color:var(--muted)">أجبت ${answered} من ${list.length}</div></div><button class="primary" id="exam-submit">سلّم وصحّح</button></div>`;
  }
  if (!list.length){
    main.innerHTML = head + `<div class="empty">${S.mode === "wrong" ? "لا توجد أخطاء معلقة. أحسنت." : "لا توجد أسئلة بهذا الفلتر."}</div>`;
    return;
  }
  const ctx = S.mode;
  const shown = ctx === "exam" ? list : list.slice(0, visibleLimit);
  main.innerHTML = head + `<div class="list">${shown.map((q, i) => card(q, i + 1, ctx)).join("")}</div>` +
    (shown.length < list.length ? `<div class="more"><button class="ghost" id="more">عرض المزيد (${list.length - shown.length})</button></div>` : "");
}

function rerenderCard(q, n){
  const el = document.getElementById("card-" + q.id); if (!el) return render();
  const tmp = document.createElement("div"); tmp.innerHTML = card(q, n, S.mode);
  el.replaceWith(tmp.firstElementChild); stats();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.mode){ S.mode = t.dataset.mode; visibleLimit = 60; save(); render(); scrollTo({top: 0}); return; }
  if (t.dataset.lec){ S.lecture = t.dataset.lec; visibleLimit = 60; save(); render(); scrollTo({top: 0}); return; }
  if (t.dataset.exam !== undefined){ S.exam = +t.dataset.exam; save(); render(); scrollTo({top: 0}); return; }
  if (t.dataset.retry){ const q = byId[t.dataset.retry]; delete SESSION[q.id]; rerenderCard(q, t.closest(".q").querySelector(".num").textContent); return; }
  if (t.dataset.explain){ const box = document.getElementById("ex-" + t.dataset.explain); box.hidden = !box.hidden; t.setAttribute("aria-expanded", String(!box.hidden)); t.textContent = box.hidden ? "توضيح" : "إخفاء التوضيح"; return; }
  if (t.dataset.q){
    const q = byId[t.dataset.q]; const raw = t.dataset.a; const a = q.type === "tf" ? raw === "true" : +raw;
    const n = t.closest(".q").querySelector(".num").textContent;
    if (S.mode === "exam"){
      const r = S.exams[S.exam] = S.exams[S.exam] || {picks: {}}; if (r.submitted) return;
      r.picks = r.picks || {}; r.picks[q.id] = a; save();
      rerenderCard(q, n); const bar = main.querySelector(".exam-bar div div"); if (bar) bar.textContent = `أجبت ${Object.keys(r.picks).length} من ${EXAMS[S.exam].length}`;
      return;
    }
    if (S.mode === "wrong"){ if (SESSION[q.id] !== undefined) return; SESSION[q.id] = a; }
    else if (S.ans[q.id]) return;
    record(q, a, S.mode); rerenderCard(q, n); return;
  }
  if (t.id === "exam-submit"){
    const r = S.exams[S.exam] = S.exams[S.exam] || {picks: {}}; const ids = EXAMS[S.exam];
    r.score = ids.filter(id => r.picks?.[id] !== undefined && isRight(byId[id], r.picks[id])).length; r.submitted = true;
    ids.forEach(id => { const q = byId[id], a = r.picks?.[id]; if (a !== undefined) record(q, a, "exam"); else S.wrong[id] = {streak: 0}; });
    save(); render(); scrollTo({top: 0}); return;
  }
  if (t.id === "exam-retry"){ S.exams[S.exam] = {picks: {}}; save(); render(); scrollTo({top: 0}); return; }
  if (t.id === "more"){ visibleLimit += 60; render(); return; }
  if (t.id === "shuffle"){ S.order[S.mode === "wrong" ? "wrong" : S.lecture] = Math.floor(Math.random() * 1e9); save(); render(); return; }
  if (t.id === "reset"){
    if (t.dataset.armed !== "1"){ t.dataset.armed = "1"; t.textContent = "اضغط مرة ثانية للتأكيد"; setTimeout(() => { t.dataset.armed = ""; t.textContent = "مسح إجابات هذا القسم"; }, 3000); return; }
    currentList().forEach(q => { delete S.ans[q.id]; }); save(); render(); return;
  }
});
["f-type", "f-state", "f-hot"].forEach(id => document.getElementById(id).addEventListener("change", () => { visibleLimit = 60; render(); }));
render();
</script>
