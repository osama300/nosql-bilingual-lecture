aph)", "type": "tf", "q_en": "The data model of a graph database is nodes and edges.", "q_ar": "نموذج البيانات في قاعدة البيانات الرسومية هو العقد والحواف (nodes and edges).", "answer": true, "why_ar": "صحيح؛ نموذج Graph يتكون من عقد (nodes) وحواف (edges).", "why_en": "True — graph data model: nodes and edges.", "slide": 32, "hot": false}, {"id": "ns-058", "lecture": "nosql", "topic_en": "Graph databases", "topic_ar": "قواعد البيانات الرسومية (Graph)", "type": "tf", "q_en": "In graph databases, edges may have properties (including ID), and nodes may have labels or roles.", "q_ar": "في قواعد البيانات الرسومية، قد تحتوي الحواف على خصائص (بما فيها المعرّف ID)، وقد تحتوي العقد على تسميات أو أدوار (labels or roles).", "answer": false, "correct_en": "Nodes may have properties (including ID); edges may have labels or roles.", "why_ar": "خطأ؛ العكس: العقد (nodes) لها خصائص بما فيها ID، والحواف (edges) لها تسميات أو أدوار.", "why_en": "False — reversed: nodes have properties (including ID); edges have labels or roles.", "explain_ar": "تخيّل شبكة اجتماعية: العقدة = شخص له خصائص (الاسم، العمر، ID)، والحافة = العلاقة بينهما ولها تسمية/دور مثل «صديق» أو «يعمل لدى».", "slide": 32, "hot": false}, {"id": "ns-059", "lecture": "nosql", "topic_en": "Graph databases", "topic_ar": "قواعد البيانات الرسومية (Graph)", "type": "tf", "q_en": "RDF \"triple stores\" can map to graph databases.", "q_ar": "مخازن RDF الثلاثية (triple stores) يمكن أن تُربط (map) بقواعد البيانات الرسومية.", "answer": true, "why_ar": "صحيح؛ مخازن RDF الثلاثية يمكن تمثيلها كقواعد بيانات رسومية.", "why_en": "True — RDF triple stores can map to graph databases.", "slide": 33, "hot": false}, {"id": "ns-060", "lecture": "nosql", "topic_en": "Graph databases", "topic_ar": "قواعد البيانات الرسومية (Graph)", "type": "tf", "q_en": "Graph databases are a good choice when you need to store and process massive amounts of time-series numeric data.", "q_ar": "قواعد البيانات الرسومية خيار جيد عندما تحتاج إلى تخزين ومعالجة كميات ضخمة من البيانات الرقمية الزمنية (time-series).", "answer": false, "correct_en": "Graph – When NOT to use: you need to store and process massive amounts of time-series numeric data (column-family better).", "why_ar": "خطأ؛ هذه من حالات عدم استخدام Graph، والأفضل لها Column-family.", "why_en": "False — this is a 'when NOT to use' for graph; column-family is better for time-series.", "slide": 36, "hot": false}, {"id": "ns-061", "lecture": "nosql", "topic_en": "Graph databases", "topic_ar": "قواعد البيانات الرسومية (Graph)", "type": "mcq", "q_en": "Which of the following are example graph database systems?", "q_ar": "أيٌّ مما يلي أمثلة على أنظمة قواعد البيانات الرسومية؟", "answer": 0, "options": [{"en": "Neo4j, FlockDB, Pregel", "ar": "Neo4j و FlockDB و Pregel"}, {"en": "DynamoDB, Voldemort, Scalaris", "ar": "DynamoDB و Voldemort و Scalaris"}, {"en": "CouchDB, MongoDB, SimpleDB", "ar": "CouchDB و MongoDB و SimpleDB"}, {"en": "Cassandra, HBase, BigTable", "ar": "Cassandra و HBase و BigTable"}], "why_ar": "أمثلة Graph: Neo4j و FlockDB و Pregel، وواجهاتها ولغات استعلامها تختلف (خطوة واحدة، path expressions، أو تكرار كامل).", "why_en": "Graph examples: Neo4j, FlockDB, Pregel.", "slide": 33, "hot": false}, {"id": "ns-062", "lecture": "nosql", "topic_en": "Graph databases", "topic_ar": "قواعد البيانات الرسومية (Graph)", "type": "mcq", "q_en": "Which of the following is a use case of graph databases?", "q_ar": "أيٌّ مما يلي حالة استخدام لقواعد البيانات الرسومية؟", "answer": 1, "options": [{"en": "Session stores – fast user session retrieval by session ID", "ar": "مخازن الجلسات – استرجاع سريع لجلسة المستخدم بمعرّف الجلسة"}, {"en": "Social networks – friends of friends, influencer detection", "ar": "الشبكات الاجتماعية – أصدقاء الأصدقاء، واكتشاف المؤثرين"}, {"en": "Event logging", "ar": "تسجيل الأحداث (Event logging)"}, {"en": "Time-series data – sensor streams, stock tick data", "ar": "البيانات الزمنية – تدفقات الحساسات وبيانات الأسهم"}], "why_ar": "الشبكات الاجتماعية من حالات اس pe": "mcq", "q_en": "Which of the following is NOT a Data Definition Language (DDL) command in HBase?", "q_ar": "أيٌّ مما يلي ليس من أوامر لغة تعريف البيانات (DDL) في HBase؟", "answer": 3, "options": [{"en": "create", "ar": "create"}, {"en": "disable", "ar": "disable"}, {"en": "exists", "ar": "exists"}, {"en": "scan", "ar": "scan"}], "why_ar": "scan من أوامر DML (معالجة البيانات)، أما create و disable و exists فمن DDL.", "why_en": "scan is a DML command; create, disable and exists are DDL.", "explain_ar": "DDL تتعامل مع الجدول نفسه: create, list, disable, alter, exists, drop, truncate. DML تتعامل مع البيانات داخله: put, get, delete, deleteall, scan, count.", "slide": [32, 33], "hot": false}, {"id": "mg-054", "lecture": "mongo", "topic_en": "HBase DDL & DML commands", "topic_ar": "أوامر DDL و DML في HBase", "type": "mcq", "q_en": "____ deletes all the cells in a given row.", "q_ar": "____ يحذف جميع الخلايا (cells) في صف معين.", "answer": 0, "options": [{"en": "deleteall", "ar": "deleteall"}, {"en": "delete", "ar": "delete"}, {"en": "drop", "ar": "drop"}, {"en": "truncate", "ar": "truncate"}], "why_ar": "deleteall يحذف كل خلايا الصف، أما delete فيحذف قيمة خلية واحدة، و drop يحذف الجدول.", "why_en": "deleteall deletes all cells in a row; delete deletes one cell value.", "slide": [32, 33], "hot": false}, {"id": "mg-055", "lecture": "mongo", "topic_en": "HBase DDL & DML commands", "topic_ar": "أوامر DDL و DML في HBase", "type": "mcq", "q_en": "In the HBase command put 'emp','1','personal data:name','raju' — what is '1'?", "q_ar": "في أمر HBase التالي: put 'emp','1','personal data:name','raju' — ماذا يمثل '1'؟", "answer": 1, "options": [{"en": "The column family", "ar": "عائلة الأعمدة (column family)"}, {"en": "The row", "ar": "الصف (row)"}, {"en": "The table", "ar": "الجدول (table)"}, {"en": "The cell value", "ar": "قيمة الخلية (cell value)"}], "why_ar": "الصيغة: put 'الجدول','الصف','column family:column','القيمة'؛ إذن '1' هو الصف، و emp الجدول، و raju القيمة.", "why_en": "put puts a cell value at a specified column in a specified row in a table: put 'table','row','family:column','value'.", "explain_ar": "put هو أمر DML يضع قيمة خلية في عمود محدد داخل صف محدد في جدول. في المثال: emp = الجدول، 1 = الصف، personal data = column family، name = العمود، raju = القيمة.", "slide": [33, 34], "hot": false}, {"id": "mg-056", "lecture": "mongo", "topic_en": "Query operators", "topic_ar": "معاملات الاستعلام", "type": "mcq", "q_en": "Which operator matches values that are less than or equal to a specified value?", "q_ar": "أي معامل يطابق القيم الأصغر من أو تساوي قيمة محددة؟", "options": [{"en": "$lt", "ar": "$lt"}, {"en": "$lte", "ar": "$lte"}, {"en": "$gte", "ar": "$gte"}, {"en": "$ne", "ar": "$ne"}], "answer": 1, "why_ar": "الإجابة $lte (less than or equal).", "why_en": "$lte — less than or equal.", "slide": 21, "hot": false, "explain_ar": "القاعدة: الحرف e في الآخر = equal. $lt أصغر، $lte أصغر أو يساوي، $gt أكبر، $gte أكبر أو يساوي، $ne لا يساوي."}, {"id": "mg-057", "lecture": "mongo", "topic_en": "Query operators", "topic_ar": "معاملات الاستعلام", "type": "mcq", "q_en": "Which operator matches values that are equal to a specified value?", "q_ar": "أي معامل يطابق القيم التي تساوي قيمة محددة؟", "options": [{"en": "$eq", "ar": "$eq"}, {"en": "$in", "ar": "$in"}, {"en": "$ne", "ar": "$ne"}, {"en": "$nin", "ar": "$nin"}], "answer": 0, "why_ar": "الإجابة $eq (equal).", "why_en": "$eq — equal.", "slide": 21, "hot": false}, {"id": "mg-058", "lecture": "mongo", "topic_en": "Query operators", "topic_ar": "معاملات الاستعلام", "type": "tf", "q_en": "$and inverts the effect of a query expression and returns documents that do not match the query expression.", "q_ar": "المعامل $and يعكس أثر تعبير الاستعلام ويعيد المستندات التي لا تطابقه.", "answer": false, "why_ar": "خطأ؛ هذا وصف $not. أما $and فيعيد المستندات التي تطابق الشرطين معًا.", "why_en": "False — that is $not; $and returns documents matching both clauses.", "slide": 22, "hot": false, "correct_en": "$not inverts the effect of a query expression and returns documents that do not match the query expression."}, {"id": "mg-059", "lecture": "mongo", "topic_en": "Query operators", "topic_ar": "معاملات الاستعلام", "type": "tf", "q_en": "$nor joins query clauses and returns all documents that match the conditions of either clause.", "q_ar": "المعامل $nor يربط شروط الاستعلام ويعيد كل المستندات التي تطابق أيًّا من الشرطين.", "answer": false, "why_ar": "خطأ؛ هذا وصف $or. أما $nor فيعيد المستندات التي لا تطابق أيًّا من الشرطين (fail to match both).", "why_en": "False — that is $or; $nor returns documents that fail to match both clauses.", "slide": 22, "hot": false, "correct_en": "$nor joins query clauses with a logical NOR and returns all documents that fail to match both clauses.", "explain_ar": "$and = تطابق الشرطين معًا، $or = تطابق أيًّا منهما، $nor = لا تطابق أيًّا منهما (عكس $or)، $not = يعكس تعبيرًا واحدًا."}, {"id": "mg-060", "lecture": "mongo", "topic_en": "CRUD operations", "topic_ar": "عمليات CRUD", "type": "tf", "q_en": "In the CRUD slide, db.collection.remove(<query>, <justOne>) is listed under the Delete operation.", "q_ar": "في شريحة CRUD، يُذكر الأمر db.collection.remove(<query>, <justOne>) تحت عملية الحذف (Delete).", "answer": true, "why_ar": "صح؛ الشريحة 13: Delete → db.collection.remove(<query>, <justOne>).", "why_en": "True — slide 13 lists remove() under Delete.", "slide": 13, "hot": false}, {"id": "p1-001", "lecture": "p1", "topic_en": "Data processing and the processing cycle", "topic_ar": "معالجة البيانات ودورة المعالجة", "type": "tf", "q_en": "Data becomes information only when it undergoes a process by which it is manipulated and organized.", "q_ar": "تصبح البيانات معلومات (information) فقط عندما تخضع لعملية يتم فيها معالجتها وتنظيمها.", "answer": true, "why_en": "True — verbatim from the slide.", "why_ar": "صحيح؛ هذا نص الشريحة حرفياً: البيانات لا تصبح معلومات إلا بعد معالجتها وتنظيمها.", "slide": 2, "hot": false}, {"id": "p1-002", "lecture": "p1", "topic_en": "Data processing and the processing cycle", "topic_ar": "معالجة البيانات ودورة المعالجة", "type": "tf", "q_en": "There are basically two different types of data processing, namely, centralized and parallel data processing.", "q_ar": "يوجد نوعان أساسيان لمعالجة البيانات، هما: المعالجة المركزية (centralized) والمعالجة المتوازية (parallel).", "answer": false, "correct_en": "There are basically two different types of data processing, namely, centralized and distributed data processing.", "why_en": "False — the two types are centralized and distributed data processing.", "why_ar": "خطأ؛ النوعان هما المركزية (centralized) والموزعة (distributed)، وليس المتوازية.", "slide": 2, "hot": false}, {"id": "p1-003", "lecture": "p1", "topic_en": "Data processing and the processing cycle", "topic_ar": "معالجة البيانات ودورة المعالجة", "type": "mcq", "q_en": "Which of the following is NOT one of the four stages of the data processing cycle?", "q_ar": "أيٌّ مما يلي ليس من المراحل الأربع لدورة معالجة البيانات (data processing cycle)؟", "options": [{"en": "Data Input", "ar": "إدخال البيانات (Data Input)"}, {"en": "Data Storage", "ar": "تخزين البيانات (Data Storage)"}, {"en": "Data Visualization", "ar": "تصوير البيانات (Data Visualization)"}, {"en": "Data Output", "ar": "إخراج البيانات (Data Output)"}], "answer": 2, "why_en": "The four stages are Data Input, Data Processing, Data Storage and Data Output.", "why_ar": "المراحل الأربع هي: Input ثم Processing ثم Storage ثم Output؛ ولا توجد مرحلة Visualization.", "explain_ar": "احفظ الترتيب كأنه حاسوب بسيط: إدخال ← معالجة ← تخزين ← إخراج (Input → Processing → Storage → Output). أي خيار خارج هذه الأربع هو الجواب في سؤال NOT.", "slide": 3, "hot": false}, {"id": "p1-004", "lecture": "p1", "topic_en": "Data processing and the processing cycle", "topic_ar": "معالجة البيانات ودورة المعالجة", "type": "mcq", "q_en": "Retrieval, Archival, and Governance are sub-steps of which stage of the data processing cycle?", "q_ar": "الاسترجاع (Retrieval) والأرشفة (Archival) والحوكمة (Governance) خطوات فرعية لأي مرحلة من دورة معالجة البيانات؟", "options": [{"en": "Data Input", "ar": "إدخال البيانات (Data Input)"}, {"en": "Data Processing", "ar": "معالجة البيانات (Data Processing)"}, {"en": "Data Storage", "ar": "تخزين البيانات (Data Storage)"}, {"en": "Data Output", "ar": "إخراج البيانات (Data Output)"}], "answer": 2, "why_en": "Data Storage contains Storage, Retrieval, Archival and Governance.", "why_ar": "مرحلة التخزين (Data Storage) تضم: Storage و Retrieval و Archival و Governance.", "explain_ar": "فرّق بين المراحل من خطواتها: Input = capturing و collection و transmission، Processing = classify و sort/merge و mathematical operations و transform، Storage = storage و retrieval و archival و governance، Output = advanced computing و format و present.", "slide": 3, "hot": false}, {"id": "p1-005", "lecture": "p1", "topic_en": "Data processing and the processing cycle", "topic_ar": "معالجة البيانات ودورة المعالجة", "type": "tf", "q_en": "Data has to be stored only if the storage cost exceeds the value of storing them for future use.", "q_ar": "يجب تخزين البيانات فقط إذا كانت تكلفة التخزين (storage cost) تتجاوز قيمة تخزينها للاستخدام المستقبلي.", "answer": false, "correct_en": "Data has to be stored only if the value of storing them for future use exceeds the storage cost.", "why_en": "False — data is stored only if the value of storing it exceeds the storage cost.", "why_ar": "خطأ؛ العكس هو الصحيح: نخزّن البيانات فقط إذا كانت قيمة تخزينها للمستقبل أكبر من تكلفة التخزين.", "explain_ar": "منطق تجاري بسيط: لا تدفع على تخزين شيء أكثر مما يساويه. الفخ هنا هو قلب طرفي المقارنة (value ↔ cost).", "slide": 4, "hot": false}, {"id": "p1-006", "lecture": "p1", "topic_en": "Data processing and the processing cycle", "topic_ar": "معالجة البيانات ودورة المعالجة", "type": "tf", "q_en": "With the increase in big data volume, moving the data between the computing and the storage layers for storage and manipulation has always been a challenging task.", "q_ar": "مع زيادة حجم البيانات الضخمة، كان نقل البيانات بين طبقتي الحوسبة (computing) والتخزين (storage) للتخزين والمعالجة دائماً مهمة صعبة.", "answer": true, "why_en": "True — the slide names this as the challenge of big data volume.", "why_ar": "صحيح؛ الشريحة تذكر أن نقل البيانات بين طبقة الحوسبة وطبقة التخزين أصبح تحدياً مع تضخم الحجم.", "slide": 4, "hot": false}, {"id": "p1-007", "lecture": "p1", "topic_en": "Centralized vs distributed processing architectures", "topic_ar": "المعالجة المركزية مقابل الموزعة ومعمارياتها", "type": "tf", "q_en": "Centralized data processing mandates data collection to be at one central location.", "q_ar": "المعالجة المركزية للبيانات (Centralized data processing) تُلزم بأن يكون جمع البيانات في موقع مركزي واحد.", "answer": true, "why_en": "True — centralized processing keeps data collection at one central location.", "why_ar": "صحيح؛ المركزية = جمع البيانات في مكان مركزي واحد، أما الموزعة فتوزعها على مواقع فعلية مختلفة.", "slide": 5, "hot": false}, {"id": "p1-008", "lecture": "p1", "topic_en": "Centralized vs distributed processing architectures", "topic_ar": "المعالجة المركزية مقابل الموزعة ومعمارياتها", "type": "tf", "q_en": "In client-server architecture, the server manages the data collection and its presentation while data processing and management are handled by the client.", "q_ar": "في معمارية العميل-الخادم (client-server)، يدير الخادم جمع البيانات وعرضها بينما يتولى العميل معالجة البيانات وإدارتها.", "answer": false, "correct_en": "In client-server architecture, client manages the data collection and its presentation while data processing and management are handled by the server.", "why_en": "False — the roles are swapped: the client handles collection and presentation; the server handles processing and management.", "why_ar": "خطأ؛ الأدوار معكوسة: العميل (client) يجمع البيانات ويعرضها، والخادم (server) يعالجها ويديرها.", "explain_ar": "تذكّر: العميل هو ما يراه المستخدم (واجهة: جمع + عرض)، والخادم هو ال es", "topic_ar": "المعالجة المركزية مقابل الموزعة ومعمارياتها", "type": "tf", "q_en": "Cluster is an architecture where machines are connected together to form a network and process the computation in sequential fashion to reduce latency.", "q_ar": "العنقود (Cluster) معمارية تتصل فيها الأجهزة معاً لتكوين شبكة وتعالج الحسابات بشكل تسلسلي (sequential) لتقليل التأخير.", "answer": false, "correct_en": "Cluster is an architecture where machines are connected together to form a network and process the computation in parallel fashion to reduce latency.", "why_en": "False — a cluster processes the computation in parallel fashion to reduce latency.", "why_ar": "خطأ؛ العنقود يعالج الحسابات بشكل متوازٍ (parallel) وليس تسلسلياً، وهذا ما يقلل التأخير.", "explain_ar": "لاحظ التضاد: client-server تُسبب latency، أما cluster فتقلل latency لأنها تعالج بالتوازي. المعالجة التسلسلية لا تقلل التأخير أصلاً.", "slide": 6, "hot": false}, {"id": "p1-014", "lecture": "p1", "topic_en": "Shared everything vs shared-nothing", "topic_ar": "المشاركة الكاملة مقابل عدم المشاركة", "type": "tf", "q_en": "Shared everything architecture is a type of system architecture sharing all the resources such as storage, memory, and processor.", "q_ar": "معمارية المشاركة الكاملة (Shared everything) نوع من معماريات الأنظمة يتشارك فيه جميع الموارد مثل التخزين والذاكرة والمعالج.", "answer": true, "why_en": "True — verbatim definition of shared everything.", "why_ar": "صحيح؛ في Shared everything تُشارك كل الموارد: التخزين والذاكرة والمعالج.", "slide": 7, "hot": false}, {"id": "p1-015", "lecture": "p1", "topic_en": "Shared everything vs shared-nothing", "topic_ar": "المشاركة الكاملة مقابل عدم المشاركة", "type": "tf", "q_en": "Shared everything architecture improves scalability.", "q_ar": "معمارية المشاركة الكاملة (Shared everything) تحسّن قابلية التوسع (scalability).", "answer": false, "correct_en": "Shared everything architecture is a type of system architecture sharing all the resources such as storage, memory, and : "____ نوع من المعالجة تُنفَّذ فيه سلسلة من المهام المترابطة منطقياً بشكل تسلسلي أو متوازٍ، ثم تُجمع مخرجات المهام الفردية لتعطي مخرجاً نهائياً.", "options": [{"en": "Real-time data processing", "ar": "المعالجة الآنية (Real-time data processing)"}, {"en": "Centralized data processing", "ar": "المعالجة المركزية (Centralized data processing)"}, {"en": "Batch processing", "ar": "المعالجة الدفعية (Batch processing)"}, {"en": "Data virtualization", "ar": "افتراضية البيانات (Data virtualization)"}], "answer": 2, "why_en": "This is the definition of batch processing.", "why_ar": "هذا تعريف المعالجة الدفعية (Batch processing): مهام مترابطة تُنفذ ثم تُجمع مخرجاتها.", "explain_ar": "الكلمات المفتاحية للدفعية: series of jobs و logically connected و put together to give a final output. أما الآنية فكلماتها: continual data flow و in-memory و streaming.", "slide": 9, "hot": false}, {"id": "p1-023", "lecture": "p1", "topic_en": "Parallel vs distributed computing", "topic_ar": "الحوسبة المتوازية مقابل الموزعة", "type": "tf", "q_en": "In parallel computing, the execution of subtasks is carried out on multiple processors within a single machine.", "q_ar": "في الحوسبة المتوازية (Parallel computing)، يتم تنفيذ المهام الفرعية على معالجات متعددة داخل جهاز واحد.", "answer": true, "why_en": "True — parallel computing uses multiple processors in a single machine.", "why_ar": "صحيح؛ المتوازية = عدة معالجات داخل جهاز واحد (single machine).", "slide": 11, "hot": false}, {"id": "p1-024", "lecture": "p1", "topic_en": "Parallel vs distributed computing", "topic_ar": "الحوسبة المتوازية مقابل الموزعة", "type": "tf", "q_en": "In parallel computing, the execution of subtasks takes place in separate machines networked together forming a cluster.", "q_ar": "في الحوسبة المتوازية، يتم تنفيذ المهام الفرعية على أجهزة منفصلة متصلة بالشبكة مكوّنةً عنقوداً (cluster).", "answer": false, "correct_en": "Distributed computing, similar to parallel computing, splits up larger tasks into subtasks, but the execution Hadoop وتاريخه", "type": "tf", "q_en": "The Hadoop project was funded by Google.", "q_ar": "تم تمويل مشروع Hadoop من قبل Google.", "answer": false, "why_ar": "خطأ؛ المشروع موّلته Yahoo، ثم في 2006 أعطته Yahoo لـ Apache. (Google طوّرت GFS و MapReduce فقط.)", "why_en": "False — it was funded by Yahoo.", "slide": 23, "hot": false, "correct_en": "The project was funded by Yahoo.", "explain_ar": "فخ متوقع: Google طوّرت Google File System و MapReduce (فكرة)، لكن Hadoop طوّره Doug Cutting و Michael J. Cafarella لمشروع Nutch بتمويل Yahoo، وفي 2006 انتقل إلى Apache."}, {"id": "p1-066", "lecture": "p1", "topic_en": "Hadoop ecosystem & advantages", "topic_ar": "منظومة Hadoop ومزاياه", "type": "mcq", "q_en": "In the Hadoop ecosystem diagram, which of the following appears as a vertical bar that spans all layers?", "q_ar": "في مخطط منظومة Hadoop، أي مما يلي يظهر كعمود رأسي يمتد عبر كل الطبقات؟", "options": [{"en": "Security", "ar": "الأمان (Security)"}, {"en": "Pig", "ar": "Pig"}, {"en": "HDFS", "ar": "HDFS"}, {"en": "JVM", "ar": "JVM"}], "answer": 0, "why_ar": "الإجابة Security؛ الأعمدة الرأسية: Backup & Recovery و Deployment و Security و Management.", "why_en": "Security — the vertical bars are Backup & Recovery, Deployment, Security and Management.", "slide": 28, "hot": false}, {"id": "p2-001", "lecture": "p2", "topic_en": "Hadoop Writable types and MapReduce input formats", "topic_ar": "أنواع Writable في Hadoop وصيغ إدخال MapReduce", "type": "tf", "q_en": "In TextInputFormat, the key is of IntWritable type, and it is the byte offset of the starting of the line within the entire file.", "q_ar": "في TextInputFormat يكون المفتاح (key) من نوع IntWritable، وهو إزاحة البايت (byte offset) لبداية السطر داخل الملف كاملاً.", "answer": false, "correct_en": "The key is of LongWritable type, and it is the byte offset of the starting of the line within the entire file.", "why_ar": "خطأ؛ المفتاح من نوع LongWritable وليس IntWritable.", "why_en": "False — the key is of LongWritable type, not IntWritable.", "explain_ar": "الفخ هنا تبديل كلمة واحدة: Int بدل Long. تذكّر: الإزاحة داخل ملف ضخم قد تكون رقماً كبيراً جداً، لذلك تحتاج نوعاً طويلاً (Long) ← LongWritable.", "slide": 4, "hot": false}, {"id": "p2-002", "lecture": "p2", "topic_en": "Hadoop Writable types and MapReduce input formats", "topic_ar": "أنواع Writable في Hadoop وصيغ إدخال MapReduce", "type": "tf", "q_en": "In TextInputFormat, the given input file is broken into lines, and each line is divided into key-value pairs.", "q_ar": "في TextInputFormat يُقسَّم ملف الإدخال إلى أسطر (lines)، ويُقسَّم كل سطر إلى أزواج مفتاح-قيمة (key-value pairs).", "answer": true, "why_ar": "صح؛ هذه جملة السلايد حرفياً: الملف يُقسم إلى أسطر وكل سطر إلى key-value.", "why_en": "True — the file is broken into lines and each line into key-value pairs.", "slide": 4, "hot": false}, {"id": "p2-003", "lecture": "p2", "topic_en": "Hadoop Writable types and MapReduce input formats", "topic_ar": "أنواع Writable في Hadoop وصيغ إدخال MapReduce", "type": "mcq", "q_en": "Which of the following is NOT one of the primitive data types in Hadoop?", "q_ar": "أيٌّ مما يلي ليس من أنواع البيانات الأولية (primitive data types) في Hadoop؟", "answer": 2, "options": [{"en": "VIntWritable", "ar": "VIntWritable"}, {"en": "BooleanWritable", "ar": "BooleanWritable"}, {"en": "StringWritable", "ar": "StringWritable"}, {"en": "DoubleWritable", "ar": "DoubleWritable"}], "why_ar": "StringWritable غير موجود في القائمة؛ الأنواع الثمانية هي Boolean, Byte, Int, VInt, Float, Long, VLong, Double + Writable.", "why_en": "StringWritable is not in the slide list of eight primitive Writable types.", "explain_ar": "الأنواع الثمانية: BooleanWritable, ByteWritable, IntWritable, VIntWritable, FloatWritable, LongWritable, VLongWritable, DoubleWritable. لاحظ أن VInt وVLong موجودان فعلاً فلا تنخدع بهما، أما String فليس منها.", "slide": 3, "hot": false}, {"id": "p2-004", "lecture": "p2", "topic_en": "Hadoop Writable types and MapReduce input formats", "topic_ar": "أنواع Writable في Hadoop وصيغ إدخال MapReduce", "type": "mcq", "q_en": "____ is the default MapReduce InputFormat.", "q_ar": "____ هي صيغة الإدخال (InputFormat) الافتراضية في MapReduce.", "answer": 0, "options": [{"en": "TextInputFormat", "ar": "TextInputFormat"}, {"en": "KeyValueTextInputFormat", "ar": "KeyValueTextInputFormat"}, {"en": "NLineInputFormat", "ar": "NLineInputFormat"}, {"en": "SequenceFileInputFormat", "ar": "SequenceFileInputFormat"}], "why_ar": "الصيغة الافتراضية هي TextInputFormat، والبقية صيغ أخرى يدعمها MapReduce.", "why_en": "TextInputFormat is the default; the others are other supported formats.", "slide": 4, "hot": false}, {"id": "p2-005", "lecture": "p2", "topic_en": "Hadoop Writable types and MapReduce input formats", "topic_ar": "أنواع Writable في Hadoop وصيغ إدخال MapReduce", "type": "mcq", "q_en": "In TextInputFormat, the key is of LongWritable type, and it is:", "q_ar": "في TextInputFormat يكون المفتاح من نوع LongWritable، وهو:", "answer": 3, "options": [{"en": "The number of words in the line", "ar": "عدد الكلمات في السطر"}, {"en": "The content of the whole line", "ar": "محتوى السطر كاملاً"}, {"en": "The name of the input file", "ar": "اسم ملف الإدخال"}, {"en": "The byte offset of the starting of the line within the entire file", "ar": "إزاحة البايت (byte offset) لبداية السطر داخل الملف كاملاً"}], "why_ar": "المفتاح هو byte offset لبداية السطر داخل الملف.", "why_en": "The key is the byte offset of the start of the line within the file.", "slide": 4, "hot": false}, {"id": "p2-006", "lecture": "p2", "topic_en": "YARN core components", "topic_ar": "المكونات الأساسية لـ YARN", "type": "tf", "q_en": "A ResourceManager is a one-per-cluster application that manages the allocation of resources to various applications.", "q_ar": "مدير الموارد (ResourceManager) تطبيق واحد لكل عنقود (one-per-cluster) يدير تخصيص الموارد للتطبيقات المختلفة.", "answer": true, "why_ar": "صح؛ ResourceManager واحد لكل cluster ويوزّع الموارد على التطبيقات.", "why_en": "True — one ResourceManager per cluster allocates resources to applications.", "slide": 5, "hot": false}, {"id": "p2-007", "lecture": "p2", "topic_en": "YARN core components", "topic_ar": "المكونات الأساسية لـ YARN", "type": "tf", "q_en": "The ResourceManager runs in all the slave nodes and is a per-node application.", "q_ar": "مدير الموارد (ResourceManager) يعمل في جميع العقد التابعة (slave nodes) وهو تطبيق لكل عقدة (per-node).", "answer": false, "correct_en": "The NodeManager runs in all the slave nodes and is a per-node application.", "why_ar": "خطأ؛ الذي يعمل في كل slave node هو NodeManager، أما ResourceManager فواحد لكل cluster.", "why_en": "False — that describes the NodeManager; the ResourceManager is one per cluster.", "explain_ar": "فرّق بالاسم: Resource = موارد العنقود كله ← واحد لكل cluster. Node = عقدة ← واحد في كل عقدة (per-node) وينفّذ جزءاً من الـ job.", "slide": 5, "hot": false}, {"id": "p2-008", "lecture": "p2", "topic_en": "YARN core components", "topic_ar": "المكونات الأساسية لـ YARN", "type": "tf", "q_en": "The NodeManager monitors the status of the running applications and restarts the applications in case of failures.", "q_ar": "مدير العقدة (NodeManager) يراقب حالة التطبيقات العاملة ويعيد تشغيلها في حالة الفشل.", "answer": false, "correct_en": "ApplicationMaster is for the execution of the application, monitors the status of the running applications, and restarts the applications in case of failures.", "why_ar": "خطأ؛ مراقبة التطبيقات وإعادة تشغيلها عند الفشل هي مهمة ApplicationMaster.", "why_en": "False — monitoring and restarting applications is the ApplicationMaster's job.", "explain_ar": "ApplicationMaster مسؤول عن تطبيق واحد: ينفّذه ويراقبه ويعيد تشغيله إذا فشل. NodeManager فقط ينفّذ جزءاً (portion) من الـ job على عقدته.", "slide": 5, "hot": false}, {"id": "p2-009", "lecture": "p2", "topic_en": "YARN core components", "topic_ar": "المكونات الأساسية لـ YARN", "type": "mcq", "q_en": "The ____ is responsible for executing a portion of a job.", "q_ar": "____ مسؤول عن تنفيذ جزء (portion) من الـ job.", "answer": 1, "options": [{"en": "ResourceManager", "ar": "ResourceManager"}, {"en": "NodeManager", "ar": "NodeManager"}, {"en": "ApplicationMaster", "ar": "ApplicationMaster"}, {"en": "NameNode", "ar": "NameNode"}], "why_ar": "NodeManager يعمل على كل slave node وينفّذ جزءاً من الـ job.", "why_en": "The NodeManager executes a portion of a job on its node.", "slide": 5, "hot": false}, {"id": "p2-010", "lecture": "p2", "topic_en": "YARN core components", "topic_ar": "المكونات الأساسية لـ YARN", "type": "mcq", "q_en": "Which of the following is NOT one of the core components of YARN?", "q_ar": "أيٌّ مما يلي ليس من المكونات الأساسية لـ YARN؟", "answer": 1, "options": [{"en": "ResourceManager", "ar": "ResourceManager"}, {"en": "DataNode", "ar": "DataNode"}, {"en": "ApplicationMaster", "ar": "ApplicationMaster"}, {"en": "NodeManager", "ar": "NodeManager"}], "why_ar": "مكونات YARN الثلاثة: ResourceManager وApplicationMaster وNodeManager. أما DataNode فمن مكونات HDFS.", "why_en": "YARN's core components are ResourceManager, ApplicationMaster and NodeManager; DataNode belongs to HDFS.", "slide": 5, "hot": false}, {"id": "p2-011", "lecture": "p2", "topic_en": "Hadoop ecosystem tools", "topic_ar": "أدوات منظومة Hadoop", "type": "tf", "q_en": "Zookeeper provides a centralized service and manages the coordination between the components of a distributed system.", "q_ar": "يوفّر Zookeeper خدمة مركزية (centralized service) ويدير التنسيق (coordination) بين مكونات النظام الموزّع.", "answer": true, "why_ar": "صح؛ وظيفة Zookeeper هي التنسيق بين مكونات النظام الموزع.", "why_en": "True — ZooKeeper is the coordination service.", "slide": 6, "hot": false}, {"id": "p2-012", "lecture": "p2", "topic_en": "Hadoop ecosystem tools", "topic_ar": "أدوات منظومة Hadoop", "type": "tf", "q_en": "Pig is developed at Google.", "q_ar": "تم تطوير Pig في شركة Google.", "answer": false, "correct_en": "Pig is developed at Yahoo.", "why_ar": "خطأ؛ Pig تم تطويره في Yahoo.", "why_en": "False — Pig is developed at Yahoo.", "slide": 7, "hot": false}, {"id": "p2-013", "lecture": "p2", "topic_en": "Hadoop ecosystem tools", "topic_ar": "أدوات منظومة Hadoop", "type": "tf", "q_en": "Pig has two components: the pig language, called Pig Latin, and the environment where the Pig Latin scripts are executed.", "q_ar": "لـ Pig مكوّنان: لغة Pig المسماة Pig Latin، والبيئة التي تُنفَّذ فيها سكربتات Pig Latin.", "answer": true, "why_ar": "صح؛ مكوّنا Pig هما لغة Pig Latin وبيئة التنفيذ.", "why_en": "True — Pig = Pig Latin language + execution environment.", "slide": 7, "hot": false}, {"id": "p2-014", "lecture": "p2", "topic_en": "Hadoop ecosystem tools", "topic_ar": "أدوات منظومة Hadoop", "type": "tf", "q_en": "Flume is an open-source data serialization framework.", "q_ar": "Flume إطار عمل مفتوح المصدر لتسلسل البيانات (data serialization).", "answer": false, "correct_en": "Apache Avro is an open-source data serialization framework.", "why_ar": "خطأ؛ إطار data serialization هو Apache Avro، أما Flume فأداة لجمع البيانات المتدفقة (streaming data).", "why_en": "False — Avro is the serialization framework; Flume collects streaming data.", "explain_ar": "data serialization = تحويل البيانات من الذاكرة إلى صيغة ثنائية أو نصية لنقلها عبر الشبكة أو تخزينها على القرص ← Avro. أما Flume فـ«يجمع» (collect) كميات كبيرة من البيانات المتدفقة من مصادر متعددة.", "slide": 6, "hot": false}, {"id": "p2-015", "lecture": "p2", "topic_en": "Hadoop ecosystem tools", "topic_ar": "أدوات منظومة Hadoop", "type": "tf", "q_en": "Avro has a data format that can be processed by multiple languages.", "q_ar": "لدى Avro صيغة بيانات يمكن معالجتها بواسطة لغات برمجة متعددة.", "answer": true, "why_ar": "صح؛ صيغة بيانات Avro قابلة للمعالجة بعدة لغات.", "why_en": "True — Avro's data format can be processed by multiple languages.", "slide": 6, "hot": false}, {"id": "p2-016", "lecture": "p2", "topic_en": "Hadoop ecosystem tools", "topic_ar": "أدوات منظومة Hadoop", "type": "tf", "q_en": "Mahout allows multiple Map/Reduce jobs to combine into a logical unit of work to accomplish the larger task.", "q_ar": "يسمح Mahout بدمج عدة مهام Map/Reduce في وحدة عمل منطقية واحدة لإنجاز مهمة أكبر.", "answer": false, "correct_en": "Oozie allows multiple Map/Reduce jobs to combine into a logical unit of work to accomplish the larger task.", "why_ar": "خطأ؛ هذا وصف Oozie الذي يدير سير العمل (workflow). أما Mahout فهو لتعلم الآلة.", "why_en": "False — that is Oozie (workflow); Mahout is for machine learning.", "explain_ar": "Oozie = مدير سير العمل (workflow): يرتّب البرامج بالترتيب المطلوب في بيئة Hadoop ويجمع عدة MapReduce jobs في وحدة واحدة. Mahout = خوارزميات Machine Learning (clustering, classification, recommendation).", "slide": 7, "hot": false}, {"id": "p2-017", "lecture": "p2", "topic_en": "Hadoop ecosystem tools", "topic_ar": "أدوات منظومة Hadoop", "type": "tf", "q_en": "Hive is a tool to process unstructured data in the Hadoop environment.", "q_ar": "Hive أداة لمعالجة البيانات غير المهيكلة (unstructured data) في بيئة Hadoop.", "answer": false, "correct_en": "Hive is a tool to process structured data in the Hadoop environment.", "why_ar": "خطأ؛ Hive يعالج البيانات المهيكلة (structured data). الذي يتعامل مع أي نوع بيانات هو Pig.", "why_en": "False — Hive processes structured data.", "explain_ar": "Hive يشبه SQL (لغة HQL) والجداول، لذلك منطقي أنه للبيانات المهيكلة (structured). أما Pig فيعالج أي نوع: structured وsemi-structured وunstructured.", "slide": 7, "hot": false}, {"id": "p2-018", "lecture": "p2", "topic_en": "Hadoop ecosystem tools", "topic_ar": "أدوات منظومة Hadoop", "type": "mcq", "q_en": "____ can be used to move data from relational databases to HBase.", "q_ar": "____ يمكن استخدامه لنقل البيانات من قواعد البيانات العلائقية (relational databases) إلى HBase.", "answer": 3, "options": [{"en": "Flume", "ar": "Flume"}, {"en": "Avro", "ar": "Avro"}, {"en": "Oozie", "ar": "Oozie"}, {"en": "Sqoop", "ar": "Sqoop"}], "why_ar": "Sqoop ينقل البيانات من قواعد البيانات العلائقية إلى HBase، ويستورد البيانات أيضاً إلى HBase وHive.", "why_en": "Sqoop moves data from relational databases to HBase (and can import into HBase and Hive).", "explain_ar": "حيلة للحفظ: SQoop = SQL + Hadoop، أي جسر بين قواعد بيانات SQL العلائقية وبين HBase/Hive. أما Flume فيجمع بيانات streaming، وليس من RDBMS.", "slide": 6, "hot": false}, {"id": "p2-019", "lecture": "p2", "topic_en": "Hadoop ecosystem tools", "topic_ar": "أدوات منظومة Hadoop", "type": "mcq", "q_en": "____ is a distributed and reliable tool for collecting large amount of streaming data from multiple data sources.", "q_ar": "____ أداة موزّعة وموثوقة لجمع كميات كبيرة من البيانات المتدفقة (streaming data) من مصادر بيانات متعددة.", "answer": 0, "options": [{"en": "Flume", "ar": "Flume"}, {"en": "Sqoop", "ar": "Sqoop"}, {"en": "Zookeeper", "ar": "Zookeeper"}, {"en": "Mahout", "ar": "Mahout"}], "why_ar": "Flume هي أداة جمع البيانات المتدفقة من مصادر متعددة.", "why_en": "Flume collects large amounts of streaming data from multiple sources.", "slide": 6, "hot": false}, {"id": "p2-020", "lecture": "p2", "topic_en": "Hadoop ecosystem tools", "topic_ar": "أدوات منظومة Hadoop", "type": "mcq", "q_en": "Apache Mahout is an open-source machine learning algorithm that implements:", "q_ar": "Apache Mahout خوارزمية تعلم آلي (machine learning) مفتوحة المصدر تطبّق:", "answer": 2, "options": [{"en": "Data serialization into binary or textual format", "ar": "تسلسل البيانات إلى صيغة ثنائية أو نصية"}, {"en": "Coordination between the components of a distributed system", "ar": "التنسيق بين مكونات النظام الموزّع"}, {"en": "Clustering, classification, and recommendation algorithms", "ar": "خوارزميات العنقدة (clustering) والتصنيف (classification) والتوصية (recommendation)"}, {"en": "Collection of streaming data from multiple sources", "ar": "جمع البيانات المتدفقة من مصادر متعددة"}], "why_ar": "Mahout يطبّق clustering وclassification وrecommendation، وهو مرن لتطبيق خوارزميات أخرى أيضاً.", "why_en": "Mahout implements clustering, classification and recommendation algorithms.", "slide": 7, "hot": false}, {"id": "p2-021", "lecture": "p2", "topic_en": "Hadoop ecosystem tools", "topic_ar": "أدوات منظومة Hadoop", "type": "mcq", "q_en": "Data in Hive is organized into:", "q_ar": "تُنظَّم البيانات في Hive إلى:", "answer": 3, "options": [{"en": "Rows, column families, and columns", "ar": "صفوف وعائلات أعمدة وأعمدة"}, {"en": "Collections, documents, and fields", "ar": "مجموعات (Collections) ووثائق وحقول"}, {"en": "Lines, key-value pairs, and offsets", "ar": "أسطر وأزواج مفتاح-قيمة وإزاحات"}, {"en": "Tables, partitions, and buckets", "ar": "جداول (Tables) وأقسام (Partitions) وحاويات (Buckets)"}], "why_ar": "بيانات Hive تُنظم في Tables ثم Partitions ثم Buckets.", "why_en": "Hive data is organized into tables, partitions and buckets.", "explain_ar": "انتبه للمشتّتات من محاضرات أخرى: rows/column families/columns تخص HBase، وcollections/documents/fields تخص MongoDB. Hive = Tables → Partitions → Buckets.", "slide": 8, "hot": false}, {"id": "p2-022", "lecture": "p2", "topic_en": "Hadoop ecosystem tools", "topic_ar": "أدوات منظومة Hadoop", "type": "mcq", "q_en": "Hive is a platform to develop scripts similar to SQL to perform MapReduce operations. The language for querying is called:", "q_ar": "Hive منصة لتطوير سكربتات تشبه SQL لتنفيذ عمليات MapReduce. لغة الاستعلام فيها تسمى:", "answer": 1, "options": [{"en": "Pig Latin", "ar": "Pig Latin"}, {"en": "HQL", "ar": "HQL"}, {"en": "JDBC", "ar": "JDBC"}, {"en": "Avro", "ar": "Avro"}], "why_ar": "لغة الاستعلام في Hive هي HQL. أما ODBC/JDBC فهي واجهات (interfaces) يرسل Hive عبرها الاستعلامات إلى Hadoop.", "why_en": "Hive's query language is HQL; JDBC/ODBC are interfaces, Pig Latin is Pig's language.", "explain_ar": "Hive يتواصل مع Hadoop بإرسال الاستعلام عبر واجهة مثل ODBC أو JDBC — هذه واجهات وليست لغة. اللغة = HQL (Hive Query Language)، ولغة Pig = Pig Latin.", "slide": 7, "hot": false}, {"id": "p2-023", "lecture": "p2", "topic_en": "Hadoop ecosystem tools", "topic_ar": "أدوات منظومة Hadoop", "type": "mcq", "q_en": "Pig can handle which type of data sets?", "q_ar": "ما نوع مجموعات البيانات التي يستطيع Pig التعامل معها؟", "answer": 2, "options": [{"en": "Structured data only", "ar": "البيانات المهيكلة فقط"}, {"en": "Unstructured data only", "ar": "البيانات غير المهيكلة فقط"}, {"en": "Structured, semi-structured, and unstructured", "ar": "المهيكلة وشبه المهيكلة وغير المهيكلة"}, {"en": "Streaming data only", "ar": "البيانات المتدفقة فقط"}], "why_ar": "Pig يتعامل مع أي نوع من البيانات: structured وsemi-structured وunstructured.", "why_en": "Pig can handle any type of data: structured, semi-structured and unstructured.", "slide": 7, "hot": false}, {"id": "p2-024", "lecture": "p2", "topic_en": "Data warehouse, BI and big data analytics", "topic_ar": "مستودع البيانات وذكاء الأعمال وتحليلات البيانات الضخمة", "type": "tf", "q_en": "Data warehouse, also termed as Enterprise Data Warehouse (EDW), is a repository for the data that various organizations and business enterprises collect.", "q_ar": "مستودع البيانات (Data warehouse)، ويسمى أيضاً مستودع بيانات المؤسسة (EDW)، هو مخزن للبيانات التي تجمعها المؤسسات والشركات المختلفة.", "answer": true, "why_ar": "صح؛ هذا تعريف Data warehouse (EDW) حرفياً.", "why_en": "True — this is the slide definition of a data warehouse (EDW).", "slide": 10, "hot": false}, {"id": "p2-025", "lecture": "p2", "topic_en": "Data warehouse, BI and big data analytics", "topic_ar": "مستودع البيانات وذكاء الأعمال وتحليلات البيانات الضخمة", "type": "tf", "q_en": "Big data analytics allows to make better decisions, find new business opportunities, compete against business rivals, improve performance and efficiency, and increase cost.", "q_ar": "تحليلات البيانات الضخمة تسمح باتخاذ قرارات أفضل وإيجاد فرص عمل جديدة ومنافسة المنافسين وتحسين الأداء والكفاءة وزيادة التكلفة.", "answer": false, "correct_en": "Big data analytics allows to make better decisions, find new business opportunities, compete against ", "topic_ar": "الأنواع الأربعة للتحليلات", "type": "mcq", "q_en": "Which type of analytics gives insight into the past?", "q_ar": "أي نوع من التحليلات يعطي رؤية عن الماضي؟", "answer": 2, "options": [{"en": "Diagnostic Analytics", "ar": "التحليلات التشخيصية (Diagnostic Analytics)"}, {"en": "Predictive Analytics", "ar": "التحليلات التنبؤية (Predictive Analytics)"}, {"en": "Descriptive Analytics", "ar": "التحليلات الوصفية (Descriptive Analytics)"}, {"en": "Prescriptive Analytics", "ar": "التحليلات التوجيهية (Prescriptive Analytics)"}], "why_ar": "Descriptive Analytics = Insight into the past.", "why_en": "Descriptive analytics gives insight into the past.", "slide": 12, "hot": false}, {"id": "p2-031", "lecture": "p2", "topic_en": "Four types of analytics", "topic_ar": "الأنواع الأربعة للتحليلات", "type": "mcq", "q_en": "Understanding what is happening and why did it happen is:", "q_ar": "فهم ما يحدث ولماذا حدث هو:", "answer": 1, "options": [{"en": "Descriptive Analytics", "ar": "التحليلات الوصفية (Descriptive Analytics)"}, {"en": "Diagnostic Analytics", "ar": "التحليلات التشخيصية (Diagnostic Analytics)"}, {"en": "Predictive Analytics", "ar": "التحليلات التنبؤية (Predictive Analytics)"}, {"en": "Prescriptive Analytics", "ar": "التحليلات التوجيهية (Prescriptive Analytics)"}], "why_ar": "Diagnostic = فهم ما يحدث ولماذا (why) — مثل الطبيب الذي يشخّص سبب المرض.", "why_en": "Diagnostic analytics explains what is happening and why.", "slide": 12, "hot": false}, {"id": "p2-032", "lecture": "p2", "topic_en": "Four types of analytics", "topic_ar": "الأنواع الأربعة للتحليلات", "type": "mcq", "q_en": "Understanding the future is the goal of:", "q_ar": "فهم المستقبل هو هدف:", "answer": 3, "options": [{"en": "Descriptive Analytics", "ar": "التحليلات الوصفية (Descriptive Analytics)"}, {"en": "Diagnostic Analytics", "ar": "التحليلات التشخيصية (Diagnostic Analytics)"}, {"en": "Prescriptive Analytics", "ar": "التحليلات التوجيهية (Prescriptive Analytics)"}, {"en": "Predictive Analytics", "ar": "التحليلات التنبؤية (Predictive Analytics)"}], "why_ar": "Predictive Analytics = Understanding the future.", "why_en": "Predictive analytics is understanding the future.", "slide": 12, "hot": false}, {"id": "p2-033", "lecture": "p2", "topic_en": "Data analytics life cycle", "topic_ar": "دورة حياة تحليل البيانات", "type": "tf", "q_en": "In the data analytics life cycle, identifying the source data necessary to solve the issue is called data selection.", "q_ar": "في دورة حياة تحليل البيانات، يُسمّى تحديد بيانات المصدر اللازمة لحل المشكلة اختيار البيانات (data selection).", "answer": true, "why_ar": "صح؛ identify the source data necessary to solve the issue = Data selection.", "why_en": "True — identifying the necessary source data is data selection.", "slide": [13, 14], "hot": false}, {"id": "p2-034", "lecture": "p2", "topic_en": "Data analytics life cycle", "topic_ar": "دورة حياة تحليل البيانات", "type": "mcq", "q_en": "The first step of the data analytics life cycle is to:", "q_ar": "الخطوة الأولى في دورة حياة تحليل البيانات هي:", "answer": 1, "options": [{"en": "Data Preparation", "ar": "تجهيز البيانات (Data Preparation)"}, {"en": "Define the business problem that has to be solved with data analytics", "ar": "تحديد مشكلة العمل التي يجب حلّها بتحليل البيانات"}, {"en": "Data Analysis and Visualization", "ar": "تحليل البيانات وتصويرها (Data Analysis and Visualization)"}, {"en": "Analytics Application", "ar": "تطبيق التحليلات (Analytics Application)"}], "why_ar": "تبدأ الدورة بتعريف مشكلة العمل، ثم data selection، ثم preparation، ثم extraction & transformation، ثم analysis & visualization، وأخيراً analytics application.", "why_en": "The cycle starts by defining the business problem; Analytics Application is the last step.", "explain_ar": "رتّب الخطوات كقصة: (1) ما المشكلة؟ (2) أي بيانات نحتاج؟ Data selection (3) Data Preparation (4) Data Extraction and Transformation (5) Data Analysis and Visualization (6) Analytics Application.", "slide": 13, "hot": false}, {"id": "p2-035", "lecture": "p2", "topic_en": "Data analytics life cycle", "topic_ar": "دورة حياة تحليل البيانات", "type": "mcq", "q_en": "In the data analytics life cycle diagram, the Preprocessed Data is produced by which stage?", "q_ar": "في مخطط دورة حياة تحليل البيانات، البيانات المعالجة مسبقاً (Preprocessed Data) تنتج عن أي مرحلة؟", "answer": 0, "options": [{"en": "Data Cleaning", "ar": "تنظيف البيانات (Data Cleaning)"}, {"en": "Data Selection", "ar": "اختيار البيانات (Data Selection)"}, {"en": "Data Transformation", "ar": "تحويل البيانات (Data Transformation)"}, {"en": "Interpretation and Evaluation", "ar": "التفسير والتقييم (Interpretation and Evaluation)"}], "why_ar": "في المخطط: Source Data → (Data Selection) Data Mart → (Data Cleaning) Preprocessed Data → (Data Transformation) Transformed Data → (Analysis) Patterns → (Interpretation and Evaluation) Analytics Application.", "why_en": "In the diagram, Data Cleaning produces the Preprocessed Data.", "explain_ar": "كل مرحلة تنتج شيئاً: Data Selection ← Data Mart، Data Cleaning ← Preprocessed Data، Data Transformation ← Transformed Data، Analysis ← Patterns، Interpretation and Evaluation ← Analytics Application.", "slide": 14, "hot": false}, {"id": "p2-036", "lecture": "p2", "topic_en": "Quantitative and qualitative analysis", "topic_ar": "التحليل الكمي والنوعي", "type": "tf", "q_en": "Quantitative data is the data based on numbers.", "q_ar": "البيانات الكمية (Quantitative data) هي البيانات القائمة على الأرقام.", "answer": true, "why_ar": "صح؛ Quantitative = أرقام، وتحليلها هو quantitative analysis.", "why_en": "True — quantitative data is based on numbers.", "slide": 15, "hot": false}, {"id": "p2-037", "lecture": "p2", "topic_en": "Quantitative and qualitative analysis", "topic_ar": "التحليل الكمي والنوعي", "type": "tf", "q_en": "Quantitative analysis in big data is the analysis of data in their natural settings.", "q_ar": "التحليل الكمي (Quantitative analysis) في البيانات الضخمة هو تحليل البيانات في بيئتها الطبيعية (natural settings).", "answer": false, "correct_en": "Qualitative analysis in big data is the analysis of data in their natural settings.", "why_ar": "خطأ؛ تحليل البيانات في بيئتها الطبيعية هو Qualitative analysis.", "why_en": "False — analysis of data in their natural settings is qualitative analysis.", "explain_ar": "Quantitative من quantity (كمية/أرقام). Qualitative من quality (نوع/وصف) — بيانات لا تتحول بسهولة إلى أرقام مثل القصص والمقالات وتعليقات الاستبيان والمحادثات والموسيقى والصور.", "slide": [15, 16], "hot": false}, {"id": "p2-038", "lecture": "p2", "topic_en": "Quantitative and qualitative analysis", "topic_ar": "التحليل الكمي والنوعي", "type": "tf", "q_en": "An inductive approach is performed by using the emergent framework of the research to group the data and then look for the relationships in them.", "q_ar": "يُنفَّذ المنهج الاستقرائي (inductive approach) باستخدام الإطار الناشئ (emergent framework) للبحث لتجميع البيانات ثم البحث عن العلاقات بينها.", "answer": true, "why_ar": "صح؛ inductive يستخدم emergent framework ثم يبحث عن العلاقات (relationships). أما deductive فيستخدم أسئلة البحث ثم يبحث عن التشابه والاختلاف.", "why_en": "True — inductive uses the emergent framework and looks for relationships.", "explain_ar": "Deductive = يبدأ من research questions لتجميع البيانات ← يبحث عن similarities or differences. Inductive = يبدأ من emergent framework ← يبحث عن relationships. كن حذراً: الدكتورة قد تبدّل الكلمتين.", "slide": 16, "hot": false}, {"id": "p2-039", "lecture": "p2", "topic_en": "Quantitative and qualitative analysis", "topic_ar": "التحليل الكمي والنوعي", "type": "tf", "q_en": "Narrative analysis is used for the purpose of classification, tabulation, and summarization.", "q_ar": "يُستخدم التحليل السردي (Narrative analysis) لأغراض التصنيف والجدولة والتلخيص.", "answer": false, "correct_en": "Content analysis is used for the purpose of classification, tabulation, and summarization.", "why_ar": "خطأ؛ classification وtabulation وsummarization هي Content analysis. أما Narrative فيُستخدم لتدوين (transcribe) بيانات الملاحظة أو المقابلة.", "why_en": "False — that is content analysis; narrative analysis transcribes observation or interview data.", "explain_ar": "أنواع Qualitative الخمسة: Content (تصنيف وجدولة وتلخيص)، Narrative (تدوين الملاحظات والمقابلات)، Discourse (نص مكتوب أو محادثة طبيعية)، Framework (تحديد الإطار الأولي من المشكلة)، Grounded theory (حالة واحدة ← نظرية عامة).", "slide": 17, "hot": false}, {"id": "p2-040", "lecture": "p2", "topic_en": "Quantitative and qualitative analysis", "topic_ar": "التحليل الكمي والنوعي", "type": "mcq", "q_en": "Which of the following is NOT one of the types of quantitative data?", "q_ar": "أيٌّ مما يلي ليس من أنواع البيانات الكمية (quantitative data)؟", "answer": 3, "options": [{"en": "Nominal data", "ar": "البيانات الاسمية (Nominal data)"}, {"en": "Ordinal data", "ar": "البيانات الترتيبية (Ordinal data)"}, {"en": "Ratio data", "ar": "البيانات النسبية (Ratio data)"}, {"en": "Narrative data", "ar": "البيانات السردية (Narrative data)"}], "why_ar": "أنواع البيانات الكمية: Nominal وOrdinal وInterval وRatio. أما Narrative فنوع من التحليل النوعي.", "why_en": "The quantitative data types are nominal, ordinal, interval and ratio; narrative is a qualitative analysis type.", "slide": 15, "hot": false}, {"id": "p2-041", "lecture": "p2", "topic_en": "Quantitative and qualitative analysis", "topic_ar": "التحليل الكمي والنوعي", "type": "mcq", "q_en": "Which of the following is an example of qualitative data?", "q_ar": "أيٌّ مما يلي مثال على البيانات النوعية (qualitative data)؟", "answer": 2, "options": [{"en": "Interval data", "ar": "بيانات الفترات (Interval data)"}, {"en": "Ratio data", "ar": "البيانات النسبية (Ratio data)"}, {"en": "Survey comments and conversations", "ar": "تعليقات الاستبيانات والمحادثات"}, {"en": "Data based on numbers", "ar": "بيانات قائمة على الأرقام"}], "why_ar": "البيانات النوعية لا تتحول بسهولة إلى أرقام: stories, articles, survey comments, transcriptions, conversations, music, graphics, art, pictures.", "why_en": "Survey comments and conversations are qualitative; the others are quantitative.", "slide": 16, "hot": false}, {"id": "p2-042", "lecture": "p2", "topic_en": "Quantitative and qualitative analysis", "topic_ar": "التحليل الكمي والنوعي", "type": "mcq", "q_en": "____ basically starts with examining one particular case from the population and formulating a general theory about the entire population.", "q_ar": "____ يبدأ أساساً بفحص حالة واحدة معينة من المجتمع (population) ثم صياغة نظرية عامة عن المجتمع كله.", "answer": 2, "options": [{"en": "Framework analysis", "ar": "تحليل الإطار (Framework analysis)"}, {"en": "Discourse analysis", "ar": "تحليل الخطاب (Discourse analysis)"}, {"en": "Grounded theory", "ar": "النظرية المجذّرة (Grounded theory)"}, {"en": "Content analysis", "ar": "تحليل المحتوى (Content analysis)"}], "why_ar": "Grounded theory: حالة واحدة ← نظرية عامة. Framework يحدد الإطار الأولي، وDiscourse يحلل النص المكتوب أو المحادثة الطبيعية.", "why_en": "Grounded theory goes from one particular case to a general theory.", "explain_ar": "Grounded = مؤسَّس على الأرض/الواقع: تبدأ من حالة واقعية واحدة وتبني منها theory. Framework analysis يحدد initial framework المطوّر من المشكلة الحالية. Discourse analysis لتحليل written text أو naturally occurring conversation.", "slide": 17, "hot": false}, {"id": "p2-043", "lecture": "p2", "topic_en": "Statistical analysis", "topic_ar": "التحليل الإحصائي", "type": "tf", "q_en": "A/B testing, also called split testing or bucket testing, is a method that compares two versions of an object under interest to determine which among the two versions performs better.", "q_ar": "اختبار A/B، ويسمى أيضاً split testing أو bucket testing، طريقة تقارن نسختين من الشيء محل الاهتمام لتحديد أيّ النسختين أداؤها أفضل.", "answer": true, "why_ar": "صح؛ هذا تعريف A/B testing وأسماؤه الأخرى split وbucket testing.", "why_en": "True — A/B (split/bucket) testing compares two versions to see which performs better.", "slide": 18, "hot": false}, {"id": "p2-044", "lecture": "p2", "topic_en": "Statistical analysis", "topic_ar": "التحليل الإحصائي", "type": "tf", "q_en": "Positive correlation—When one variable increases, the other variable decreases.", "q_ar": "الارتباط الموجب (Positive correlation): عندما يزيد أحد المتغيرين ينقص المتغير الآخر.", "answer": false, "correct_en": "Positive correlation—When one variable increases, the other variable increases.", "why_ar": "خطأ؛ هذا الارتباط السالب (Negative). في الموجب يزيد الآخر أيضاً.", "why_en": "False — that is negative correlation; in positive correlation the other variable increases.", "slide": 19, "hot": false}, {"id": "p2-045", "lecture": "p2", "topic_en": "Statistical analysis", "topic_ar": "التحليل الإحصائي", "type": "tf", "q_en": "The major difference between regression and correlation is that regression does not imply causation.", "q_ar": "الفرق الرئيسي بين الانحدار (regression) والارتباط (correlation) هو أن الانحدار لا يدل على السببية (causation).", "answer": false, "correct_en": "The major difference between regression and correlation is that correlation does not imply causation.", "why_ar": "خطأ؛ correlation هو الذي لا يدل على السببية، أما regression فيدل على درجة من السببية بين المتغير التابع والمستقل.", "why_en": "False — correlation does not imply causation; regression implies a degree of causation.", "explain_ar": "مثال: مبيعات المظلات ومبيعات الأحذية المطاطية مرتبطتان بقوة (correlation)، لكن إحداهما لا تسبب الأخرى. Regression يفترض درجة من السببية: X يؤثر في Y، لذلك نستخدمه لتوقع قيمة Y من X المعروف.", "slide": 20, "hot": false}, {"id": "p2-046", "lecture": "p2", "topic_en": "Statistical analysis", "topic_ar": "التحليل الإحصائي", "type": "tf", "q_en": "In regression, the dependent variable is the outcome variable or the response variable or predicted variable, denoted by “Y”.", "q_ar": "في الانحدار (regression)، المتغير التابع (dependent variable) هو متغير النتيجة أو الاستجابة أو المتغير المتوقَّع، ويُرمز له بـ «Y».", "answer": true, "why_ar": "صح؛ dependent = outcome/response/predicted = Y. أما independent = predictor/explanatory = X.", "why_en": "True — the dependent variable (outcome/response/predicted) is Y.", "slide": 20, "hot": false}, {"id": "p2-047", "lecture": "p2", "topic_en": "Statistical analysis", "topic_ar": "التحليل الإحصائي", "type": "mcq", "q_en": "The statistical analysis techniques described are:", "q_ar": "تقنيات التحليل الإحصائي (Statistical analysis) الموصوفة هي:", "answer": 3, "options": [{"en": "Parsing, searching and retrieval, and text mining", "ar": "Parsing والبحث والاسترجاع (Searching and retrieval) والتنقيب في النصوص (Text mining)"}, {"en": "Content, narrative, and discourse analysis", "ar": "تحليل المحتوى والتحليل السردي وتحليل الخطاب"}, {"en": "MOLAP, ROLAP, and HOLAP", "ar": "MOLAP وROLAP وHOLAP"}, {"en": "A/B testing, correlation, and regression", "ar": "اختبار A/B والارتباط (correlation) والانحدار (regression)"}], "why_ar": "Statistical analysis يستخدم طرقاً إحصائية: A/B testing وCorrelation وRegression.", "why_en": "The statistical techniques are A/B testing, correlation and regression.", "explain_ar": "المشتتات قوائم من نفس المحاضرة: Parsing/Searching/Text mining = خطوات text analysis، وContent/Narrative/Discourse = أنواع qualitative analysis، وMOLAP/ROLAP/HOLAP = أنواع OLAP.", "slide": 18, "hot": false}, {"id": "p2-048", "lecture": "p2", "topic_en": "Statistical analysis", "topic_ar": "التحليل الإحصائي", "type": "mcq", "q_en": "In regression, the independent variable \"X\" is also called the:", "q_ar": "في الانحدار (regression)، المتغير المستقل «X» يُسمّى أيضاً:", "answer": 0, "options": [{"en": "Predictor or explanatory variable", "ar": "المتغير المتنبِّئ (predictor) أو التفسيري (explanatory)"}, {"en": "Outcome variable", "ar": "متغير النتيجة (outcome)"}, {"en": "Response variable", "ar": "متغير الاستجابة (response)"}, {"en": "Predicted variable", "ar": "المتغير المتوقَّع (predicted)"}], "why_ar": "X = independent = predictor/explanatory/carrier/input variable. أما outcome/response/predicted فهي أسماء Y.", "why_en": "X is the predictor/explanatory variable; outcome, response and predicted describe Y.", "explain_ar": "لا تخلط بين predictor (المتنبِّئ = X الذي نستخدمه للتوقع) وpredicted (المتوقَّع = Y الذي نريد معرفته). المستقل يُدخَل (input) والتابع يخرج (outcome).", "slide": 20, "hot": false}, {"id": "p2-049", "lecture": "p2", "topic_en": "Statistical analysis", "topic_ar": "التحليل الإحصائي", "type": "mcq", "q_en": "When one variable increases and the other variable does not change, this is called:", "q_ar": "عندما يزيد أحد المتغيرين ولا يتغير المتغير الآخر، يُسمّى ذلك:", "answer": 1, "options": [{"en": "Positive correlation", "ar": "ارتباط موجب (Positive correlation)"}, {"en": "No correlation", "ar": "لا ارتباط (No correlation)"}, {"en": "Negative correlation", "ar": "ارتباط سالب (Negative correlation)"}, {"en": "Split testing", "ar": "اختبار التقسيم (Split testing)"}], "why_ar": "No correlation: يزيد أحدهما ولا يتغير الآخر.", "why_en": "No correlation — the other variable does not change.", "slide": 19, "hot": false}, {"id": "p2-050", "lecture": "p2", "topic_en": "Semantic analysis (NLP, text analytics, sentiment)", "topic_ar": "التحليل الدلالي (NLP وتحليل النصوص وتحليل المشاعر)", "type": "tf", "q_en": "There are two components in NLP, namely, Natural Language Understanding (NLU) and Natural Language Generation (NLG).", "q_ar": "يوجد في معالجة اللغات الطبيعية (NLP) مكوّنان هما: فهم اللغة الطبيعية (NLU) وتوليد اللغة الطبيعية (NLG).", "answer": true, "why_ar": "صح؛ مكوّنا NLP هما NLU وNLG، والمدخل قد يكون كلاماً (speech) أو نصاً مكتوباً.", "why_en": "True — NLP has two components: NLU and NLG.", "slide": 22, "hot": false}, {"id": "p2-051", "lecture": "p2", "topic_en": "Semantic analysis (NLP, text analytics, sentiment)", "topic_ar": "التحليل الدلالي (NLP وتحليل النصوص وتحليل المشاعر)", "type": "tf", "q_en": "Syntactic analysis involves dividing the whole input text data into paragraphs, sentences, and words.", "q_ar": "التحليل النحوي (Syntactic analysis) يتضمن تقسيم نص الإدخال كاملاً إلى فقرات وجمل وكلمات.", "answer": false, "correct_en": "Lexical analysis involves dividing the whole input text data into paragraphs, sentences, and words.", "why_ar": "خطأ؛ التقسيم إلى فقرات وجمل وكلمات هو Lexical analysis. أما Syntactic فيحلل القواعد (grammar) ويرتب الكلمات بشكل منطقي.", "why_en": "False — that is lexical analysis; syntactic analysis checks grammar and word arrangement.", "explain_ar": "مراحل NLP الأربع بالترتيب: Lexical (تقطيع إلى فقرات/جمل/كلمات) ← Syntactic (القواعد grammar وترتيب الكلمات) ← Semantic (المعنى من القاموس أو السياق) ← Pragmatic (ماذا يقصد المتكلم فعلاً).", "slide": 22, "hot": false}, {"id": "p2-052", "lecture": "p2", "topic_en": "Semantic analysis (NLP, text analytics, sentiment)", "topic_ar": "التحليل الدلالي (NLP وتحليل النصوص وتحليل المشاعر)", "type": "tf", "q_en": "Sentiment analysis is also known as text mining as it is the process of determining the opinion or attitude of the writer.", "q_ar": "تحليل المشاعر (Sentiment analysis) يُعرف أيضاً بالتنقيب في النصوص (text mining) لأنه عملية تحديد رأي الكاتب أو موقفه.", "answer": false, "correct_en": "Sentiment analysis is also known as opinion mining as it is the process of determining the opinion or attitude of the writer.", "why_ar": "خطأ؛ Sentiment analysis يُعرف بـ opinion mining. أما text mining فهو اكتشاف الأنماط في مجموعات نصية ضخمة.", "why_en": "False — sentiment analysis is also known as opinion mining.", "explain_ar": "opinion mining = تنقيب عن «الرأي»، ومنطقي لأن sentiment analysis يحدد هل النص positive أو negative أو neutral. مثال تطبيقي: معرفة شعور الناس تجاه منتج أو حادثة أو موقف.", "slide": [23, 25], "hot": false}, {"id": "p2-053", "lecture": "p2", "topic_en": "Semantic analysis (NLP, text analytics, sentiment)", "topic_ar": "التحليل الدلالي (NLP وتحليل النصوص وتحليل المشاعر)", "type": "tf", "q_en": "Text analytics is the process of transforming the unstructured data into meaningful data by applying machine learning, text mining, and NLP techniques.", "q_ar": "تحليل النصوص (Text analytics) هو عملية تحويل البيانات غير المهيكلة إلى بيانات ذات معنى بتطبيق تقنيات تعلم الآلة والتنقيب في النصوص (text mining) وNLP.", "answer": true, "why_ar": "صح؛ text analytics = ML + text mining + NLP لتحويل unstructured إلى meaningful data.", "why_en": "True — text analytics applies machine learning, text mining and NLP.", "slide": 23, "hot": false}, {"id": "p2-054", "lecture": "p2", "topic_en": "Semantic analysis (NLP, text analytics, sentiment)", "topic_ar": "التحليل الدلالي (NLP وتحليل النصوص وتحليل المشاعر)", "type": "mcq", "q_en": "NLP is performed in different stages, namely:", "q_ar": "تُنفَّذ معالجة اللغات الطبيعية (NLP) على مراحل هي:", "answer": 3, "options": [{"en": "Parsing, searching and retrieval, and text mining", "ar": "Parsing والبحث والاسترجاع والتنقيب في النصوص"}, {"en": "Descriptive, diagnostic, predictive, and prescriptive analytics", "ar": "التحليلات الوصفية والتشخيصية والتنبؤية والتوجيهية"}, {"en": "Nominal, ordinal, interval, and ratio data", "ar": "البيانات الاسمية والترتيبية والفترية والنسبية"}, {"en": "Lexical, syntactic, semantic, and pragmatic analysis", "ar": "التحليل المعجمي والنحوي والدلالي والتداولي (Lexical, syntactic, semantic, pragmatic)"}], "why_ar": "مراحل NLP: lexical وsyntactic وsemantic وpragmatic. أما parsing/searching/text mining فهي خطوات text analysis.", "why_en": "NLP stages are lexical, syntactic, semantic and pragmatic.", "slide": 22, "hot": false}, {"id": "p2-055", "lecture": "p2", "topic_en": "Semantic analysis (NLP, text analytics, sentiment)", "topic_ar": "التحليل الدلالي (NLP وتحليل النصوص وتحليل المشاعر)", "type": "mcq", "q_en": "____ analysis involves the analysis of what is intended to be spoken by the speaker.", "q_ar": "تحليل ____ يتضمن تحليل ما يقصد المتكلم قوله.", "answer": 2, "options": [{"en": "Lexical", "ar": "المعجمي (Lexical)"}, {"en": "Syntactic", "ar": "النحوي (Syntactic)"}, {"en": ansaction-oriented applications in real time, not batch.", "slide": 27, "hot": false}, {"id": "p2-060", "lecture": "p2", "topic_en": "Visual analysis, BI, OLTP/OLAP and RTAP", "topic_ar": "التحليل المرئي وذكاء الأعمال وOLTP/OLAP وRTAP", "type": "tf", "q_en": "Online transaction processing (OLTP) systems are used to process data analysis queries and perform effective analysis on massive amounts of data.", "q_ar": "تُستخدم أنظمة معالجة المعاملات عبر الإنترنت (OLTP) لمعالجة استعلامات تحليل البيانات وإجراء تحليل فعّال على كميات ضخمة من البيانات.", "answer": false, "correct_en": "Online analytical processing (OLAP) systems are used to process data analysis queries and perform effective analysis on massive amounts of data.", "why_ar": "خطأ؛ هذا وصف OLAP. أما OLTP فيعالج ويدير التطبيقات الموجهة للمعاملات (transaction oriented).", "why_en": "False — that describes OLAP; OLTP manages transaction-oriented applications.", "slide": 27, "hot": false}, {"id": "p2-061", "lecture": "p2", "topic_en": "Visual analysis, BI, OLTP/OLAP and RTAP", "topic_ar": "التحليل المرئي وذكاء الأعمال وOLTP/OLAP وRTAP", "type": "tf", "q_en": "Real-time analytics platform (RTAP) applications can be used to alert the end users when a situation occurs.", "q_ar": "يمكن استخدام تطبيقات منصة التحليلات في الوقت الحقيقي (RTAP) لتنبيه المستخدمين النهائيين عند حدوث موقف ما.", "answer": true, "why_ar": "صح؛ تطبيقات RTAP تنبّه (alert) المستخدمين عند وقوع حدث.", "why_en": "True — RTAP applications can alert end users when a situation occurs.", "slide": 29, "hot": false}, {"id": "p2-062", "lecture": "p2", "topic_en": "Visual analysis, BI, OLTP/OLAP and RTAP", "topic_ar": "التحليل المرئي وذكاء الأعمال وOLTP/OLAP وRTAP", "type": "mcq", "q_en": "Which of the following is NOT a type of OLAP system?", "q_ar": "أيٌّ مما يلي ليس من أنواع أنظمة OLAP؟", "answer": 0, "options": [{"en": "RTAP", "ar": "RTAP"}, {"en": "MOLAP", "ar": "MOLAP"}, {"en": "ROLAP", "ar": "ROLAP"}, {"en": "HOLAP", "ar": "HOLAP"}], "why_ar": "أنواع OLA
