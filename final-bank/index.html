<!doctype html>
<html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>بنك البيانات الضخمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Readex+Pro:wght@500;700&display=swap">
<style>
/* Layout: a single study column — sticky control bar on top, question cards flow below like numbered exam sheets. */
:root{
  --paper:#f3f5f8; --sheet:#ffffff; --ink:#141c29; --muted:#5b6678; --line:#dde2ea;
  --accent:#2a55c0; --accent-soft:#e6ecfa; --hot:#b7790b; --hot-soft:#fbf1dc;
  --good:#1d7f52; --good-soft:#e3f4ea; --bad:#b93b26; --bad-soft:#fbe7e2;
  --code-bg:#eef1f6;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-ar:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-en:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f141c; --sheet:#171e2a; --ink:#e7ecf3; --muted:#97a3b6; --line:#2a3445;
  --accent:#7d9bf0; --accent-soft:#1e2a45; --hot:#e3a93b; --hot-soft:#33270f;
  --good:#4cc28a; --good-soft:#12301f; --bad:#f07d68; --bad-soft:#3a1a14; --code-bg:#1f2836; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f141c; --sheet:#171e2a; --ink:#e7ecf3; --muted:#97a3b6; --line:#2a3445;
  --accent:#7d9bf0; --accent-soft:#1e2a45; --hot:#e3a93b; --hot-soft:#33270f;
  --good:#4cc28a; --good-soft:#12301f; --bad:#f07d68; --bad-soft:#3a1a14; --code-bg:#1f2836; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ar);font-size:16px;line-height:1.7;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:820px;margin-inline:auto}
header.top{padding-block:28px 12px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.5rem,4vw,2.1rem);margin:0;line-height:1.25;text-wrap:balance}
h1 small{display:block;font-family:var(--f-en);font-weight:500;font-size:.8rem;color:var(--muted);letter-spacing:.04em;margin-top:4px}
.stats{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.stat b{display:block;font-family:var(--f-display);font-size:1.35rem;line-height:1.1}
.stat span{font-size:.78rem;color:var(--muted)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.modes,.chips,.filters{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;color:inherit;cursor:pointer}
.mode{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.92rem}
.mode[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:5px 10px;font-size:.85rem;display:flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip .n{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.chip .pg{display:inline-block;width:34px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.chip .pg i{display:block;height:100%;background:var(--good)}
.filters{align-items:center;font-size:.85rem;color:var(--muted)}
.filters label{display:flex;gap:4px;align-items:center;cursor:pointer}
.filters select{font:inherit;background:var(--sheet);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.ghost{border:1px solid var(--line);background:transparent;border-radius:6px;padding:4px 10px;font-size:.82rem}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.intro{margin-block:16px;padding:12px 14px;border-inline-start:3px solid var(--accent);background:var(--sheet);border-radius:0 var(--r) var(--r) 0;font-size:.92rem;color:var(--muted)}
.intro b{color:var(--ink)}
.list{display:grid;gap:14px;margin-top:16px}
.q{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;display:grid;gap:10px;min-width:0}
.q.ok{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.q.no{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.78rem;color:var(--muted)}
.num{font-family:var(--f-mono);font-weight:600;color:var(--ink);font-size:.82rem}
.tag{padding:1px 8px;border-radius:999px;background:var(--code-bg);font-weight:500}
.tag.hot{background:var(--hot-soft);color:var(--hot);font-weight:600}
.tag.t-tf{background:var(--accent-soft);color:var(--accent)}
.q-en{font-family:var(--f-en);font-size:1.05rem;font-weight:500;line-height:1.55;direction:ltr;text-align:left;overflow-wrap:anywhere}
.q-ar{font-size:.95rem;color:var(--muted);line-height:1.7;overflow-wrap:anywhere}
code,.mono{font-family:var(--f-mono);font-size:.88em;background:var(--code-bg);padding:1px 5px;border-radius:4px;direction:ltr;unicode-bidi:isolate}
.opts{display:grid;gap:8px}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:start;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 12px;min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.mode:focus-visible,.chip:focus-visible,.ghost:focus-visible,.explain-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt .k{font-family:var(--f-mono);font-weight:600;font-size:.8rem;color:var(--muted);flex:none;width:1.4em;padding-top:2px}
.opt .t{display:grid;min-width:0}
.opt .t .en{font-family:var(--f-en);direction:ltr;text-align:left;overflow-wrap:anywhere}
.opt .t .ar{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.opts.tf .opt{justify-content:center;font-weight:600}
.opt.pick{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.ans{border-radius:8px;padding:10px 12px;display:grid;gap:6px;font-size:.92rem}
.ans.ok{background:var(--good-soft)}
.ans.no{background:var(--bad-soft)}
.ans.neutral{background:var(--code-bg)}
.verdict{font-weight:700}
.ans.ok .verdict{color:var(--good)} .ans.no .verdict{color:var(--bad)}
.why-en,.correct{font-family:var(--f-en);direction:ltr;text-align:left;font-size:.88rem;overflow-wrap:anywhere}
.correct{border-inline-start:3px solid var(--good);padding-inline-start:8px}
.correct::before{content:"✔ ";color:var(--good)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.explain-btn{border:1px solid var(--hot);color:var(--hot);background:transparent;border-radius:6px;padding:3px 12px;font-size:.85rem;font-weight:600}
.explain{background:var(--hot-soft);border-radius:8px;padding:10px 12px;font-size:.92rem;line-height:1.8}
.exam-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:16px}
.exam-bar b{font-family:var(--f-display)}
.primary{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 18px;font-weight:700}
:root[data-theme="dark"] .primary{color:#0f141c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .primary{color:#0f141c}}
.score{font-family:var(--f-display);font-size:1.6rem}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--sheet);border:1px dashed var(--line);border-radius:var(--r)}
.more{display:flex;justify-content:center;margin-top:14px}
@media (max-width:520px){.opts.tf{grid-template-columns:1fr 1fr}.stats{gap:12px}}
@media (prefers-reduced-motion:no-preference){.q{transition:border-color .2s}}
</style>

<div class="wrap" dir="rtl" lang="ar">
  <header class="top">
    <h1>بنك أسئلة البيانات الضخمة<small><span dir="ltr">Big Data · Final T/F + MCQ</span> · أ. سعاد عثمان</small></h1>
    <div class="stats" id="stats"></div>
  </header>

  <div class="bar">
    <div class="modes" role="group" aria-label="الوضع">
      <button class="mode" data-mode="bank" id="m-bank">البنك حسب المحاضرة</button>
      <button class="mode" data-mode="exam" id="m-exam">نماذج النهائي</button>
      <button class="mode" data-mode="wrong" id="m-wrong">أخطائي</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="المحاضرات"></div>
    <div class="filters" id="filters">
      <label for="f-type">النوع
        <select id="f-type"><option value="all">الكل</option><option value="tf">صح وخطأ</option><option value="mcq">اختيارات</option></select>
      </label>
      <label for="f-state">الحالة
        <select id="f-state"><option value="all">الكل</option><option value="new">لم أحلها</option><option value="bad">أخطأت فيها</option></select>
      </label>
      <label><input type="checkbox" id="f-hot"> 🔥 جاءت في النصفي فقط</label>
      <button class="ghost" id="shuffle">خلط الترتيب</button>
      <button class="ghost" id="reset">مسح إجابات هذا القسم</button>
    </div>
  </div>

  <main id="main"></main>
</div>

y is used for high availability as well as load balancing with lower system performance and reliability.", "q_ar": "تُستخدم تقنية الحوسبة العنقودية للتوفر العالي وكذلك لموازنة الحمل مع أداء وموثوقية أقل (lower) للنظام.", "answer": false, "correct_en": "Cluster computing technology is used for high availability as well as load balancing with better system performance and reliability.", "why_ar": "خطأ؛ الحوسبة العنقودية تعطي أداء وموثوقية أفضل (better) وليس أقل.", "why_en": "False — it gives better, not lower, performance and reliability.", "slide": 3, "hot": true}, {"id": "st-009", "lecture": "storage", "topic_en": "Cluster computing", "topic_ar": "الحوسبة العنقودية", "type": "mcq", "q_en": "Which of the following is NOT a benefit of massively parallel processors and cluster computers?", "q_ar": "أيٌّ مما يلي ليس من فوائد المعالجات المتوازية الضخمة وحواسيب العناقيد؟", "answer": 3, "options": [{"en": "High availability", "ar": "التوفر العالي (High availability)"}, {"en": "Scalable performance", "ar": "أداء قابل للتوسع (Scalable performance)"}, {"en": "Fault tolerance", "ar": "تحمّل الأعطال (Fault tolerance)"}, {"en": "The use of expensive specialized hardware", "ar": "استخدام عتاد متخصص باهظ الثمن (expensive specialized hardware)"}], "why_ar": "الإجابة: العتاد الباهظ؛ الفائدة الرابعة الصحيحة هي استخدام عتاد سلعي رخيص (cost-effective commodity hardware).", "why_en": "The fourth benefit is cost-effective commodity hardware, not expensive hardware.", "explain_ar": "الفوائد الأربع في السلايد: high availability، scalable performance، fault tolerance، cost-effective commodity hardware. الفخ هنا عكس الكلمة: expensive بدل cost-effective. نفس الفكرة تتكرر في Scaling-out (low cost commodity hardware).", "slide": 3, "hot": false}, {"id": "st-010", "lecture": "storage", "topic_en": "Cluster computing", "topic_ar": "الحوسبة العنقودية", "type": "mcq", "q_en": "Cluster computing has a ____ model and a peer-to-peer model.", "q_ar": "للحوسبة العنقودية نموذج ____ ونموذج الند للند (peer-to-peer).", "answer": 0, "options": [{"en": "master-slave", "ar": "السيد-التابع (master-slave)"}, {"en": "key-value", "ar": "المفتاح-القيمة (key-value)"}, {"en": "scaling-up", "ar": "التوسع الرأسي (scaling-up)"}, {"en": "document", "ar": "المستندات (document)"}], "why_ar": "الإجابة master-slave؛ الحوسبة العنقودية لها نموذج master-slave ونموذج peer-to-peer.", "why_en": "Cluster computing has a master-slave model and a peer-to-peer model.", "slide": 3, "hot": false}, {"id": "st-011", "lecture": "storage", "topic_en": "Cluster computing", "topic_ar": "الحوسبة العنقودية", "type": "mcq", "q_en": "Cluster computing technology is used for ____ as well as load balancing with better system performance and reliability.", "q_ar": "تُستخدم تقنية الحوسبة العنقودية لـ ____ وكذلك لموازنة الحمل مع أداء وموثوقية أفضل للنظام.", "answer": 1, "options": [{"en": "sharding", "ar": "التجزئة (sharding)"}, {"en": "high availability", "ar": "التوفر العالي (high availability)"}, {"en": "schema rigidity", "ar": "جمود المخطط (schema rigidity)"}, {"en": "vertical scaling", "ar": "التوسع الرأسي (vertical scaling)"}], "why_ar": "الإجابة high availability؛ وهما نفس نوعي العناقيد حسب الغرض: HA وLoad balancing.", "why_en": "Cluster computing is used for high availability and load balancing.", "explain_ar": "لاحظ أن الكلمتين high availability وload balancing هما نفسهما نوعا العناقيد حسب الغرض (Types of Cluster) في السلايد 5. لو تذكرت الأنواع ستعرف هذه الجملة.", "slide": 3, "hot": true}, {"id": "st-012", "lecture": "storage", "topic_en": "Cluster types", "topic_ar": "أنواع العناقيد", "type": "tf", "q_en": "Based on their purpose, the clusters may be classified into two major types: high availability and load balancing.", "q_ar": "بناءً على الغرض منها، يمكن تصنيف العناقيد إلى نوعين رئيسيين: التوفر العالي (high availability) وموازنة الحمل (load balancing).", "answer": true, "why_ar": "صح؛ التصنيف حسب الغرض (purpose) = High availability وLoad balancing.", "why_en": "True — by purpose, clusters are high availability or load balancing.", "slide": 5, "hot": true}, {"id": "st-013", "lecture": "storage", "topic_en": "Cluster types", "topic_ar": "أنواع العناقيد", "type": "tf", "q_en": "Based on their purpose, the clusters may be classified into two major types: symmetric and asymmetric.", "q_ar": "بناءً على الغرض منها، يمكن تصنيف العناقيد إلى نوعين رئيسيين: متماثلة (symmetric) وغير متماثلة (asymmetric).", "answer": false, "correct_en": "Based on their purpose, the clusters may be classified into two major types: high availability and load balancing.", "why_ar": "خطأ؛ symmetric وasymmetric هو تصنيف بنية العنقود حسب طريقة الربط، أما حسب الغرض فهو HA وLoad balancing.", "why_en": "False — by purpose: HA and load balancing; symmetric/asymmetric is by how nodes are linked.", "explain_ar": "أهم فخ في المحاضرة: الأنواع (Types) حسب الغرض purpose = High availability / Load balancing. أما البنية (Structure) حسب طريقة الربط linked = Symmetric / Asymmetric. حيلة للحفظ: Purpose → ماذا أريد؟ (توفر أو توزيع حمل). Linked → كيف رُبطت الأجهزة؟ (متساوية أو برأس).", "slide": 5, "hot": true}, {"id": "st-014", "lecture": "storage", "topic_en": "Cluster types", "topic_ar": "أنواع العناقيد", "type": "tf", "q_en": "High availability clusters are designed to minimize downtime and provide uninterrupted service when nodes fail.", "q_ar": "عناقيد التوفر العالي (High availability clusters) مصممة لتقليل وقت التوقف (downtime) وتقديم خدمة غير منقطعة عند تعطل العقد.", "answer": true, "why_ar": "صح؛ هذا تعريف High availability clusters في السلايد 6.", "why_en": "True — this is the definition of high availability clusters.", "slide": 6, "hot": true}, {"id": "st-015", "lecture": "storage", "topic_en": "Cluster types", "topic_ar": "أنواع العناقيد", "type": "tf", "q_en": "Load-balancing clusters are designed to minimize downtime and provide uninterrupted service when nodes fail.", "q_ar": "عناقيد موازنة الحمل (Load-balancing clusters) مصممة لتقليل وقت التوقف وتقديم خدمة غير منقطعة عند تعطل العقد.", "answer": f تخدم وباقي العقد"}, {"en": "Nodes must have access to a shared storage, and many redundant nodes sustain faults and failures", "ar": "يجب أن تصل العقد إلى تخزين مشترك (shared storage)، ووجود عقد احتياطية كثيرة (redundant nodes) يتحمّل الأعطال"}, {"en": "They increase single point of failures", "ar": "تزيد نقاط الفشل المفردة"}], "why_ar": "الإجابة: shared storage وredundant nodes من صفات HA. توزيع الحمل = Load balancing، والـ head node = Asymmetric.", "why_en": "HA nodes need shared storage and redundant nodes make the system fault-tolerant.", "slide": 6, "hot": true}, {"id": "st-018", "lecture": "storage", "topic_en": "Cluster types", "topic_ar": "أنواع العناقيد", "type": "mcq", "q_en": "____ clusters are designed to distribute workloads across different cluster nodes to share the service load among the nodes.", "q_ar": "عناقيد ____ مصممة لتوزيع أحمال العمل على عقد العنقود المختلفة لمشاركة حمل الخدمة بين العقد.", "answer": 3, "options": [{"en": "High availability", "ar": "التوفر العالي (High availability)"}, {"en": "Symmetric", "ar": "المتماثلة (Symmetric)"}, {"en": "Asymmetric", "ar": "غير المتماثلة (Asymmetric)"}, {"en": "Load-balancing", "ar": "موازنة الحمل (Load-balancing)"}], "why_ar": "الإجابة Load-balancing؛ توزيع الأحمال (distribute workloads) هو تعريفها.", "why_en": "Load-balancing clusters distribute workloads across cluster nodes.", "explain_ar": "هذا بالضبط شكل سؤال الفراغ المتوقع. الكلمة المفتاحية distribute workloads / share the service load = Load-balancing. لو كانت الجملة عن minimize downtime فالجواب High availability.", "slide": 7, "hot": true}, {"id": "st-019", "lecture": "storage", "topic_en": "Cluster types", "topic_ar": "أنواع العناقيد", "type": "mcq", "q_en": "Which of the following is NOT an objective of load balancing?", "q_ar": "أيٌّ مما يلي ليس من أهداف موازنة الحمل (load balancing)؟", "answer": 0, "options": [{"en": "Provide all nodes with access to a shared storage", "ar": "تزويد جميع العقد بإمكانية الوصول إلى تخزين مشترك (shared storage)"}, {"en": "Optimize the use of resources", "ar": "تحسين استخدام الموارد (optimize the use of resources)"}, {"en": "Minimize response time", "ar": "تقليل زمن الاستجابة (minimize response time)"}, {"en": "Maximize throughput", "ar": "زيادة الإنتاجية (maximize throughput)"}], "why_ar": "الإجابة: shared storage شرط لعناقيد HA. أهداف LB: optimize resources، minimize response time، maximize throughput، avoid overload.", "why_en": "Shared storage is an HA requirement; LB objectives are optimize resources, minimize response time, maximize throughput, avoid overload.", "explain_ar": "احفظ أهداف LB الأربعة: optimize resources، minimize response time، maximize throughput، avoid overload. انتبه لعكس الكلمات: minimize response time (وليس maximize)، وmaximize throughput (وليس minimize).", "slide": 7, "hot": true}, {"id": "st-020", "lecture": "storage", "topic_en": "Cluster types", "topic_ar": "أنواع العناقيد", "type": "mcq", "q_en": "A highly available system ____ single point of failures.", "q_ar": "النظام عالي التوفر ____ نقاط الفشل المفردة (single point of failures).", "answer": 2, "options": [{"en": "increases", "ar": "يزيد (increases)"}, {"en": "creates", "ar": "ينشئ (creates)"}, {"en": "eliminates", "ar": "يلغي (eliminates)"}, {"en": "replicates", "ar": "ينسخ (replicates)"}], "why_ar": "الإجابة eliminates؛ النظام عالي التوفر يلغي نقاط الفشل المفردة.", "why_en": "A highly available system eliminates single point of failures.", "slide": 6, "hot": true}, {"id": "st-021", "lecture": "storage", "topic_en": "Cluster structure", "topic_ar": "بنية العناقيد", "type": "tf", "q_en": "Based on how these computers are linked together, cluster structure is classified into two types: symmetric clusters and asymmetric clusters.", "q_ar": "بناءً على طريقة ربط الحواسيب معًا، تُصنَّف بنية العنقود (cluster structure) إلى نوعين: عناقيد متماثلة (symmetric) وعناقيد غير متماثلة (asymmetric).", "answer": true, "why_ar": "صح؛ التصنيف حسب طريقة الربط (linked) = Symmetric وAsymmetric.", "why_en": "True — by linking, cluster structure is symmetric or asymmetric.", "slide": 8, "hot": true}, {"id": "st-022", "lecture": "storage", "topic_en": "Cluster structure", "topic_ar": "بنية العناقيد", "type": "tf", "q_en": "Asymmetric cluster is a type of cluster structure in which each node functions as an individual computer capable of running applications.", "q_ar": "العنقود غير المتماثل (Asymmetric cluster) هو نوع من بنية العنقود تعمل فيه كل عقدة كحاسوب مستقل قادر على تشغيل التطبيقات.", "answer": false, "correct_en": "Symmetric cluster is a type of cluster structure in which each node functions as an individual computer capable of running applications.", "why_ar": "خطأ؛ هذا تعريف Symmetric cluster. أما Asymmetric ففيه head node يعمل كبوابة.", "why_en": "False — this defines a symmetric cluster.", "explain_ar": "Symmetric = متماثل = كل العقد متساوية وكل عقدة حاسوب مستقل يشغّل التطبيقات. Asymmetric = غير متماثل = هناك عقدة مميزة (head node) تتحكم وتكون بوابة بين المستخدم والباقي.", "slide": 9, "hot": true}, {"id": "st-023", "lecture": "storage", "topic_en": "Cluster structure", "topic_ar": "بنية العناقيد", "type": "tf", "q_en": "Asymmetric clusters are a type of cluster structure in which one machine acts as the head node, and it serves as the gateway between the user and the remaining nodes.", "q_ar": "العناقيد غير المتماثلة (Asymmetric clusters) نوع من بنية العنقود يعمل فيه جهاز واحد كعقدة رئيسية (head node)، ويعمل كبوابة (gateway) بين المستخدم وباقي العقد.", "answer": true, "why_ar": "صح؛ هذا تعريف Asymmetric clusters في السلايد 9.", "why_en": "True — this is the definition of asymmetric clusters.", "slide": 9, "hot": true}, {"id": "st-024", "lecture": "storage", "topic_en": "Cluster structure", "topic_ar": "بنية العناقيد", "type": "tf", "q_en": "In symmetric clusters, there is centralized control: the master node orchestrates all activities (task distribution, failure recovery).", "q_ar": "في العناقيد المتماثلة (symmetric)، يوجد تحكم مركزي (centralized control): العقدة الرئيسية (master) تنظم جميع الأنشطة (توزيع المهام واستعادة الأعطال).", "answer": false, "correct_en": "In asymmetric clusters, there is centralized control: the master node orchestrates all activities (task distribution, failure recovery).", "why_ar": "خطأ؛ التحكم المركزي من صفات Asymmetric clusters. في Symmetric لا توجد أدوار مخصصة (no dedicated roles).", "why_en": "False — centralized control belongs to asymmetric clusters.", "explain_ar": "Symmetric: All nodes identical، Shared responsibilities، No dedicated roles، Fault tolerance (العقد الأخرى تعيد توزيع العمل). Asymmetric: Specialized roles (Head/Worker/Gateway) وCentralized control. أي كلمة master أو head أو centralized تعني Asymmetric.", "slide": [10, 11], "hot": true}, {"id": "st-025", "lecture": "storage", "topic_en": "Cluster structure", "topic_ar": "بنية العناقيد", "type": "tf", "q_en": "In symmetric clusters, no single node acts as a permanent \"master\"; leadership is often dynamic or rotated.", "q_ar": "في العناقيد المتماثلة، لا توجد عقدة واحدة تعمل كـ \"master\" دائم؛ القيادة غالبًا ديناميكية أو متناوبة (dynamic or rotated).", "answer": true, "why_ar": "صح؛ هذه صفة No dedicated roles في العناقيد المتماثلة.", "why_en": "True — symmetric clusters have no dedicated roles; leadership is dynamic or rotated.", "slide": 10, "hot": true}, {"id": "st-026", "lecture": "storage", "topic_en": "Cluster structure", "topic_ar": "بنية العناقيد", "type": "mcq", "q_en": "In symmetric clusters, if one node fails:", "q_ar": "في العناقيد المتماثلة، إذا تعطلت عقدة واحدة:", "answer": 1, "options": [{"en": "The head node must be replaced before work continues", "ar": "يجب استبدال العقدة الرئيسية قبل استمرار العمل"}, {"en": "Others redistribute its workload automatically", "ar": "تعيد العقد الأخرى توزيع حملها تلقائيًا"}, {"en": "The whole cluster stops", "ar": "يتوقف العنقود بأكمله"}, {"en": "Only the gateway node can take over its tasks", "ar": "عقدة البوابة فقط تستطيع تولي مهامها"}], "why_ar": "الإجابة: العقد الأخرى تعيد توزيع الحمل تلقائيًا (Fault tolerance).", "why_en": "In symmetric clusters, other nodes redistribute the failed node's workload automatically.", "slide": 10, "hot": true}, {"id": "st-027", "lecture": "storage", "topic_en": "Cluster structure", "topic_ar": "بنية العناقيد", "type": "mcq", "q_en": "In asymmetric clusters, Gateway Nodes:", "q_ar": "في العناقيد غير المتماثلة، عقد البوابة (Gateway Nodes):", "answer": 2, "options": [{"en": "Execute compute/storage tasks", "ar": "تنفذ مهام الحوسبة/التخزين"}, {"en": "Manage resources, schedule tasks and monitor health", "ar": "تدير الموارد وتجدول المهام وتراقب الحالة"}, {"en": "Handle external communications", "ar": "تتولى الاتصالات الخارجية (external communications)"}, {"en": "Store file metadata and block mapping", "ar": "تخزن البيانات الوصفية للملفات وخريطة الكتل"}], "why_ar": "الإجابة: Gateway Nodes تتولى الاتصالات الخارجية؛ Worker تنفذ المهام، وHead تدير الموارد.", "why_en": "Gateway nodes handle external communications.", "slide": 11, "hot": true}, {"id": "st-028", "lecture": "storage", "topic_en": "Cluster structure", "topic_ar": "بنية العناقيد", "type": "mcq", "q_en": "In asymmetric clusters, which node manages resources, schedules tasks, and monitors health?", "q_ar": "في العناقيد غير المتماثلة، أي عقدة تدير الموارد وتجدول المهام وتراقب الحالة؟", "answer": 3, "options": [{"en": "Worker Node", "ar": "العقدة العاملة (Worker Node)"}, {"en": "Gateway Node", "ar": "عقدة البوابة (Gateway Node)"}, {"en": "Data Node", "ar": "عقدة البيانات (Data Node)"}, {"en": "Head Node/Master", "ar": "العقدة الرئيسية (Head Node/Master)"}], "why_ar": "الإجابة Head Node/Master؛ هي المسؤولة عن إدارة الموارد وجدولة المهام ومراقبة الحالة.", "why_en": "The head node/master manages resources, schedules tasks and monitors health.", "explain_ar": "الأدوار الثلاثة: Head = المدير (manages, schedules, monitors). Worker = المنفّذ (execute compute/storage). Gateway = التواصل الخارجي (external communications). Data Node من محاضرة DFS وليست من أدوار Asymmetric clusters.", "slide": 11, "hot": true}, {"id": "st-029", "lecture": "storage", "topic_en": "Cluster structure", "topic_ar": "بنية العناقيد", "type": "mcq", "q_en": "Which of the following describes symmetric clusters?", "q_ar": "أيٌّ مما يلي يصف العناقيد المتماثلة (symmetric clusters)؟", "answer": 0, "options": [{"en": "All nodes are identical and share responsibilities; the setup is simple and straightforward", "ar": "جميع العقد متطابقة وتتشارك المسؤوليات؛ والإعداد بسيط ومباشر"}, {"en": "Nodes have specialized roles: head, worker and gateway", "ar": "للعقد أدوار متخصصة: رئيسية وعاملة وبوابة"}, {"en": "The master node orchestrates all activities", "ar": "العقدة الرئيسية تنظم جميع الأنشطة"}, {"en": "One machine acts as the head node and gateway", "ar": "جهاز واحد يعمل كعقدة رئيسية وبوابة"}], "why_ar": "الإجابة: العقد متطابقة وتتشارك المسؤوليات والإعداد بسيط؛ باقي الخيارات صفات Asymmetric.", "why_en": "Symmetric clusters have identical nodes with shared responsibilities and a simple setup.", "slide": [9, 10], "hot": true}, {"id": "st-030", "lecture": "storage", "topic_en": "Cluster structure", "topic_ar": "بنية العناقيد", "type": "mcq", "q_en": "In asymmetric clusters, ____ execute compute/storage tasks.", "q_ar": "في العناقيد غير المتماثلة، ____ تنفذ مهام الحوسبة/التخزين.", "answer": 2, "options": [{"en": "Head Nodes", "ar": "العقد الرئيسية (Head Nodes)"}, {"en": "Gateway Nodes", "ar": "عقد البوابة (Gateway Nodes)"}, {"en": "Worker Nodes", "ar": "العقد العاملة (Worker Nodes)"}, {"en": "Metadata Nodes", "ar": "عقد البيانات الوصفية (Metadata Nodes)"}], "why_ar": "الإجابة Worker Nodes؛ هي التي تنفذ مهام الحوسبة والتخزين.", "why_en": "Worker nodes execute compute/storage tasks.", "slide": 11, "hot": true}, {"id": "st-031", "lecture": "storage", "topic_en": "Distribution models", "topic_ar": "نماذج توزيع البيانات", "type": "tf", "q_en": "The main reason behind distributing data over a large cluster is to overcome the difficulty and to cut the cost of buying expensive servers.", "q_ar": "السبب الرئيسي وراء توزيع البيانات على عنقود كبير هو التغلب على الصعوبة وخفض تكلفة شراء خوادم باهظة الثمن.", "answer": true, "why_ar": "صح؛ جملة حرفية من السلايد 12.", "why_en": "True — distribution cuts the cost of buying expensive servers.", "slide": 12, "hot": false}, {"id": "st-032", "lecture": "storage", "topic_en": "Distribution models", "topic_ar": "نماذج توزيع البيانات", "type": "tf", "q_en": "The downside of distributing data over a large cluster is the complexity it introduces with the decrease in the number of computers added to the cluster.", "q_ar": "عيب توزيع البيانات على عنقود كبير هو التعقيد الذي يسببه مع انخفاض (decrease) عدد الحواسيب المضافة إلى العنقود.", "answer": false, "correct_en": "The downside of this type of architecture is the complexity it introduces with the increase in the number of computers added to the cluster.", "why_ar": "خطأ؛ التعقيد يزداد مع زيادة (increase) عدد الحواسيب وليس انخفاضه.", "why_en": "False — complexity comes with the increase in the number of computers.", "slide": 12, "hot": false}, {"id": "st-033", "lecture": "storage", "topic_en": "Distribution models", "topic_ar": "نماذج توزيع البيانات", "type": "tf", "q_en": "Sharding is the process of placing the same set of data over multiple nodes.", "q_ar": "التجزئة (Sharding) هي عملية وضع نفس مجموعة البيانات على عدة عقد.", "answer": false, "correct_en": "Replication is the process of placing the same set of data over multiple nodes.", "why_ar": "خطأ؛ هذا تعريف Replication. أما Sharding فهو وضع مجموعات مختلفة من البيانات على عقد مختلفة.", "why_en": "False — that is replication; sharding places different data on different nodes.", "explain_ar": "Replication = نسخ = نفس البيانات (same) على عدة عقد (للحماية من الأعطال). Sharding = تقسيم = بيانات مختلفة (different) على عقد مختلفة (لتوزيع الحجم). حيلة: shard تعني شظية/قطعة، أي كل عقدة تأخذ قطعة مختلفة.", "slide": 13, "hot": false}, {"id": "st-034", "lecture": "storage", "topic_en": "Distribution models", "topic_ar": "نماذج توزيع البيانات", "type": "mcq", "q_en": "____ is the process of placing different sets of data on different nodes.", "q_ar": "____ هي عملية وضع مجموعات مختلفة من البيانات على عقد مختلفة.", "answer": 1, "options": [{"en": "Replication", "ar": "النسخ المتماثل (Replication)"}, {"en": "Sharding", "ar": "التجزئة (Sharding)"}, {"en": "Scaling-up", "ar": "التوسع الرأسي (Scaling-up)"}, {"en": "Load balancing", "ar": "موازنة الحمل (Load balancing)"}], "why_ar": "الإجابة Sharding؛ Replication يضع نفس البيانات على عدة عقد.", "why_en": "Sharding places different sets of data on different nodes.", "slide": 13, "hot": false}, {"id": "st-035", "lecture": "storage", "topic_en": "Distribution models", "topic_ar": "نماذج توزيع البيانات", "type": "mcq", "q_en": "Replication can be performed using:", "q_ar": "يمكن تنفيذ النسخ المتماثل (Replication) باستخدام:", "answer": 2, "options": [{"en": "a symmetric model or an asymmetric model", "ar": "نموذج متماثل أو غير متماثل"}, {"en": "a key-value model or a graph model", "ar": "نموذج المفتاح-القيمة أو النموذج الرسومي"}, {"en": "a peer-to-peer model or a master-slave model", "ar": "نموذج الند للند (peer-to-peer) أو نموذج السيد-التابع (master-slave)"}, {"en": "a scaling-up model or a scaling-out model", "ar": "نموذج التوسع الرأسي أو الأفقي"}], "why_ar": "الإجابة: peer-to-peer أو master-slave، كما في السلايد 13.", "why_en": "Replication uses a peer-to-peer or master-slave model.", "slide": 13, "hot": false}, {"id": "st-036", "lecture": "storage", "topic_en": "Distribution models", "topic_ar": "نماذج توزيع البيانات", "type": "mcq", "q_en": "Which statement about sharding and replication is correct?", "q_ar": "أي عبارة عن التجزئة (sharding) والنسخ المتماثل (replication) صحيحة؟", "answer": 3, "options": [{"en": "They can never be used together", "ar": "لا يمكن استخدامهما معًا أبدًا"}, {"en": "Replication places different sets of data on different nodes", "ar": "النسخ المتماثل يضع مجموعات مختلفة من البيانات على عقد مختلفة"}, {"en": "They are the two types of cluster structure", "ar": "هما نوعا بنية العنقود"}, {"en": "They can either be used alone or together", "ar": "يمكن استخدامهما منفردين أو معًا"}], "why_ar": "الإجابة: يمكن استخدامهما منفردين أو معًا؛ وهما أهم تقنيتين لتوزيع البيانات (data distribution).", "why_en": "Sharding and replication can be used alone or together; they are the two major data-distribution techniques.", "explain_ar": "Replication وSharding هما the two major techniques of data distribution، وليسا أنواع عناقيد (Types = HA/LB، Structure = Symmetric/Asymmetric). يمكن الجمع بينهما: نقسم البيانات إلى shards ثم ننسخ كل shard على أكثر من عقدة.", "slide": [12, 13], "hot": false}, {"id": "st-037", "lecture": "storage", "topic_en": "Distributed File System (DFS)", "topic_ar": "نظام الملفات الموزع (DFS)", "type": "mcq", "q_en": "A storage system managing files across multiple nodes, appearing as a single entity to users, is called:", "q_ar": "نظام تخزين يدير الملفات عبر عدة عقد ويظهر للمستخدمين ككيان واحد يسمى:", "answer": 0, "options": [{"en": "Distributed File System (DFS)", "ar": "نظام الملفات الموزع (Distributed File System - DFS)"}, {"en": "Relational database (RDBMS)", "ar": "قاعدة البيانات العلائقية (RDBMS)"}, {"en": "Load-balancing cluster", "ar": "عنقود موازنة الحمل (Load-balancing cluster)"}, {"en": "Key-value store", "ar": "مخزن المفتاح-القيمة (Key-value store)"}], "why_ar": "الإجابة DFS؛ وهو مصمم للتوسع وتحمّل الأعطال في بيئات Big Data/cloud.", "why_en": "This is the definition of a distributed file system (DFS).", "slide": 14, "hot": true}, {"id": "st-038", "lecture": "storage", "topic_en": "Distributed File System (DFS)", "topic_ar": "نظام الملفات الموزع (DFS)", "type": "tf", "q_en": "The Metadata Node (e.g., NameNode in HDFS) coordinates file operations (read/write).", "q_ar": "عقدة البيانات الوصفية (Metadata Node) مثل NameNode في HDFS تنسّق عمليات الملفات (القراءة/الكتابة).", "answer": true, "why_ar": "صح؛ الـ Metadata Node هي التي تنسق عمليات الملفات وتخزن البيانات الوصفية.", "why_en": "True — the Metadata Node (NameNode) coordinates file operations.", "slide": 15, "hot": true}, {"id": "st-039", "lecture": "storage", "topic_en": "Distributed File System (DFS)", "topic_ar": "نظام الملفات الموزع (DFS)", "type": "tf", "q_en": "Data Nodes coordinate file operations (read/write).", "q_ar": "عقد البيانات (Data Nodes) تنسّق عمليات الملفات (القراءة/الكتابة).", "answer": false, "correct_en": "Metadata Node (e.g., NameNode in HDFS) coordinates file operations (read/write).", "why_ar": "خطأ؛ التنسيق مهمة Metadata Node (NameNode). أما Data Nodes فتخزن الكتل وتخدم طلبات القراءة/الكتابة.", "why_en": "False — the Metadata Node coordinates file operations; Data Nodes store blocks and serve requests.", "explain_ar": "هذا سؤال الميدتيرم حرفيًا. Metadata Node = المدير: يعرف أين كل شيء (names, locations, permissions, block mapping) وينسق. Data Nodes = العمال: تخزن الكتل الفعلية (128MB) وتخدم القراءة/الكتابة مباشرة للعميل. coordinates = Metadata Node دائمًا.", "slide": 15, "hot": true}, {"id": "st-040", "lecture": "storage", "topic_en": "Distributed File System (DFS)", "topic_ar": "نظام الملفات الموزع (DFS)", "type": "tf", "q_en": "Data Nodes store file metadata (names, locations, permissions, block mapping).", "q_ar": "عقد البيانات (Data Nodes) تخزن البيانات الوصفية للملفات (الأسماء والمواقع والصلاحيات وخريطة الكتل).", "answer": false, "correct_en": "Metadata Node (e.g., NameNode in HDFS) stores file metadata (names, locations, permissions, block mapping).", "why_ar": "خطأ؛ البيانات الوصفية تخزنها Metadata Node. أما Data Nodes فتخزن كتل البيانات الفعلية.", "why_en": "False — the Metadata Node stores file metadata; Data Nodes store actual data blocks.", "slide": 15, "hot": true}, {"id": "st-041", "lecture": "storage", "topic_en": "Distributed File System (DFS)", "topic_ar": "نظام الملفات الموزع (DFS)", "type": "tf", "q_en": "When reading a file, the client reads blocks directly from the Metadata Node.", "q_ar": "عند قراءة ملف، يقرأ العميل (client) الكتل مباشرة من عقدة البيانات الوصفية (Metadata Node).", "answer": false, "correct_en": "When reading a file, the client queries the Metadata Node for block locations, then reads blocks directly from the nearest Data Nodes.", "why_ar": "خطأ؛ العميل يسأل Metadata Node عن مواقع الكتل فقط، ثم يقرأ الكتل مباشرة من أقرب Data Nodes.", "why_en": "False — the client gets block locations from the Metadata Node and reads blocks from the nearest Data Nodes.", "explain_ar": "القراءة خطوتان: (1) سؤال Metadata Node: أين الكتل؟ (2) القراءة مباشرة من أقرب Data Nodes. البيانات نفسها لا تمر عبر Metadata Node، وهذا يتوافق مع أن Data Nodes تخدم read/write directly to clients.", "slide": 16, "hot": true}, {"id": "st-042", "lecture": "storage", "topic_en": "Distributed File System (DFS)", "topic_ar": "نظام الملفات الموزع (DFS)", "type": "tf", "q_en": "In DFS, Data Locality means processing data on the node where it's stored.", "q_ar": "في DFS، تعني محلية البيانات (Data Locality) معالجة البيانات على العقدة التي تُخزَّن فيها.", "answer": true, "why_ar": "صح؛ Data Locality من الميزات الأساسية لـ DFS: المعالجة تتم حيث توجد البيانات.", "why_en": "True — data locality means processing data on the node where it is stored.", "slide": 14, "hot": true}, {"id": "st-043", "lecture": "storage", "topic_en": "Distributed File System (DFS)", "topic_ar": "نظام الملفات الموزع (DFS)", "type": "mcq", "q_en": "Which of the following is NOT a key feature of DFS?", "q_ar": "أيٌّ مما يلي ليس من الميزات الأساسية لنظام الملفات الموزع (DFS)؟", "answer": 0, "options": [{"en": "Schema rigidity: schema changes require downtime", "ar": "جمود المخطط (Schema rigidity): تغيير المخطط يتطلب توقف النظام"}, {"en": "Fault tolerance: automatic data replication (e.g., 3 copies)", "ar": "تحمّل الأعطال (Fault tolerance): نسخ تلقائي للبيانات (مثلًا 3 نسخ)"}, {"en": "Data locality: processing data on the node where it's stored", "ar": "محلية البيانات (Data locality): المعالجة على العقدة التي تُخزَّن فيها البيانات"}, {"en": "Scalability: add nodes to increase capacity", "ar": "قابلية التوسع (Scalability): إضافة عقد لزيادة السعة"}], "why_ar": "الإجابة Schema rigidity؛ وهي مشكلة في RDBMS وليست ميزة لـ DFS.", "why_en": "Schema rigidity is an RDBMS problem; DFS features are fault tolerance, data locality and scalability.", "slide": [14, 18], "hot": true}, {"id": "st-044", "lecture": "storage", "topic_en": "Distributed File System (DFS)", "topic_ar": "نظام الملفات الموزع (DFS)", "type": "mcq", "q_en": "HDFS, which is used for batch processing of large files, was inspired by:", "q_ar": "نظام HDFS المستخدم للمعالجة الدفعية (batch processing) للملفات الكبيرة، استُلهم من:", "answer": 1, "options": [{"en": "HBase", "ar": "HBase"}, {"en": "Google File System (GFS)", "ar": "نظام ملفات جوجل (Google File System - GFS)"}, {"en": "Cassandra", "ar": "Cassandra"}, {"en": "MongoDB", "ar": "MongoDB"}], "why_ar": "الإجابة GFS؛ السلايد يقول Google File System هو مصدر الإلهام لـ HDFS.", "why_en": "GFS was the inspiration for HDFS.", "slide": 14, "hot": true}, {"id": "st-045", "lecture": "storage", "topic_en": "Distributed File System (DFS)", "topic_ar": "نظام الملفات الموزع (DFS)", "type": "mcq", "q_en": "When writing a file in DFS, which step comes LAST?", "q_ar": "عند كتابة ملف في DFS، أي خطوة تأتي في النهاية؟", "answer": 3, "options": [{"en": "Client splits file into blocks", "ar": "يقسم العميل الملف إلى كتل"}, {"en": "Metadata Node assigns blocks to Data Nodes", "ar": "تخصص Metadata Node الكتل لعقد البيانات"}, {"en": "Blocks replicate across ≥3 nodes (pipelined write)", "ar": "تُنسخ الكتل على 3 عقد أو أكثر (pipelined write)"}, {"en": "Metadata Node updates file-block mapping", "ar": "تحدّث Metadata Node خريطة الملف-الكتل (file-block mapping)"}], "why_ar": "الإجابة: تحديث file-block mapping هو الخطوة الأخيرة. الترتيب: split ← assign ← replicate ← update.", "why_en": "Write order: client splits, Metadata Node assigns, blocks replicate (≥3), Metadata Node updates mapping.", "explain_ar": "ترتيب الكتابة: (1) العميل يقسم الملف إلى blocks، (2) Metadata Node تخصص الكتل لـ Data Nodes، (3) الكتل تُنسخ على 3 عقد أو أكثر بطريقة pipelined، (4) Metadata Node تحدّث file-block mapping. لاحظ أن Metadata Node تبدأ وتنهي.", "slide": 16, "hot": true}, {"id": "st-046", "lecture": "storage", "topic_en": "Distributed File System (DFS)", "topic_ar": "نظام الملفات الموزع (DFS)", "type": "mcq", "q_en": "Which component stores actual data blocks (e.g., 128MB chunks in HDFS) and serves read/write requests directly to clients?", "q_ar": "أي مكوّن يخزن كتل البيانات الفعلية (مثلًا قطع بحجم 128MB في HDFS) ويخدم طلبات القراءة/الكتابة مباشرة للعملاء؟", "answer": 2, "options": [{"en": "Metadata Node (NameNode)", "ar": "عقدة البيانات الوصفية (NameNode)"}, {"en": "Head Node", "ar": "العقدة الرئيسية (Head Node)"}, {"en": "Data Nodes", "ar": "عقد البيانات (Data Nodes)"}, {"en": "Gateway Node", "ar": "عقدة البوابة (Gateway Node)"}], "why_ar": "الإجابة Data Nodes. الكتل (blocks) حجمها الثابت مثلًا 64MB–256MB وتُنسخ عبر العقد للتكرار (redundancy).", "why_en": "Data Nodes store the actual blocks and serve read/write requests directly.", "slide": 15, "hot": true}, {"id": "st-047", "lecture": "storage", "topic_en": "RDBMS vs NoSQL", "topic_ar": "قواعد البيانات العلائقية مقابل NoSQL", "type": "tf", "q_en": "Relational databases become unsuitable for vast amounts of data that may not be structured, which has led to the evolution of non-relational databases, which are schema-less.", "q_ar": "تصبح قواعد البيانات العلائقية غير مناسبة للكميات الهائلة من البيانات التي قد لا تكون مهيكلة، مما أدى إلى تطور قواعد البيانات غير العلائقية (non-relational) التي لا تعتمد على مخطط (schema-less).", "answer": true, "why_ar": "صح؛ هذا مضمون السلايد 17: NoSQL غير علائقية وschema-less، ومن أمثلتها Neo4J وRedis وCassandra وMongoDB.", "why_en": "True — non-relational (NoSQL) databases are schema-less.", "slide": 17, "hot": false}, {"id": "st-048", "lecture": "storage", "topic_en": "RDBMS vs NoSQL", "topic_ar": "قواعد البيانات العلائقية مقابل NoSQL", "type": "tf", "q_en": "In relational databases, horizontal scaling (adding CPU/RAM) hits hardware limits at TBs of data.", "q_ar": "في قواعد البيانات العلائقية، التوسع الأفقي (horizontal scaling) بإضافة CPU/RAM يصل إلى حدود العتاد عند التيرابايتات من البيانات.", "answer": false, "correct_en": "Vertical scaling (adding CPU/RAM) hits hardware limits at TBs of data.", "why_ar": "خطأ؛ إضافة CPU/RAM هي التوسع الرأسي (vertical scaling). أما NoSQL فتستخدم التوسع الأفقي.", "why_en": "False — adding CPU/RAM is vertical scaling, which is the RDBMS scalability issue.", "explain_ar": "أي شيء فيه adding CPU/RAM أو resources to the existing server = Vertical = Scaling-up = مشكلة RDBMS. أما Horizontal = Scaling-out = إضافة عقد/خوادم، وهي طريقة NoSQL (Distribute data across 1,000s of nodes).", "slide": 18, "hot": false}, {"id": "st-049", "lecture": "storage", "topic_en": "RDBMS vs NoSQL", "topic_ar": "قواعد البيانات العلائقية مقابل NoSQL", "type": "mcq", "q_en": "Which of the following is NOT one of the big data challenges of relational databases (RDBMS)?", "q_ar": "أيٌّ مما يلي ليس من تحديات البيانات الضخمة في قواعد البيانات العلائقية (RDBMS)؟", "answer": 3, "options": [{"en": "Scalability", "ar": "قابلية التوسع (Scalability)"}, {"en": "Schema rigidity", "ar": "جمود المخطط (Schema rigidity)"}, {"en": "Performance", "ar": "الأداء (Performance)"}, {"en": "Eventual consistency", "ar": "الاتساق النهائي (Eventual consistency)"}], "why_ar": "الإجابة Eventual consistency؛ وهي جزء من نموذج BASE في NoSQL. تحديات RDBMS: Scalability وSchema rigidity وPerformance (JOINs بطيئة وreplication يسبب تأخير).", "why_en": "Eventual consistency belongs to NoSQL's BASE model; RDBMS issues are scalability, schema rigidity and performance.", "explain_ar": "تحديات RDBMS الثلاثة: Scalability (vertical يصل لحدود العتاد)، Schema rigidity (تغيير المخطط يحتاج downtime ويصعب مع JSON/logs)، Performance (JOINs بطيئة عبر العقد الموزعة وreplication يسبب latency).", "slide": [18, 19], "hot": false}, {"id": "st-050", "lecture": "storage", "topic_en": "RDBMS vs NoSQL", "topic_ar": "قواعد البيانات العلائقية مقابل NoSQL", "type": "mcq", "q_en": "In NoSQL databases, the BASE model stands for:", "q_ar": "في قواعد بيانات NoSQL، نموذج BASE يعني:", "answer": 0, "options": [{"en": "Basically Available, Soft state, Eventual consistency", "ar": "Basically Available, Soft state, Eventual consistency"}, {"en": "Basically Available, Strict state, Eventual consistency", "ar": "Basically Available, Strict state, Eventual consistency"}, {"en": "Batch Available, Soft state, Exact consistency", "ar": "Batch Available, Soft state, Exact consistency"}, {"en": "Basically Atomic, Shared state, Eventual consistency", "ar": "Basically Atomic, Shared state, Eventual consistency"}], "why_ar": "الإجابة: Basically Available وSoft state وEventual consistency.", "why_en": "BASE = Basically Available, Soft state, Eventual consistency.", "slide": 19, "hot": false}, {"id": "st-051", "lecture": "storage", "topic_en": "NoSQL types & NewSQL", "topic_ar": "أنواع NoSQL و NewSQL", "type": "tf", "q_en": "Columnar NoSQL databases (e.g., Cassandra, HBase) are used for time-series and IoT data.", "q_ar": "قواعد بيانات NoSQL العمودية (Columnar) مثل Cassandra وHBase تُستخدم لبيانات السلاسل الزمنية (time-series) وإنترنت الأشياء (IoT).", "answer": true, "why_ar": "صح؛ حسب جدول السلايد 20: Columnar = Columns grouped، استخدامها time-series وIoT، وأمثلتها Cassandra وHBase.", "why_en": "True — columnar databases (Cassandra, HBase) serve time-series and IoT data.", "slide": 20, "hot": false}, {"id": "st-052", "lecture": "storage", "topic_en": "NoSQL types & NewSQL", "topic_ar": "أنواع NoSQL و NewSQL", "type": "tf", "q_en": "Redis and DynamoDB are examples of document NoSQL databases.", "q_ar": "Redis وDynamoDB أمثلة على قواعد بيانات NoSQL من نوع المستندات (document).", "answer": false, "correct_en": "Redis and DynamoDB are examples of key-value NoSQL databases.", "why_ar": "خطأ؛ Redis وDynamoDB من نوع Key-Value. أمثلة Document هي MongoDB وCouchbase.", "why_en": "False — Redis and DynamoDB are key-value; MongoDB and Couchbase are document databases.", "explain_ar": "احفظ الجدول: Document (JSON-like) ← MongoDB, Couchbase | Key-Value ← Redis, DynamoDB | Columnar ← Cassandra, HBase | Graph ← Neo4j, Amazon Neptune.", "slide": 20, "hot": false}, {"id": "st-053", "lecture": "storage", "topic_en": "NoSQL types & NewSQL", "topic_ar": "أنواع NoSQL و NewSQL", "type": "mcq", "q_en": "Which NoSQL type (Key → Value pairs) is best suited for caching and session management?", "q_ar": "أي نوع من NoSQL (أزواج مفتاح ← قيمة) هو الأنسب للتخزين المؤقت (caching) وإدارة الجلسات (session management)؟", "answer": 2, "options": [{"en": "Document", "ar": "المستندات (Document)"}, {"en": "Columnar", "ar": "العمودية (Columnar)"}, {"en": "Key-Value", "ar": "المفتاح-القيمة (Key-Value)"}, {"en": "Graph", "ar": "الرسومية (Graph)"}], "why_ar": "الإجابة Key-Value مثل Redis وDynamoDB.", "why_en": "Key-value databases serve caching and session management.", "slide": 20, "hot": false}, {"id": "st-054", "lecture": "storage", "topic_en": "NoSQL types & NewSQL", "topic_ar": "أنواع NoSQL و NewSQL", "type": "mcq", "q_en": "A social network that stores nodes and relationships and needs fraud detection across those relationships is best served by a ____ database.", "q_ar": "شبكة اجتماعية تخزن العقد والعلاقات (nodes/relationships) وتحتاج كشف الاحتيال عبر هذه العلاقات، يناسبها قاعدة بيانات من نوع ____.", "answer": 1, "options": [{"en": "Document (e.g., MongoDB, Couchbase)", "ar": "مستندات (Document) مثل MongoDB وCouchbase"}, {"en": "Graph (e.g., Neo4j, Amazon Neptune)", "ar": "رسومية (Graph) مثل Neo4j وAmazon Neptune"}, {"en": "Key-Value (e.g., Redis, DynamoDB)", "ar": "مفتاح-قيمة (Key-Value) مثل Redis وDynamoDB"}, {"en": "Columnar (e.g., Cassandra, HBase)", "ar": "عمودية (Columnar) مثل Cassandra وHBase"}], "why_ar": "الإجابة Graph؛ بنيتها Nodes/relationships واستخداماتها Fraud detection وsocial networks.", "why_en": "Graph databases (nodes/relationships) serve fraud detection and social networks.", "slide": 20, "hot": false}, {"id": "st-055", "lecture": "storage", "topic_en": "NoSQL types & NewSQL", "topic_ar": "أنواع NoSQL و NewSQL", "type": "tf", "q_en": "NewSQL databases provide scalable performance similar to that of NoSQL systems combining the ACID properties of a traditional database management system.", "q_ar": "قواعد بيانات NewSQL توفر أداءً قابلًا للتوسع مشابهًا لأنظمة NoSQL مع الجمع بين خصائص ACID لأنظمة إدارة قواعد البيانات التقليدية.", "answer": true, "why_ar": "صح؛ NewSQL = قابلية توسع NoSQL + خصائص ACID. من أمثلتها VoltDB وNuoDB وClustrix وMemSQL وTokuDB.", "why_en": "True — NewSQL combines NoSQL-like scalability with ACID properties.", "slide": 21, "hot": false}, {"id": "st-056", "lecture": "storage", "topic_en": "NoSQL types & NewSQL", "topic_ar": "أنواع NoSQL و NewSQL", "type": "tf", "q_en": "NewSQL databases provide scalable performance similar to that of NoSQL systems combining the BASE properties of a traditional database management system.", "q_ar": "قواعد بيانات NewSQL توفر أداءً قابلًا للتوسع مشابهًا لأنظمة NoSQL مع الجمع بين خصائص BASE لأنظمة إدارة قواعد البيانات التقليدية.", "answer": false, "correct_en": "NewSQL databases provide scalable performance similar to that of NoSQL systems combining the ACID properties of a traditional database management system.", "why_ar": "خطأ؛ NewSQL تجمع خصائص ACID (من قواعد البيانات التقليدية)، أما BASE فهو نموذج NoSQL.", "why_en": "False — NewSQL combines ACID properties, not BASE.", "explain_ar": "ACID = خصائص قواعد البيانات التقليدية (العلائقية). BASE = نموذج NoSQL. NewSQL تأخذ الأفضل من الاثنين: scalability من NoSQL وACID من التقليدية.", "slide": 21, "hot": false}, {"id": "st-057", "lecture": "storage", "topic_en": "NoSQL types & NewSQL", "topic_ar": "أنواع NoSQL و NewSQL", "type": "mcq", "q_en": "NewSQL databases (e.g., VoltDB, NuoDB, Clustrix) support relational data model with three layers:", "q_ar": "قواعد بيانات NewSQL (مثل VoltDB وNuoDB وClustrix) تدعم النموذج العلائقي بثلاث طبقات:", "answer": 1, "options": [{"en": "Presentation layer, business layer and data layer", "ar": "طبقة العرض وطبقة الأعمال وطبقة البيانات"}, {"en": "Administrative layer, transactional layer and storage layer", "ar": "الطبقة الإدارية (administrative) وطبقة المعاملات (transactional) وطبقة التخزين (storage)"}, {"en": "Head layer, worker layer and gateway layer", "ar": "طبقة الرأس وطبقة العمال وطبقة البوابة"}, {"en": "Metadata layer, block layer and replication layer", "ar": "طبقة البيانات الوصفية وطبقة الكتل وطبقة النسخ"}], "why_ar": "الإجابة: administrative وtransactional وstorage.", "why_en": "NewSQL's three layers are administrative, transactional and storage.", "slide": 21, "hot": false}, {"id": "st-058", "lecture": "storage", "topic_en": "Scaling up vs scaling out", "topic_ar": "التوسع الرأسي مقابل التوسع الأفقي", "type": "tf", "q_en": "Scaling-up is limited to the maximum scaling capacity of the server data.", "q_ar": "التوسع الرأسي (Scaling-up) محدود بأقصى سعة توسع لبيانات الخادم.", "answer": true, "why_ar": "صح؛ التوسع الرأسي يضيف موارد لنفس الخادم، فهو محدود بأقصى سعة لهذا الخادم. جاءت في الميدتيرم.", "why_en": "True — vertical scaling is limited to the maximum capacity of the server.", "slide": 23, "hot": true}, {"id": "st-059", "lecture": "storage", "topic_en": "Scaling up vs scaling out", "topic_ar": "التوسع الرأسي مقابل التوسع الأفقي", "type": "tf", "q_en": "Scaling-out is limited to the maximum scaling capacity of the server data.", "q_ar": "التوسع الأفقي (Scaling-out) محدود بأقصى سعة توسع لبيانات الخادم.", "answer": false, "correct_en": "Scaling-up is limited to the maximum scaling capacity of the server data.", "why_ar": "خطأ؛ هذا القيد خاص بـ Scaling-up. أما Scaling-out فيضيف خوادم/عقد جديدة حسب الحاجة.", "why_en": "False — this limit applies to scaling-up; scaling-out adds new servers as needed.", "explain_ar": "Scaling-up = vertical = نكبّر نفس الخادم (CPU/RAM/storage أكثر) ← سقفه هو أقصى nd storage components.", "q_ar": "التوسع الرأسي للتخزين (Scaling up) يستخدم عتادًا سلعيًا رخيصًا (low cost commodity hardware) ومكونات تخزين.", "answer": false, "correct_en": "Scaling out storage uses low cost commodity hardware and storage components.", "why_ar": "خطأ؛ العتاد السلعي الرخيص من صفات Scaling-out، أما Scaling-up فيستخدم خادمًا قويًا (مثل Oracle on a powerful server).", "why_en": "False — scaling out uses low cost commodity hardware.", "slide": 24, "hot": true}, {"id": "st-063", "lecture": "storage", "topic_en": "Scaling up vs scaling out", "topic_ar": "التوسع الرأسي مقابل التوسع الأفقي", "type": "mcq", "q_en": "In horizontal scalability, the additional component added is termed as:", "q_ar": "في التوسع الأفقي (horizontal scalability)، يُسمى المكوّن الإضافي المضاف:", "answer": 0, "options": [{"en": "node", "ar": "عقدة (node)"}, {"en": "block", "ar": "كتلة (block)"}, {"en": "shard", "ar": "جزء (shard)"}, {"en": "schema", "ar": "مخطط (schema)"}], "why_ar": "الإجابة node؛ المكوّن الإضافي في Scaling-out يسمى node.", "why_en": "The additional component added in scaling-out is termed a node.", "slide": 24, "hot": true}, {"id": "st-064", "lecture": "storage", "topic_en": "Scaling up vs scaling out", "topic_ar": "التوسع الرأسي مقابل التوسع الأفقي", "type": "mcq", "q_en": "Which of the following is a big data use case of scaling-up?", "q_ar": "أيٌّ مما يلي من حالات استخدام التوسع الرأسي (scaling-up) في البيانات الضخمة؟", "answer": 2, "options": [{"en": "NoSQL data distributed across 1,000s of nodes", "ar": "بيانات NoSQL موزعة على آلاف العقد"}, {"en": "HDFS clusters built from low cost commodity hardware", "ar": "عناقيد HDFS مبنية من عتاد سلعي رخيص"}, {"en": "Traditional RDBMS (e.g., Oracle on a powerful server)", "ar": "قواعد البيانات العلائقية التقليدية (مثل Oracle على خادم قوي)"}, {"en": "Applications with rapidly exploding data growth", "ar": "تطبيقات ذات نمو بيانات سريع جدًا"}], "why_ar": "الإجابة: Traditional RDBMS. حالات Scaling-up: RDBMS التقليدية والتطبيقات ذات نمو بيانات منخفض إلى متوسط.", "why_en": "Scaling-up suits traditional RDBMS and applications with low-to-moderate data growth.", "explain_ar": "Scaling-up يناسب الأنظمة التي لا تكبر كثيرًا: Traditional RDBMS (Oracle على خادم قوي) وApplications with low-to-moderate data growth. أي شيء فيه آلاف العقد أو commodity hardware أو نمو ضخم = Scaling-out.", "slide": 23, "hot": true}, {"id": "st-065", "lecture": "storage", "topic_en": "Scaling up vs scaling out", "topic_ar": "التوسع الرأسي مقابل التوسع الأفقي", "type": "mcq", "q_en": "The storage platforms can be scaled in two ways:", "q_ar": "يمكن توسيع منصات التخزين بطريقتين:", "answer": 3, "options": [{"en": "Replication and sharding", "ar": "النسخ المتماثل والتجزئة (Replication and sharding)"}, {"en": "Symmetric and asymmetric", "ar": "متماثل وغير متماثل (Symmetric and asymmetric)"}, {"en": "High availability and load balancing", "ar": "التوفر العالي وموازنة الحمل"}, {"en": "Scaling-up (vertical) and Scaling-out (horizontal)", "ar": "التوسع الرأسي (Scaling-up) والتوسع الأفقي (Scaling-out)"}], "why_ar": "الإجابة: Scaling-up وScaling-out. Scalability هي قدرة النظام على تلبية الطلب المتزايد على سعة التخزين.", "why_en": "Storage platforms scale up (vertical) or out (horizontal).", "slide": 22, "hot": false}, {"id": "st-066", "lecture": "storage", "topic_en": "Cluster structure", "topic_ar": "بنية العنقود", "type": "tf", "q_en": "In asymmetric clusters, Worker Nodes manage resources, schedule tasks, and monitor health.", "q_ar": "في العناقيد غير المتماثلة، العقد العاملة (Worker Nodes) تدير الموارد وتجدول المهام وتراقب الحالة.", "answer": false, "why_ar": "خطأ؛ هذا دور Head Node/Master. أما Worker Nodes فتنفذ مهام الحوسبة والتخزين.", "why_en": "False — that is the Head Node/Master; worker nodes execute compute/storage tasks.", "slide": 11, "hot": false, "correct_en": "Head Node/Master: Manages resources, schedules tasks, monitors health."}, {"id": "st-067", "lecture": "storage", "topic_en": "Cluster structure", "topic_ar": "بنية العنقود", "type": "mcq", "q_en": "In an asymmetric cluster, which nodes handle external communications?", "q_ar": "في العنقود غير المتماثل، أي العقد تتولى الاتصالات الخارجية (external communications)؟", "options": [{"en": "Head Node/Master", "ar": "العقدة الرئيسية (Head Node)"}, {"en": "Worker Nodes", "ar": "العقد العاملة (Worker Nodes)"}, {"en": "Gateway Nodes", "ar": "عقد البوابة (Gateway Nodes)"}, {"en": "Data Nodes", "ar": "عقد البيانات (Data Nodes)"}], "answer": 2, "why_ar": "الإجابة Gateway Nodes؛ الشريحة 11: Gateway Nodes: Handle external communications.", "why_en": "Gateway Nodes handle external communications (slide 11).", "slide": 11, "hot": false, "explain_ar": "أدوار العقد في Asymmetric: Head Node = يدير الموارد ويجدول ويراقب، Worker Nodes = تنفذ مهام الحوسبة والتخزين، Gateway Nodes = الاتصالات الخارجية. ملاحظة: الشريحة 9 تصف الـ head node بأنه gateway بين المستخدم وباقي العقد، لكن إذا جاء السؤال بلفظ external communications فالجواب Gateway Nodes."}, {"id": "st-068", "lecture": "storage", "topic_en": "Distributed File System (DFS)", "topic_ar": "نظام الملفات الموزع", "type": "tf", "q_en": "In DFS, files are split into variable-size blocks.", "q_ar": "في نظام الملفات الموزع (DFS)، تُقسم الملفات إلى كتل (blocks) متغيرة الحجم.", "answer": false, "why_ar": "خطأ؛ الكتل ثابتة الحجم (fixed-size) مثل 64MB إلى 256MB.", "why_en": "False — files are split into fixed-size blocks (e.g., 64MB–256MB).", "slide": 15, "hot": false, "correct_en": "Files are split into fixed-size blocks (e.g., 64MB–256MB)."}, {"id": "st-069", "lecture": "storage", "topic_en": "RDBMS vs NoSQL", "topic_ar": "العلائقية مقابل NoSQL", "type": "tf", "q_en": "One big data challenge of relational databases is performance: JOINs become slow across distributed nodes, and replication causes latency.", "q_ar": "من تحديات قواعد البيانات العلائقية مع البيانات الضخمة الأداء (Performance): عمليات الربط (JOINs) تصبح بطيئة عبر العقد الموزعة، والنسخ المتماثل يسبب تأخيرًا (latency).", "answer": true, "why_ar": "صح؛ هذا بند Performance في جدول تحديات RDBMS.", "why_en": "True — the Performance issue in the RDBMS challenges table.", "slide": 18, "hot": false, "explain_ar": "جدول تحديات RDBMS فيه 3 بنود: Scalability (التوسع الرأسي يصطدم بحدود العتاد عند TBs)، Schema Rigidity (تغيير المخطط يحتاج توقف ولا يناسب البيانات غير المهيكلة)، Performance (الـ JOINs بطيئة عبر العقد والـ replication يسبب latency)."}, {"id": "st-070", "lecture": "storage", "topic_en": "NoSQL types & NewSQL", "topic_ar": "أنواع NoSQL و NewSQL", "type": "mcq", "q_en": "Which of the following is a NewSQL database?", "q_ar": "أي مما يلي يُعد قاعدة بيانات NewSQL؟", "options": [{"en": "MemSQL", "ar": "MemSQL"}, {"en": "MongoDB", "ar": "MongoDB"}, {"en": "Cassandra", "ar": "Cassandra"}, {"en": "Neo4j", "ar": "Neo4j"}], "answer": 0, "why_ar": "الإجابة MemSQL؛ أمثلة NewSQL في الشريحة: VoltDB, NuoDB, Clustrix, MemSQL, TokuDB.", "why_en": "MemSQL — NewSQL examples are VoltDB, NuoDB, Clustrix, MemSQL and TokuDB.", "slide": 21, "hot": false, "explain_ar": "احفظ أمثلة NewSQL الخمسة: VoltDB, NuoDB, Clustrix, MemSQL, TokuDB. أما MongoDB فهي Document، و Cassandra فهي Column، و Neo4j فهي Graph."}, {"id": "st-071", "lecture": "storage", "topic_en": "Scaling up vs scaling out", "topic_ar": "التوسع الرأسي مقابل الأفقي", "type": "tf", "q_en": "Scalability is the ability of the system to meet the increasing demand for storage capacity.", "q_ar": "قابلية التوسع (Scalability) هي قدرة النظام على تلبية الطلب المتزايد على سعة التخزين.", "answer": true, "why_ar": "صح؛ هذا تعريف Scalability في الشريحة 22.", "why_en": "True — slide 22 definition of scalability.", "slide": 22, "hot": false}, {"id": "st-072", "lecture": "storage", "topic_en": "Cluster structure", "topic_ar": "بنية العنقود", "type": "tf", "q_en": "The asymmetric cluster setup is simple and straightforward, and additional machines can be added as needed.", "q_ar": "إعداد العنقود غير المتماثل (Asymmetric) بسيط ومباشر، ويمكن إضافة أجهزة إضافية حسب الحاجة.", "answer": false, "why_ar": "خطأ؛ هذا وصف Symmetric cluster. أما Asymmetric ففيه head node يعمل كبوابة بين المستخدم وباقي العقد.", "why_en": "False — that describes the symmetric cluster.", "slide": 9, "hot": false, "correct_en": "The symmetric cluster setup is simple and straightforward; additional machines can be added as needed."}, {"id": "ns-001", "lecture": "nosql", "topic_en": "Intro & NoSQL characteristics", "topic_ar": "مقدمة وخصائص قواعد NoSQL", "type": "tf", "q_en": "NoSQL database means \"Not Only SQL\".", "q_ar": "قاعدة بيانات NoSQL تعني «ليس SQL فقط» (Not Only SQL).", "answer": true, "why_ar": "صحيح؛ الاختصار NoSQL = Not Only SQL، أي ليست بالضرورة «بدون SQL».", "why_en": "True — NOSQL = NOT ONLY SQL.", "explain_ar": "انتبه للفخ: الشريحة تذكر أن No SQL قد تُفهم «لا تستخدم لغة SQL»، لكن التعريف المعتمد هو NOT ONLY SQL أي «ليس SQL فقط». إذا جاءك خيار «No SQL at all» فهو الخطأ.", "slide": [3, 4], "hot": false}, {"id": "ns-002", "lecture": "nosql", "topic_en": "Intro & NoSQL characteristics", "topic_ar": "مقدمة وخصائص قواعد NoSQL", "type": "tf", "q_en": "NoSQL databases are next generation databases mostly addressing being non-relational, distributed, open-source and vertically scalable.", "q_ar": "قواعد NoSQL هي قواعد الجيل التالي وتتميز غالبًا بأنها غير علائقية (non-relational) وموزعة ومفتوحة المصدر وقابلة للتوسع العمودي (vertically scalable).", "answer": false, "correct_en": "NoSQL databases are next generation databases mostly addressing being non-relational, distributed, open-source and horizontally scalable.", "why_ar": "خطأ؛ قواعد NoSQL قابلة للتوسع الأفقي (horizontally scalable) وليس العمودي.", "why_en": "False — NoSQL databases are horizontally scalable, not vertically.", "explain_ar": "التوسع الأفقي (scale out) = إضافة أجهزة جديدة للعنقود، والتوسع العمودي (scale up) = تقوية جهاز واحد. NoSQL تعمل على العناقيد (clusters) لذلك هي horizontally scalable.", "slide": 4, "hot": false}, {"id": "ns-003", "lecture": "nosql", "topic_en": "Intro & NoSQL characteristics", "topic_ar": "مقدمة وخصائص قواعد NoSQL", "type": "tf", "q_en": "NoSQL databases provide an ACID system, but not BASE as a Relational Database Management System.", "q_ar": "قواعد NoSQL توفر نظام ACID وليس BASE مثل نظام إدارة قواعد البيانات العلائقية (RDBMS).", "answer": false, "correct_en": "NoSQL databases provide a BASE (Basically Available, Soft state, Eventual consistent) system, but not ACID as a Relational Database Management System.", "why_ar": "خطأ؛ قواعد NoSQL توفر BASE وليس ACID، أما ACID فهو خاصية قواعد البيانات العلائقية.", "why_en": "False — NoSQL provides BASE, not ACID; ACID belongs to RDBMS.", "slide": 5, "hot": false}, {"id": "ns-004", "lecture": "nosql", "topic_en": "Intro & NoSQL characteristics", "topic_ar": "مقدمة وخصائص قواعد NoSQL", "type": "mcq", "q_en": "Which of the following is NOT a characteristic of NoSQL databases?", "q_ar": "أيٌّ مما يلي ليس من خصائص قواعد بيانات NoSQL؟", "answer": 2, "options": [{"en": "Schema-free", "ar": "بدون مخطط ثابت (Schema-free)"}, {"en": "Easy replication support and running well on clusters", "ar": "دعم سهل للنسخ المتماثل (replication) والعمل الجيد على العناقيد"}, {"en": "Full ACID transactions like an RDBMS", "ar": "معاملات ACID كاملة مثل RDBMS"}, {"en": "Simple API", "ar": "واجهة برمجة بسيطة (Simple API)"}], "why_ar": "خصائص NoSQL: نظام BASE وليس ACID، بدون مخطط، نسخ متماثل سهل على العناقيد، وواجهة API بسيطة.", "why_en": "Characteristics are BASE (not ACID), schema-free, easy replication on clusters, and simple API.", "slide": 5, "hot": false}, {"id": "ns-005", "lecture": "nosql", "topic_en": "Intro & NoSQL characteristics", "topic_ar": "مقدمة وخصائص قواعد NoSQL", "type": "mcq", "q_en": "BASE stands for:", "q_ar": "يرمز الاختصار BASE إلى:", "answer": 0, "options": [{"en": "Basically Available, Soft state, Eventual consistency", "ar": "Basically Available, Soft state, Eventual consistency"}, {"en": "Basically Atomic, Strong state, Eventual consistency", "ar": "Basically Atomic, Strong state, Eventual consistency"}, {"en": "Basically Available, Shared state, Exact consistency", "ar": "Basically Available, Shared state, Exact consistency"}, {"en": "Batch Available, Soft state, Extended consistency", "ar": "Batch Available, Soft state, Extended consistency"}], "why_ar": "BASE = متاح أساسًا (Basically Available)، حالة مرنة (Soft state)، اتساق نهائي (Eventual consistency).", "why_en": "BASE = Basically Available, Soft state, Eventual consistent.", "explain_ar": "لاحظ أن BASE عكس ACID كيميائيًا (قاعدة/حمض). كلمة Eventual هي المفتاح: البيانات تصبح متسقة «مع الوقت» وليس فورًا.", "slide": 5, "hot": false}, {"id": "ns-006", "lecture": "nosql", "topic_en": "Intro & NoSQL characteristics", "topic_ar": "مقدمة وخصائص قواعد NoSQL", "type": "mcq", "q_en": "According to the introduction, why is the relational database not suitable today? Because today we have:", "q_ar": "وفق المقدمة، لماذا لم تعد قاعدة البيانات العلائقية مناسبة اليوم؟ لأن لدينا اليوم:", "answer": 3, "options": [{"en": "Fewer users, more data, and batch apps", "ar": "مستخدمين أقل، وبيانات أكثر، وتطبيقات دفعية"}, {"en": "More users, less data, and static apps", "ar": "مستخدمين أكثر، وبيانات أقل، وتطبيقات ثابتة"}, {"en": "Fewer users, less data, and offline apps", "ar": "مستخدمين أقل، وبيانات أقل، وتطبيقات غير متصلة"}, {"en": "More users, more data, and interactive apps", "ar": "مستخدمين أكثر، وبيانات أكثر، وتطبيقات تفاعلية"}], "why_ar": "لدينا اليوم مستخدمون أكثر وبيانات أكثر وتطبيقات تفاعلية، فتغيرت متطلبات التخزين نحو التخزين والمعالجة الموزعة.", "why_en": "Today we have more users, more data and interactive apps, so storage needs distributed storage and processing.", "slide": [2, 3], "hot": false}, {"id": "ns-007", "lecture": "nosql", "topic_en": "BASE vs ACID", "topic_ar": "مقارنة BASE و ACID", "type": "tf", "q_en": "BASE is suitable for financial portals, while ACID is suitable for non-financial web-based applications.", "q_ar": "BASE مناسب للبوابات المالية (Financial Portals)، بينما ACID مناسب لتطبيقات الويب غير المالية.", "answer": false, "correct_en": "BASE is suitable for non-financial web-based applications, while ACID is suitable for financial portals.", "why_ar": "خطأ؛ العكس هو الصحيح: BASE لتطبيقات الويب غير المالية، و ACID للبوابات المالية لأنه آمن (Safe).", "why_en": "False — reversed: BASE suits non-financial web apps; ACID suits financial portals.", "explain_ar": "تذكّر: المال يحتاج أمانًا واتساقًا قويًا (Strong consistency) ← ACID = Safe. أما مواقع الويب العادية فتحتاج سرعة وتوافرًا ← BASE = Fast.", "slide": 6, "hot": false}, {"id": "ns-008", "lecture": "nosql", "topic_en": "BASE vs ACID", "topic_ar": "مقارنة BASE و ACID", "type": "tf", "q_en": "BASE uses scale out (unlimited), while ACID uses scale up (limited).", "q_ar": "يستخدم BASE التوسع الأفقي (Scale out) غير المحدود، بينما يستخدم ACID التوسع العمودي (Scale up) المحدود.", "answer": true, "why_ar": "صحيح؛ BASE يعمل على عنقود (cluster) ويتوسع أفقيًا بلا حد، و ACID على جهاز واحد ويتوسع عموديًا بحد.", "why_en": "True — BASE scales out without limit; ACID scales up with a limit.", "slide": 6, "hot": false}, {"id": "ns-009", "lecture": "nosql", "topic_en": "BASE vs ACID", "topic_ar": "مقارنة BASE و ACID", "type": "tf", "q_en": "In BASE, indexing uses full indexes, while in ACID indexing is mostly on keys.", "q_ar": "في BASE تكون الفهرسة كاملة (Full Indexes)، بينما في ACID تكون الفهرسة غالبًا على المفاتيح.", "answer": false, "correct_en": "In BASE, indexing is mostly on keys, while ACID has full indexes.", "why_ar": "خطأ؛ العكس: في BASE الفهرسة غالبًا على المفاتيح (Keys)، وفي ACID فهارس كاملة.", "why_en": "False — reversed: BASE indexing is mostly on keys; ACID has full indexes.", "slide": 6, "hot": false}, {"id": "ns-010", "lecture": "nosql", "topic_en": "BASE vs ACID", "topic_ar": "مقارنة BASE و ACID", "type": "tf", "q_en": "BASE provides strong consistency, while ACID accomplishes consistency \"eventually\".", "q_ar": "يوفر BASE اتساقًا قويًا (Strong consistency)، بينما يحقق ACID الاتساق «في النهاية» (eventually).", "answer": false, "correct_en": "ACID provides strong consistency, while BASE accomplishes consistency \"eventually\" (the system keeps functioning, data becomes consistent over time).", "why_ar": "خطأ؛ ACID هو صاحب الاتساق القوي، أما BASE فالبيانات تصبح متسقة مع الوقت (eventually).", "why_en": "False — reversed: ACID gives strong consistency; BASE reaches consistency eventually.", "slide": [6, 7], "hot": false}, {"id": "ns-011", "lecture": "nosql", "topic_en": "BASE vs ACID", "topic_ar": "مقارنة BASE و ACID", "type": "tf", "q_en": "NoSQL often trades immediate consistency for availability, partition tolerance, and performance.", "q_ar": "غالبًا ما تضحي NoSQL بالاتساق الفوري (immediate consistency) مقابل التوافر وتحمل التقسيم (partition tolerance) والأداء.", "answer": true, "why_ar": "صحيح؛ هذه هي مقايضة BASE: النظام يبقى يعمل والبيانات تتسق مع الوقت.", "why_en": "True — this is the BASE trade-off on slide 7.", "slide": 7, "hot": false}, {"id": "ns-012", "lecture": "nosql", "topic_en": "BASE vs ACID", "topic_ar": "مقارنة BASE و ACID", "type": "tf", "q_en": "All NoSQL systems are BASE; none of them offers ACID transactions.", "q_ar": "جميع أنظمة NoSQL هي BASE، ولا يوفر أيٌّ منها معاملات ACID.", "answer": false, "correct_en": "Not all NoSQL systems are BASE – some offer tunable consistency, even ACID transactions at the document level (MongoDB, Couchbase).", "why_ar": "خطأ؛ ليست كل أنظمة NoSQL من نوع BASE، فبعضها يوفر اتساقًا قابلًا للضبط بل ومعاملات ACID على مستوى المستند مثل MongoDB و Couchbase.", "why_en": "False — not all NoSQL systems are BASE; MongoDB and Couchbase offer ACID at the document level.", "explain_ar": "الفخ في كلمة All. الشريحة 7 تقول Not all NoSQL systems are BASE. أي جملة تعمم «كل NoSQL = BASE» أو «لا يوجد ACID في NoSQL» فهي خاطئة.", "slide": 7, "hot": false}, {"id": "ns-013", "lecture": "nosql", "topic_en": "BASE vs ACID", "topic_ar": "مقارنة BASE و ACID", "type": "mcq", "q_en": "In the comparison between ACID and BASE, BASE architecture is described as:", "q_ar": "في المقارنة بين ACID و BASE، توصف معمارية BASE بأنها:", "answer": 1, "options": [{"en": "Shared Something (Disk, Memory)", "ar": "شيء مشترك (Shared Something: القرص والذاكرة)"}, {"en": "Shared Nothing", "ar": "لا شيء مشترك (Shared Nothing)"}, {"en": "Shared Disk only", "ar": "قرص مشترك فقط (Shared Disk only)"}, {"en": "Shared Everything", "ar": "كل شيء مشترك (Shared Everything)"}], "why_ar": "BASE معماريته Shared Nothing (كل عقدة مستقلة)، أما ACID فهو Shared Something (القرص والذاكرة).", "why_en": "BASE is Shared Nothing; ACID is Shared Something (Disk, Memory).", "explain_ar": "Shared Nothing يعني أن كل عقدة في العنقود لها قرصها وذاكرتها، ولذلك يمكن التوسع أفقيًا بلا حدود. ACID يعمل على جهاز واحد يتشارك القرص والذاكرة.", "slide": 6, "hot": false}, {"id": "ns-014", "lecture": "nosql", "topic_en": "BASE vs ACID", "topic_ar": "مقارنة BASE و ACID", "type": "mcq", "q_en": "Which of the following describes ACID (not BASE)?", "q_ar": "أيٌّ مما يلي يصف ACID (وليس BASE)؟", "answer": 1, "options": [{"en": "Complex code, simple database", "ar": "كود معقد وقاعدة بيانات بسيطة (Complex code, simple database)"}, {"en": "Simple code, robust database", "ar": "كود بسيط وقاعدة بيانات متينة (Simple code, robust database)"}, {"en": "Scale out (unlimited)", "ar": "توسع أفقي غير محدود (Scale out)"}, {"en": "Simpler, faster, easier evolution", "ar": "أبسط وأسرع وتطور أسهل"}], "why_ar": "ACID: كود بسيط وقاعدة بيانات متينة. أما الخيارات الأخرى فهي صفات BASE.", "why_en": "ACID = simple code, robust database; the other options describe BASE.", "explain_ar": "في BASE تنتقل المسؤولية إلى التطبيق: القاعدة بسيطة فيصبح الكود معقدًا (يعالج الاتساق بنفسه). في ACID القاعدة متينة تتكفل بكل شيء فيبقى الكود بسيطًا.", "slide": 6, "hot": false}, {"id": "ns-015", "lecture": "nosql", "topic_en": "BASE vs ACID", "topic_ar": "مقارنة BASE و ACID", "type": "mcq", "q_en": "In the BASE vs ACID table, BASE is described as:", "q_ar": "في جدول المقارنة بين BASE و ACID، يوصف BASE بأنه:", "answer": 3, "options": [{"en": "Safe, isolation, runs on a single machine", "ar": "آمن، العزل (Isolation)، يعمل على جهاز واحد"}, {"en": "Safe, availability first, runs on a single machine", "ar": "آمن، الأولوية للتوافر، يعمل على جهاز واحد"}, {"en": "Fast, isolation, full indexes", "ar": "سريع، العزل، فهارس كاملة"}, {"en": "Fast, availability first, runs on a cluster", "ar": "سريع، الأولوية للتوافر (Availability first)، يعمل على عنقود (cluster)"}], "why_ar": "BASE: سريع، التوافر أولًا، عنقود. ACID: آمن، العزل، جهاز واحد.", "why_en": "BASE: fast, availability first, a cluster; ACID: safe, isolation, single machine.", "slide": 6, "hot": false}, {"id": "ns-016", "lecture": "nosql", "topic_en": "BASE vs ACID", "topic_ar": "مقارنة BASE و ACID", "type": "mcq", "q_en": "Which property belongs to BASE in the comparison table?", "q_ar": "أي خاصية تنتمي إلى BASE في جدول المقارنة؟", "answer": 0, "options": [{"en": "Simpler, faster, easier evolution", "ar": "أبسط وأسرع وتطور أسهل (Easier evolution)"}, {"en": "Difficult evolution", "ar": "تطور صعب (Difficult evolution)"}, {"en": "Isolation", "ar": "العزل (Isolation)"}, {"en": "Full indexes", "ar": "فهارس كاملة (Full Indexes)"}], "why_ar": "BASE: أبسط وأسرع وتطوره أسهل. أما التطور الصعب والعزل والفهارس الكاملة فهي صفات ACID.", "why_en": "BASE has simpler, faster, easier evolution; ACID has difficult evolution, isolation and full indexes.", "slide": 6, "hot": false}, {"id": "ns-017", "lecture": "nosql", "topic_en": "CAP theorem", "topic_ar": "نظرية CAP", "type": "tf", "q_en": "Any distributed database and shared-data system can have at most two of the three CAP properties.", "q_ar": "أي قاعدة بيانات موزعة أو نظام بيانات مشتركة يمكن أن يحقق على الأكثر خاصيتين من خصائص CAP الثلاث.", "answer": true, "why_ar": "صحيح؛ نظرية CAP: لا يمكن تحقيق أكثر من اثنتين من الاتساق والتوافر وتحمل التقسيم في الوقت نفسه.", "why_en": "True — CAP: at most two of Consistency, Availability, Partition tolerance.", "slide": [8, 9], "hot": false}, {"id": "ns-018", "lecture": "nosql", "topic_en": "CAP theorem", "topic_ar": "نظرية CAP", "type": "tf", "q_en": "Availability means that every read receives the most recent write.", "q_ar": "التوافر (Availability) يعني أن كل عملية قراءة تحصل على آخر عملية كتابة.", "answer": false, "correct_en": "Consistency – Every read receives the most recent write.", "why_ar": "خطأ؛ هذا تعريف الاتساق (Consistency). أما التوافر فيعني أن كل طلب يتلقى استجابة (غير خطأ).", "why_en": "False — that is Consistency; Availability means every request receives a (non-error) response.", "explain_ar": "طريقة التمييز: C = البيانات «صحيحة وحديثة» (most recent write). A = النظام «يرد دائمًا» (non-error response). P = النظام «يستمر رغم انقطاع الشبكة» (network partitions).", "slide": 9, "hot": false}, {"id": "ns-019", "lecture": "nosql", "topic_en": "CAP theorem", "topic_ar": "نظرية CAP", "type": "tf", "q_en": "During a network partition, a system must choose between consistency and partition tolerance.", "q_ar": "أثناء انقسام الشبكة (network partition)، يجب على النظام أن يختار بين الاتساق وتحمل التقسيم.", "answer": false, "correct_en": "During a network partition, a system must choose between C and A (Consistency and Availability).", "why_ar": "خطأ؛ أثناء انقسام الشبكة يجب الاختيار بين الاتساق (C) والتوافر (A).", "why_en": "False — during a partition the choice is between C and A (Consistency and Availability).", "explain_ar": "في النظام الموزع الانقسام أمر واقع لا مفر منه، فـ P لازمة. لذلك الاختيار الحقيقي يكون بين C و A: إما أن ترفض الطلب لتبقى متسقًا (CP) أو ترد بأي بيانات متاحة (AP).", "slide": 9, "hot": false}, {"id": "ns-020", "lecture": "nosql", "topic_en": "CAP theorem", "topic_ar": "نظرية CAP", "type": "tf", "q_en": "Partition tolerance means the system continues to operate despite network partitions.", "q_ar": "تحمل التقسيم (Partition Tolerance) يعني أن النظام يستمر في العمل رغم انقسامات الشبكة.", "answer": true, "why_ar": "صحيح؛ هذا هو تعريف Partition Tolerance في الشريحة.", "why_en": "True — this is the slide definition of Partition Tolerance.", "slide": 9, "hot": false}, {"id": "ns-021", "lecture": "nosql", "topic_en": "CAP theorem", "topic_ar": "نظرية CAP", "type": "mcq", "q_en": "In the CAP theorem, Availability means:", "q_ar": "في نظرية CAP، التوافر (Availability) يعني:", "answer": 2, "options": [{"en": "Every read receives the most recent write", "ar": "كل قراءة تحصل على آخر كتابة"}, {"en": "The system continues to operate despite network partitions", "ar": "النظام يستمر في العمل رغم انقسامات الشبكة"}, {"en": "Every request receives a (non-error) response", "ar": "كل طلب يتلقى استجابة (غير خطأ)"}, {"en": "Data becomes consistent over time", "ar": "البيانات تصبح متسقة مع مرور الوقت"}], "why_ar": "التوافر = كل طلب يتلقى استجابة غير خاطئة. أما «كل قراءة تحصل على آخر كتابة» فهو Consistency، و«الاستمرار رغم انقسامات الشبكة» هو Partition tolerance.", "why_en": "Availability = every request receives a (non-error) response.", "slide": 9, "hot": false}, {"id": "ns-022", "lecture": "nosql", "topic_en": "CAP theorem", "topic_ar": "نظرية CAP", "type": "mcq", "q_en": "Which group of databases is classified as CP?", "q_ar": "أي مجموعة من قواعد البيانات تُصنَّف ضمن CP؟", "answer": 3, "options": [{"en": "Cassandra, DynamoDB, Couchbase", "ar": "Cassandra و DynamoDB و Couchbase"}, {"en": "Voldemort, CouchDB, Riak", "ar": "Voldemort و CouchDB و Riak"}, {"en": "Relational databases (single-node)", "ar": "قواعد البيانات العلائقية (عقدة واحدة)"}, {"en": "BigTable, HBase, MongoDB (strict mode)", "ar": "BigTable و HBase و MongoDB (في الوضع الصارم)"}], "why_ar": "CP: BigTable و HBase و MongoDB. أما Cassandra و DynamoDB و Couchbase و Voldemort و CouchDB و Riak فهي AP، والعلائقية CA.", "why_en": "CP = BigTable, HBase, MongoDB; AP = Cassandra, DynamoDB, Couchbase, Voldemort, CouchDB, Riak; CA = relational/single-node.", "explain_ar": "حيلة للحفظ: CP = «عائلة جوجل + مونغو»: BigTable ومستنسخه HBase ومعهم MongoDB. أما AP فهي التي تفضل الرد دائمًا: Cassandra و DynamoDB و Riak و Voldemort و CouchDB و Couchbase. انتبه: CouchDB (AP) غير MongoDB (CP).", "slide": [8, 9], "hot": false}, {"id": "ns-023", "lecture": "nosql", "topic_en": "CAP theorem", "topic_ar": "نظرية CAP", "type": "mcq", "q_en": "Voldemort, CouchDB, Riak, Cassandra and DynamoDB align with which CAP choice?", "q_ar": "Voldemort و CouchDB و Riak و Cassandra و DynamoDB تتوافق مع أي اختيار من CAP؟", "answer": 1, "options": [{"en": "CP", "ar": "CP"}, {"en": "AP", "ar": "AP"}, {"en": "CA", "ar": "CA"}, {"en": "CAP (all three)", "ar": "CAP (الثلاثة معًا)"}], "why_ar": "هذه القواعد من نوع AP، أي تفضل التوافر وتحمل التقسيم على الاتساق الفوري.", "why_en": "These databases are AP (Availability + Partition tolerance).", "slide": [8, 9], "hot": false}, {"id": "ns-024", "lecture": "nosql", "topic_en": "CAP theorem", "topic_ar": "نظرية CAP", "type": "mcq", "q_en": "Which CAP combination is associated with relational databases, and is typically single-node (not truly possible in a distributed system)?", "q_ar": "أي تركيبة من CAP ترتبط بقواعد البيانات العلائقية، وتكون عادةً على عقدة واحدة (غير ممكنة فعليًا في نظام موزع)؟", "answer": 2, "options": [{"en": "CP", "ar": "CP"}, {"en": "AP", "ar": "AP"}, {"en": "CA", "ar": "CA"}, {"en": "CAP (all three)", "ar": "CAP (الثلاثة معًا)"}], "why_ar": "CA هي قواعد البيانات العلائقية، وتكون عادة على عقدة واحدة لأن النظام الموزع لا بد أن يتحمل التقسيم.", "why_en": "CA = relational databases, typically single-node.", "slide": [8, 9], "hot": false}, {"id": "ns-025", "lecture": "nosql", "topic_en": "Types of NoSQL databases", "topic_ar": "أنواع قواعد بيانات NoSQL", "type": "tf", "q_en": "NoSQL databases are classified into four types: key-value, document, column-family, and graph.", "q_ar": "تُصنَّف قواعد بيانات NoSQL إلى أربعة أنواع: المفتاح-القيمة (key-value)، والمستندات (document)، وعائلات الأعمدة (column-family)، والرسومية (graph).", "answer": true, "why_ar": "صحيح؛ أنواع NoSQL الأربعة هي: Key-value و Document و Column-family و Graph.", "why_en": "True — the four
